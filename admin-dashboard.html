<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RexTasks Admin</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#f5f9f7;
  --card:#fff;
  --text:#12231d;
  --muted:#708078;
  --border:#e3ebe7;
  --green:#08a34d;
  --dark:#063f2d;
  --blue:#287bea;
  --purple:#7655e8;
  --orange:#e9a11b;
  --red:#e14b55;
  --shadow:0 4px 18px rgba(6,63,45,.07);
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

button,a{
  font-family:inherit;
}

.app{
  max-width:760px;
  margin:auto;
  padding-bottom:95px;
}

/* HEADER */

header{
  height:70px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  position:sticky;
  top:0;
  z-index:30;
}

.menu{
  width:42px;
  height:42px;
  border:0;
  background:none;
  color:var(--text);
  cursor:pointer;
}

.menu svg{
  width:24px;
  height:24px;
}

.logo{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:21px;
  font-weight:800;
}

.logo-r{
  color:var(--green);
  font-size:35px;
  font-weight:900;
}

.admin{
  display:flex;
  align-items:center;
  gap:7px;
  border:1px solid var(--border);
  border-radius:25px;
  padding:6px 10px 6px 6px;
}

.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  background:var(--dark);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
}

.admin span{
  font-size:12px;
  font-weight:700;
}

.admin svg{
  width:15px;
}

/* SIDE MENU */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  z-index:80;
}

.overlay.show{display:block}

.side{
  position:fixed;
  left:-285px;
  top:0;
  bottom:0;
  width:275px;
  background:#063f2d;
  color:#fff;
  z-index:90;
  transition:.25s;
  padding:18px;
}

.side.open{left:0}

.side-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:25px;
}

.side-logo{
  font-size:21px;
  font-weight:800;
}

.close{
  border:0;
  background:none;
  color:#fff;
  font-size:27px;
}

.side a,
.side button{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  margin:3px 0;
  border:0;
  border-radius:10px;
  background:none;
  color:#fff;
  text-decoration:none;
  text-align:left;
  font-size:13px;
  cursor:pointer;
}

.side a.active,
.side a:hover,
.side button:hover{
  background:#087d49;
}

.side svg{
  width:20px;
  height:20px;
}

/* MAIN */

main{
  padding:17px 14px;
}

.title{
  margin:3px 4px 18px;
}

.title h1{
  margin:0;
  font-size:24px;
}

.online{
  color:var(--muted);
  font-size:13px;
  margin-top:7px;
}

.online i{
  display:inline-block;
  width:9px;
  height:9px;
  border-radius:50%;
  background:#13b65b;
  margin-right:6px;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.stat{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:17px;
  box-shadow:var(--shadow);
}

.stat-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.stat-label{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}

.stat-icon{
  width:42px;
  height:42px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.stat-icon svg{
  width:22px;
  height:22px;
}

.blue{background:#e5f0ff;color:var(--blue)}
.green{background:#def8e9;color:var(--green)}
.purple{background:#eee8ff;color:var(--purple)}
.orange{background:#fff1d8;color:var(--orange)}

.stat-number{
  font-size:25px;
  font-weight:800;
  margin-top:12px;
}

.stat-change{
  color:#12a957;
  font-size:11px;
  margin-top:7px;
}

/* CARDS */

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  box-shadow:var(--shadow);
  margin-top:17px;
  overflow:hidden;
}

.card-head{
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--border);
}

.card-head h2{
  margin:0;
  font-size:16px;
}

.view{
  color:var(--green);
  text-decoration:none;
  font-size:11px;
  font-weight:800;
}

/* SUBMISSIONS */

.submission{
  padding:14px 13px;
  border-bottom:1px solid var(--border);
}

.submission:last-child{
  border-bottom:0;
}

.sub-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.user{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.user-avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#dff3e8;
  color:var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:12px;
  flex-shrink:0;
}

.user-name{
  font-size:12px;
  font-weight:800;
}

.task-name{
  color:var(--muted);
  font-size:10px;
  margin-top:4px;
}

.reward{
  font-size:13px;
  font-weight:800;
}

.status{
  display:inline-block;
  padding:6px 9px;
  border-radius:8px;
  font-size:9px;
  font-weight:800;
}

.pending{
  background:#fff1cf;
  color:#c78b0b;
}

.approved{
  background:#dcf8e9;
  color:#079447;
}

.rejected{
  background:#ffe2e4;
  color:#d43f49;
}

.date{
  color:var(--muted);
  font-size:10px;
  margin-top:8px;
}

/* QUICK ACTIONS */

.actions{
  padding:13px;
}

.action{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  padding:13px;
  margin-bottom:9px;
  border-radius:11px;
  text-decoration:none;
  font-size:12px;
  font-weight:800;
}

.action:last-child{margin-bottom:0}

.action svg{
  width:21px;
  height:21px;
}

.action.blue-bg{
  background:#e9f2ff;
  color:#287bea;
}

.action.orange-bg{
  background:#fff4dc;
  color:#d99716;
}

.action.purple-bg{
  background:#eee8ff;
  color:#7451df;
}

.arrow{
  margin-left:auto;
  font-size:18px;
}

/* COUNTRIES */

.country{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px 16px;
  border-bottom:1px solid var(--border);
  font-size:12px;
}

.country:last-child{border-bottom:0}

.country strong{
  font-size:12px;
}

/* BOTTOM */

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:73px;
  background:var(--card);
  border-top:1px solid var(--border);
  z-index:40;
}

.bottom-inner{
  max-width:760px;
  height:100%;
  margin:auto;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.bottom a{
  text-decoration:none;
  color:#788880;
  font-size:9px;
  text-align:center;
}

.bottom svg{
  display:block;
  width:21px;
  height:21px;
  margin:auto auto 5px;
}

.bottom a.active{
  color:var(--blue);
  font-weight:800;
}

.loading{
  text-align:center;
  color:var(--muted);
  padding:40px;
}

.error{
  text-align:center;
  color:var(--red);
  padding:30px;
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://cetsxdkoauucxwsbdktl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_crwxMSen3GDl9BQZfy_QLg_o_uicRCD";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* MENU */

const side =
document.getElementById("side");

const overlay =
document.getElementById("overlay");

document.getElementById("menu")
.addEventListener("click",()=>{
  side.classList.add("open");
  overlay.classList.add("show");
});

document.getElementById("close")
.addEventListener("click",closeMenu);

overlay.addEventListener("click",closeMenu);

function closeMenu(){
  side.classList.remove("open");
  overlay.classList.remove("show");
}


/* LOGOUT */

document.getElementById("logout")
.addEventListener("click",async()=>{

  if(!confirm("Logout from admin panel?")) return;

  await db.auth.signOut();

  location.href="login.html";

});


/* DASHBOARD */

async function loadAdmin(){

  const content =
  document.getElementById("content");

  try{

    const {
      data:{session}
    } =
    await db.auth.getSession();

    if(!session){
      location.href="login.html";
      return;
    }

    const user =
    session.user;


    /* CHECK ADMIN */

    const {
      data:profile,
      error:profileError
    } =
    await db
    .from("profiles")
    .select("full_name,role")
    .eq("id",user.id)
    .maybeSingle();

    if(
      profileError ||
      !profile ||
      profile.role !== "admin"
    ){

      content.innerHTML=`
        <div class="error">
          Admin access required.
        </div>
      `;

      return;
    }


    /* COUNTS */

    const usersResult =
    await db
    .from("profiles")
    .select("id",{count:"exact",head:true});

    const tasksResult =
    await db
    .from("tasks")
    .select("id",{count:"exact",head:true});

    const submissionsResult =
    await db
    .from("task_submissions")
    .select("id",{count:"exact",head:true});


    /* TOTAL PAID */

    const {
      data:paidRows
    } =
    await db
    .from("task_submissions")
    .select("user_reward")
    .eq("status","approved");


    let totalPaid=0;

    (paidRows||[]).forEach(row=>{
      totalPaid += Number(row.user_reward||0);
    });


    /* RECENT */

    const {
      data:recent
    } =
    await db
    .from("task_submissions")
    .select(`
      id,
      user_id,
      status,
      user_reward,
      created_at,
      tasks(title)
    `)
    .order("created_at",{ascending:false})
    .limit(5);


    /* COUNTRY COUNTS */

    const {
      data:profiles
    } =
    await db
    .from("profiles")
    .select("country");


    const countryMap={};

    (profiles||[]).forEach(p=>{

      const country =
      p.country || "Unknown";

      countryMap[country] =
      (countryMap[country]||0)+1;

    });


    const countries =
    Object.entries(countryMap)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,3);


    let submissionsHTML="";


    if(!recent || !recent.length){

      submissionsHTML=`
        <div class="loading">
          No submissions yet.
        </div>
      `;

    }else{

      recent.forEach(row=>{

        const status =
        String(row.status||"pending")
        .toLowerCase();

        const statusClass =
        status==="approved"
        ?"approved"
        :status==="rejected" || status==="denied"
        ?"rejected"
        :"pending";

        const statusText =
        status==="approved"
        ?"Approved"
        :status==="rejected" || status==="denied"
        ?"Rejected"
        :"Pending";

        const reward =
        Number(row.user_reward||0);

        const userShort =
        row.user_id
        ?row.user_id.substring(0,8)
        :"User";

        const taskTitle =
        row.tasks?.title || "Task";

        const date =
        new Date(row.created_at)
        .toLocaleDateString(
          undefined,
          {
            month:"short",
            day:"numeric"
          }
        );

        submissionsHTML+=`

          <div class="submission">

            <div class="sub-top">

              <div class="user">

                <div class="user-avatar">
                  ${userShort.charAt(0).toUpperCase()}
                </div>

                <div>

                  <div class="user-name">
                    ${userShort}
                  </div>

                  <div class="task-name">
                    ${escapeHTML(taskTitle)}
                  </div>

                </div>

              </div>

              <div class="reward">
                $${reward.toFixed(2)}
              </div>

            </div>

            <div style="
              display:flex;
              align-items:center;
              justify-content:space-between;
              margin-top:9px">

              <span class="status ${statusClass}">
                ${statusText}
              </span>

              <span class="date">
                ${date}
              </span>

            </div>

          </div>
        `;

      });

    }


    let countryHTML="";

    if(!countries.length){

      countryHTML=`
        <div class="country">
          <span>No country data yet</span>
        </div>
      `;

    }else{

      countries.forEach(c=>{

        countryHTML+=`
          <div class="country">
            <span>${escapeHTML(c[0])}</span>
            <strong>${c[1]}</strong>
          </div>
        `;

      });

    }


    content.innerHTML=`

      <div class="title">

        <h1>
          Admin Dashboard
        </h1>

        <div class="online">
          <i></i>
          System Online
        </div>

      </div>


      <div class="stats">

        <div class="stat">

          <div class="stat-top">

            <span class="stat-label">
              Total Users
            </span>

            <div class="stat-icon blue">

              <svg viewBox="0 0 24 24"
                   fill="none"
                   stroke="currentColor"
                   stroke-width="2">

                <circle cx="9" cy="8" r="3"/>
                <circle cx="17" cy="10" r="3"/>
                <path d="M3 20c0-3 2-5 6-5s6 2 6 5"/>
                <path d="M14 16c4 0 6 1 7 4"/>

              </svg>

            </div>

          </div>

          <div class="stat-number">
            ${usersResult.count||0}
          </div>

          <div class="stat-change">
            Platform users
          </div>

        </div>


        <div class="stat">

          <div class="stat-top">

            <span class="stat-label">
              Total Tasks
            </span>

            <div class="stat-icon green">

              <svg viewBox="0 0 24 24"
                   fill="none"
                   stroke="currentColor"
                   stroke-width="2">

                <rect x="5" y="3"
                      width="14"
                      height="18"
                      rx="2"/>

                <path d="M8 8h8M8 12h6M8 16h4"/>

              </svg>

            </div>

          </div>

          <div class="stat-number">
            ${tasksResult.count||0}
          </div>

          <div class="stat-change">
            Manual tasks
          </div>

        </div>


        <div class="stat">

          <div class="stat-top">

            <span class="stat-label">
              Total Submissions
            </span>

            <div class="stat-icon purple">

              <svg viewBox="0 0 24 24"
                   fill="none"
                   stroke="currentColor"
                   stroke-width="2">

                <path d="M6 3h9l3 3v15H6z"/>
                <path d="M14 3v4h4"/>
                <path d="M9 12h6M9 16h6"/>

              </svg>

            </div>

          </div>

          <div class="stat-number">
            ${submissionsResult.count||0}
          </div>

          <div class="stat-change">
            Task submissions
          </div>

        </div>


        <div class="stat">

          <div class="stat-top">

            <span class="stat-label">
              Total Paid
            </span>

            <div class="stat-icon orange">

              <svg viewBox="0 0 24 24"
                   fill="none"
                   stroke="currentColor"
                   stroke-width="2">

                <path d="M12 2v20"/>
                <path d="M17 6.5c0-2-2-3-5-3s-5 1-5 3 2 3 5 4 5 2 5 4-2 3-5 3-5-1-5-3"/>

              </svg>

            </div>

          </div>

          <div class="stat-number">
            $${totalPaid.toFixed(2)}
          </div>

          <div class="stat-change">
            Approved task rewards
          </div>

        </div>

      </div>


      <div class="card">

        <div class="card-head">

          <h2>
            Recent Submissions
          </h2>

          <a class="view"
             href="admin-submissions.html">
            View All
          </a>

        </div>

        ${submissionsHTML}

      </div>


      <div class="card">

        <div class="card-head">

          <h2>
            Quick Actions
          </h2>

        </div>


        <div class="actions">

          <a
            class="action blue-bg"
            href="admin-tasks.html">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">

              <rect x="4" y="4"
                    width="16"
                    height="16"
                    rx="3"/>

              <path d="M12 8v8M8 12h8"/>

            </svg>

            Add New Task

            <span class="arrow">›</span>

          </a>


          <a
            class="action blue-bg"
            href="admin-tasks.html">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">

              <rect x="4" y="4"
                    width="16"
                    height="16"
                    rx="3"/>

              <path d="M8 9h8M8 13h6M8 17h4"/>

            </svg>

            Manage Tasks

            <span class="arrow">›</span>

          </a>


          <a
            class="action orange-bg"
            href="admin-withdrawals.html">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">

              <rect x="3" y="5"
                    width="18"
                    height="14"
                    rx="3"/>

              <path d="M3 10h18"/>

            </svg>

            View Withdrawals

            <span class="arrow">›</span>

          </a>


          <a
            class="action purple-bg"
            href="admin-users.html">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">

              <circle cx="9" cy="8" r="3"/>
              <circle cx="17" cy="10" r="3"/>
              <path d="M3 20c0-3 2-5 6-5s6 2 6 5"/>

            </svg>

      </div>


      <div class="card">

        <div class="card-head">

          <h2>
            Top Countries
          </h2>

        </div>

        ${countryHTML}

      </div>

    `;

  }catch(error){

    console.error(error);

    content.innerHTML=`
      <div class="error">
        Unable to load admin dashboard.
        <br><br>
        ${escapeHTML(error.message||"Please try again.")}
      </div>
    `;

  }

}


function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

loadAdmin();

</script>
