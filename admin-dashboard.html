<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>TallyBuck Admin — Dashboard</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#07111f;
  --panel:#0c1727;
  --panel2:#101d30;
  --panel3:#142238;
  --text:#f4f8fc;
  --muted:#8291a5;
  --border:#1d2b3e;

  --green:#27d17f;
  --green-dark:#0b8f52;
  --green-soft:rgba(39,209,127,.11);

  --blue:#4d8dff;
  --blue-soft:rgba(77,141,255,.12);

  --purple:#9a7cff;
  --purple-soft:rgba(154,124,255,.12);

  --gold:#eabf62;
  --gold-soft:rgba(234,191,98,.12);

  --red:#ff6875;
  --red-soft:rgba(255,104,117,.12);

  --shadow:0 12px 35px rgba(0,0,0,.18);
}

html{
  background:var(--bg);
}

body{
  margin:0;
  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(39,209,127,.07),
      transparent 35%
    ),
    var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

button,
a{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
  position:fixed;
  top:0;
  left:0;
  bottom:0;
  width:250px;
  background:#091421;
  border-right:1px solid var(--border);
  z-index:100;
  display:flex;
  flex-direction:column;
  transition:.25s ease;
}

.brand{
  height:76px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 20px;
  border-bottom:1px solid var(--border);
}

.brand-mark{
  width:38px;
  height:38px;
  border-radius:11px;
  background:linear-gradient(135deg,#27d17f,#0c9e5a);
  color:#03140d;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  font-weight:900;
  box-shadow:0 8px 22px rgba(39,209,127,.16);
}

.brand-name{
  font-size:18px;
  font-weight:900;
  letter-spacing:-.3px;
}

.brand-sub{
  display:block;
  color:var(--muted);
  font-size:9px;
  font-weight:700;
  margin-top:2px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.nav{
  padding:18px 12px;
  overflow-y:auto;
  flex:1;
}

.nav-label{
  color:#506075;
  font-size:9px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1.3px;
  padding:0 10px 9px;
}

.nav a,
.logout{
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  padding:11px 12px;
  margin-bottom:4px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#8e9caf;
  text-decoration:none;
  text-align:left;
  font-size:12px;
  font-weight:700;
  transition:.18s ease;
}

.nav a svg,
.logout svg{
  width:18px;
  height:18px;
  flex-shrink:0;
}

.nav a:hover,
.logout:hover{
  background:#101f31;
  color:#eaf1f7;
}

.nav a.active{
  background:var(--green-soft);
  color:var(--green);
  box-shadow:inset 3px 0 0 var(--green);
}

.nav-section{
  margin-top:19px;
}

.sidebar-bottom{
  padding:12px;
  border-top:1px solid var(--border);
}

/* =========================================================
   MOBILE SIDEBAR
========================================================= */

.mobile-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  z-index:90;
}

.mobile-overlay.show{
  display:block;
}

/* =========================================================
   MAIN
========================================================= */

.main{
  margin-left:250px;
  min-height:100vh;
}

/* =========================================================
   HEADER
========================================================= */

.header{
  height:76px;
  background:rgba(9,20,33,.92);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  position:sticky;
  top:0;
  z-index:50;
}

.mobile-menu{
  display:none;
  width:40px;
  height:40px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--panel);
  color:var(--text);
  align-items:center;
  justify-content:center;
}

.mobile-menu svg{
  width:21px;
  height:21px;
}

.header-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.page-label{
  font-size:15px;
  font-weight:800;
}

.header-right{
  display:flex;
  align-items:center;
  gap:13px;
}

.system-status{
  display:flex;
  align-items:center;
  gap:7px;
  color:#8391a3;
  font-size:11px;
  font-weight:700;
}

.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 0 4px rgba(39,209,127,.08);
}

.admin-profile{
  display:flex;
  align-items:center;
  gap:9px;
  border:1px solid var(--border);
  background:var(--panel);
  border-radius:12px;
  padding:5px 10px 5px 5px;
}

.admin-avatar{
  width:32px;
  height:32px;
  border-radius:9px;
  background:var(--green-soft);
  color:var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:900;
}

.admin-name{
  font-size:11px;
  font-weight:800;
}

/* =========================================================
   CONTENT
========================================================= */

.content{
  max-width:1180px;
  margin:auto;
  padding:28px 25px 45px;
}

.page-heading{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:25px;
}

.page-heading h1{
  font-size:27px;
  letter-spacing:-.6px;
  margin:0;
}

.page-heading p{
  color:var(--muted);
  font-size:12px;
  margin-top:7px;
}

.date-box{
  border:1px solid var(--border);
  background:var(--panel);
  border-radius:10px;
  padding:9px 12px;
  color:var(--muted);
  font-size:10px;
}

/* =========================================================
   STATS
========================================================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:13px;
}

.stat{
  background:linear-gradient(
    145deg,
    rgba(16,29,48,.98),
    rgba(10,22,36,.98)
  );
  border:1px solid var(--border);
  border-radius:15px;
  padding:17px;
  box-shadow:var(--shadow);
}

.stat-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.stat-label{
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.stat-icon{
  width:38px;
  height:38px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.stat-icon svg{
  width:19px;
  height:19px;
}

.stat-icon.green{
  color:var(--green);
  background:var(--green-soft);
}

.stat-icon.blue{
  color:var(--blue);
  background:var(--blue-soft);
}

.stat-icon.purple{
  color:var(--purple);
  background:var(--purple-soft);
}

.stat-icon.gold{
  color:var(--gold);
  background:var(--gold-soft);
}

.stat-number{
  margin-top:17px;
  font-size:25px;
  font-weight:900;
  letter-spacing:-.4px;
}

.stat-description{
  color:#607086;
  font-size:10px;
  margin-top:6px;
}

/* =========================================================
   GRID
========================================================= */

.dashboard-grid{
  display:grid;
  grid-template-columns:minmax(0,1.5fr) minmax(280px,.8fr);
  gap:15px;
  margin-top:15px;
}

/* =========================================================
   CARDS
========================================================= */

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:15px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.card-header{
  min-height:59px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:0 16px;
  border-bottom:1px solid var(--border);
}

.card-title{
  font-size:13px;
  font-weight:900;
}

.card-link{
  color:var(--green);
  font-size:10px;
  font-weight:800;
  text-decoration:none;
}

.card-link:hover{
  text-decoration:underline;
}

/* =========================================================
   SUBMISSIONS
========================================================= */

.submission{
  padding:14px 16px;
  border-bottom:1px solid var(--border);
}

.submission:last-child{
  border-bottom:0;
}

.submission-main{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}

.user-info{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.user-avatar{
  width:36px;
  height:36px;
  border-radius:10px;
  background:#16283c;
  color:#a9b9ca;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:900;
  flex-shrink:0;
}

.user-details{
  min-width:0;
}

.user-id{
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:180px;
}

.task-name{
  color:var(--muted);
  font-size:10px;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:180px;
}

.sub-right{
  text-align:right;
  flex-shrink:0;
}

.reward{
  font-size:12px;
  font-weight:900;
}

.status{
  display:inline-flex;
  align-items:center;
  padding:5px 8px;
  border-radius:7px;
  margin-top:6px;
  font-size:8px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.3px;
}

.status.pending{
  background:var(--gold-soft);
  color:var(--gold);
}

.status.approved{
  background:var(--green-soft);
  color:var(--green);
}

.status.rejected,
.status.denied{
  background:var(--red-soft);
  color:var(--red);
}

.sub-bottom{
  color:#5e6e81;
  font-size:9px;
  margin-top:9px;
}

/* =========================================================
   QUICK ACTIONS
========================================================= */

.quick-actions{
  padding:12px;
}

.quick-action{
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px;
  border:1px solid var(--border);
  background:#0d1a2b;
  border-radius:10px;
  color:var(--text);
  text-decoration:none;
  margin-bottom:8px;
  transition:.18s ease;
}

.quick-action:last-child{
  margin-bottom:0;
}

.quick-action:hover{
  background:#122238;
  border-color:#2a3c53;
  transform:translateY(-1px);
}

.quick-icon{
  width:35px;
  height:35px;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.quick-icon svg{
  width:18px;
  height:18px;
}

.quick-icon.green{
  background:var(--green-soft);
  color:var(--green);
}

.quick-icon.blue{
  background:var(--blue-soft);
  color:var(--blue);
}

.quick-icon.gold{
  background:var(--gold-soft);
  color:var(--gold);
}

.quick-icon.purple{
  background:var(--purple-soft);
  color:var(--purple);
}

.quick-text{
  flex:1;
}

.quick-title{
  font-size:11px;
  font-weight:800;
}

.quick-sub{
  color:#607086;
  font-size:9px;
  margin-top:3px;
}

.quick-arrow{
  color:#5d6d80;
  font-size:18px;
}

/* =========================================================
   COUNTRY
========================================================= */

.country-list{
  padding:3px 0;
}

.country{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:12px 16px;
  border-bottom:1px solid var(--border);
}

.country:last-child{
  border-bottom:0;
}

.country-name{
  font-size:11px;
  font-weight:700;
}

.country-count{
  color:var(--muted);
  font-size:10px;
  font-weight:800;
}

/* =========================================================
   BOTTOM INFO
========================================================= */

.bottom-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:15px;
}

/* =========================================================
   EMPTY / LOADING
========================================================= */

.loading{
  text-align:center;
  color:var(--muted);
  padding:45px 20px;
  font-size:12px;
}

.error{
  text-align:center;
  color:var(--red);
  padding:45px 20px;
  font-size:12px;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1000px){

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .dashboard-grid{
    grid-template-columns:1fr;
  }

  .bottom-grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:760px){

  .sidebar{
    left:-260px;
    width:250px;
    box-shadow:20px 0 50px rgba(0,0,0,.3);
  }

  .sidebar.open{
    left:0;
  }

  .main{
    margin-left:0;
  }

  .header{
    height:68px;
    padding:0 14px;
  }

  .mobile-menu{
    display:flex;
  }

  .page-label{
    display:none;
  }

  .system-status{
    display:none;
  }

  .admin-name{
    display:none;
  }

  .content{
    padding:21px 13px 35px;
  }

  .page-heading{
    align-items:flex-start;
    margin-bottom:19px;
  }

  .page-heading h1{
    font-size:23px;
  }

  .date-box{
    display:none;
  }

  .stats{
    grid-template-columns:1fr 1fr;
    gap:9px;
  }

  .stat{
    padding:13px;
  }

  .stat-label{
    font-size:9px;
  }

  .stat-icon{
    width:34px;
    height:34px;
  }

  .stat-icon svg{
    width:17px;
    height:17px;
  }

  .stat-number{
    font-size:21px;
    margin-top:14px;
  }

  .dashboard-grid,
  .bottom-grid{
    gap:11px;
    margin-top:11px;
  }

}

@media(max-width:390px){

  .stats{
    grid-template-columns:1fr;
  }

  .stat{
    padding:15px;
  }

  .stat-number{
    font-size:23px;
  }

}
</style>
</head>

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
