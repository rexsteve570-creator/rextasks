<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">

<title>Forgot Password — TallyBuck</title><style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100vh;
  background:
    radial-gradient(circle at top right,rgba(35,197,94,.12),transparent 32%),
    #06100b;
  color:#f4faf6;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.container{
  width:100%;

}

.logo{

}

.card{
  background:rgba(10,25,17,.92);
  border:1px solid rgba(91,214,133,.16);
  border-radius:24px;
  padding:30px 24px;
  box-shadow:0 24px 70px rgba(0,0,0,.35);
}

.icon{
  width:58px;

  font-size:27px;
  margin-bottom:10px;
  letter-spacing:-.5px;
}

.subtitle{
  text-align:center;
  color:#91a99b;
  line-height:1.6;
  font-size:14px;
  margin-bottom:28px;
}

label{
  display:block;
  font-size:13px;
  font-weight:600;
  color:#cce0d3;
  margin-bottom:8px;
}

input{
  width:100%;
  height:52px;
  border-radius:14px;
  border:1px solid #23392b;
  background:#08150e;
  color:#fff;
  outline:none;
  padding:0 15px;
  font-size:15px;
  transition:.2s;
}

input:focus{
  border-color:#35d878;
  box-shadow:0 0 0 3px rgba(53,216,120,.08);
}

.input-group{
  margin-bottom:18px;
}

button{
  width:100%;
  height:52px;
  border:0;
  border-radius:14px;
  background:#35d878;
  color:#041008;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

  background:#48e687;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  margin-top:18px;
  padding:13px 14px;

}

.message.success{
  display:block;
  background:rgba(53,216,120,.08);
  border:1px solid rgba(53,216,120,.2);
  color:#8af0b3;
}

.message.error{
  display:block;
  background:rgba(239,68,68,.08);
  border:1px solid rgba(239,68,68,.2);

}

.back{

}

.back a{
  color:#70e99d;

}

</style></head><body><div class="container">  <div class="logo">
    <a href="index.html">Tally<span>Buck</span></a>
  </div>  <div class="card"><div class="icon">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="18" height="14" rx="2"></rect>
    <path d="m3 7 9 6 9-6"></path>
  </svg>
</div>

<h1>Forgot your password?</h1>

<p class="subtitle">
  Enter the email address connected to your TallyBuck account and we'll send you a secure password reset link.
</p>

<form id="resetForm">

  <div class="input-group">
    <label for="email">Email address</label>
    <input
      type="email"
      id="email"
      placeholder="you@example.com"
      autocomplete="email"
      required
    >
  </div>

  <button type="submit" id="resetBtn">
    Send reset link
  </button>

</form>

<div id="message" class="message"></div>

<div class="back">
  <a href="login.html">← Back to Log in</a>
</div>

  </div>  <div class="footer">
    TallyBuck is a rewards platform for completing eligible tasks and activities.
  </div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL = "https://cetsxdkoauucxwsbdktl.supabase.co";
const SUPABASE_KEY = "sb_publishable_crwxMSen3GDl9BQZfy_QLg_o_uicRCD";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form = document.getElementById("resetForm");
const emailInput = document.getElementById("email");
const resetBtn = document.getElementById("resetBtn");
const message = document.getElementById("message");

function showMessage(text, type){
  message.textContent = text;
  message.className = "message " + type;
}

form.addEventListener("submit", async (event) => {

  event.preventDefault();

  const email = emailInput.value.trim();

  if(!email){
    showMessage("Please enter your email address.", "error");
    return;
  }

  resetBtn.disabled = true;
  resetBtn.textContent = "Sending...";

  message.className = "message";
  message.textContent = "";

  try{

    const { error } = await supabaseClient.auth.resetPasswordForEmail(
      email,
      {
        redirectTo: window.location.origin + "/reset-password.html"
      }
    );

    if(error){
      throw error;
    }

    showMessage(
      "If an account exists with this email, a password reset link has been sent. Please check your inbox.",
      "success"
    );

    form.reset();

  }catch(error){

    showMessage(
      error.message || "Unable to send the reset email. Please try again.",
      "error"
    );

  }finally{

    resetBtn.disabled = false;
    resetBtn.textContent = "Send reset link";

  }

});
</script></body>
</html>
