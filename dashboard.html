<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>RexTasks — Dashboard</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#f6faf8;
  --card:#fff;
  --text:#13251e;
  --muted:#718078;
  --border:#e2ece7;
  --green:#079447;
  --darkgreen:#063f2d;
  --lightgreen:#e9f8ef;
  --shadow:0 4px 18px rgba(8,61,43,.07);
}

body.dark{
  --bg:#06140e;
  --card:#0c2118;
  --text:#effaf4;
  --muted:#91aa9e;
  --border:#1b3b2d;
  --green:#5ee59a;
  --darkgreen:#052d20;
  --lightgreen:#123a29;
  --shadow:0 5px 20px rgba(0,0,0,.25);
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  transition:.25s;
}

button,a{
  font-family:inherit;
}

.app{
  max-width:760px;
  margin:auto;
  min-height:100vh;
  padding-bottom:90px;
}

/* HEADER */

header{
  height:72px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:sticky;
  top:0;
  z-index:20;
}

.menu-btn,
.icon-btn{
  width:40px;
  height:40px;
  border:0;
  background:transparent;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  border-radius:12px;
}

.menu-btn svg,
.icon-btn svg{
  width:23px;
  height:23px;
}

.logo{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:22px;
  font-weight:800;
  color:var(--text);
}

.logo-mark{
  width:32px;
  height:32px;
  position:relative;
  color:var(--green);
  font-size:37px;
  line-height:27px;
  font-weight:900;
}

.header-right{
  display:flex;
  align-items:center;
  gap:5px;
}

.notification{
  position:relative;
}

.notification-dot{
  position:absolute;
  right:5px;
  top:5px;
  width:8px;
  height:8px;
  background:#08a84f;
  border:2px solid var(--card);
  border-radius:50%;
}

/* THEME */

.theme-wrap{
  position:relative;
}

.theme-btn{
  width:44px;
  height:40px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--green);
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:3px;
  cursor:pointer;
}

.theme-btn svg{
  width:19px;
  height:19px;
}

.theme-menu{
  display:none;
  position:absolute;
  right:0;
  top:47px;
  width:135px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:13px;
  padding:6px;
  box-shadow:var(--shadow);
  z-index:50;
}

.theme-menu.show{
  display:block;
}

.theme-option{
  width:100%;
  border:0;
  background:transparent;
  color:var(--text);
  padding:10px;
  border-radius:9px;
  text-align:left;
  cursor:pointer;
}

.theme-option:hover{
  background:var(--lightgreen);
}

/* CONTENT */

main{
  padding:16px;
}

.welcome{
  margin:3px 2px 17px;
}

.welcome h2{
  margin:0;
  font-size:22px;
}

.welcome p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:13px;
}

/* WALLET */

.wallet{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.wallet-main{
  padding:20px 20px 16px;
  position:relative;
}

.wallet-label{
  font-size:14px;
  font-weight:700;
}

.wallet-balance{
  color:var(--green);
  font-size:38px;
  font-weight:800;
  margin-top:7px;
  letter-spacing:-1px;
}

.eye{
  position:absolute;
  right:17px;
  top:20px;
  color:#77b99a;
}

.eye svg{
  width:21px;
  height:21px;
}

.wallet-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border-top:1px solid var(--border);
}

.wallet-stat{
  padding:14px 12px;
  border-right:1px solid var(--border);
}

.wallet-stat:last-child{
  border-right:0;
}

.wallet-stat small{
  display:block;
  color:var(--muted);
  font-size:11px;
  white-space:nowrap;
}

.wallet-stat strong{
  display:block;
  margin-top:5px;
  font-size:15px;
}

/* SURVEY BANNER */

.survey-banner{
  margin-top:17px;
  min-height:150px;
  border-radius:17px;
  overflow:hidden;
  position:relative;
  background:linear-gradient(120deg,#072f22,#078342);
  color:white;
  padding:22px 20px;
}

.survey-banner:after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  right:-55px;
  top:-45px;
  background:rgba(100,235,157,.15);
  border-radius:50%;
}

.survey-banner h2{
  position:relative;
  z-index:2;
  margin:0;
  font-size:20px;
}

.survey-banner p{
  position:relative;
  z-index:2;
  margin:8px 0 14px;
  font-size:12px;
  color:#d8f6e4;
}

.survey-button{
  position:relative;
  z-index:3;
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:#13c663;
  color:white;
  border:0;
  border-radius:10px;
  padding:11px 16px;
  font-size:12px;
  font-weight:800;
  text-decoration:none;
}

.survey-art{
  position:absolute;
  right:25px;
  bottom:13px;
  width:82px;
  height:82px;
  z-index:2;
}

.clipboard{
  width:55px;
  height:68px;
  background:#fff;
  border-radius:7px;
  position:absolute;
  left:5px;
  bottom:0;
  box-shadow:0 5px 12px rgba(0,0,0,.2);
}

.clip{
  position:absolute;
  width:25px;
  height:10px;
  border-radius:5px;
  background:#d6e0db;
  top:-6px;
  left:15px;
}

.check{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#19bd68;
  margin:15px 0 0 9px;
}

.check:after{
  content:"";
  display:block;
  width:24px;
  height:2px;
  background:#d4e6dc;
  margin:4px 0 0 14px;
}

/* FEATURE GRID */

.features{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:11px;
  margin-top:17px;
}

.feature{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:15px 9px;
  min-height:128px;
  text-decoration:none;
  color:var(--text);
  text-align:center;
  box-shadow:var(--shadow);
}

.feature-icon{
  width:43px;
  height:43px;
  border-radius:50%;
  margin:0 auto 10px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.feature-icon svg{
  width:21px;
  height:21px;
}

.green{
  background:#dff8e9;
  color:#08a34d;
}

.blue{
  background:#e2f0ff;
  color:#1989db;
}

.orange{
  background:#fff0d8;
  color:#ed9a00;
}

.purple{
  background:#e9e4ff;
  color:#6251e9;
}

.cyan{
  background:#dff7f7;
  color:#079fa5;
}

.pink{
  background:#ffe2ec;
  color:#e63373;
}

.feature strong{
  display:block;
  font-size:13px;
}

.feature span{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:5px;
}

/* SECTION */

.section{
  margin-top:21px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.section-title h3{
  margin:0;
  font-size:17px;
}

.section-title a{
  color:var(--green);
  text-decoration:none;
  font-size:12px;
  font-weight:700;
}

/* ACTIVITY */

.activity{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.activity-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 13px;
  border-bottom:1px solid var(--border);
}

.activity-row:last-child{
  border-bottom:0;
}

.activity-left{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
}

.activity-icon{
  width:36px;
  height:36px;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.activity-icon svg{
  width:18px;
  height:18px;
}

.activity-name{
  font-size:12px;
  font-weight:700;
}

.activity-date{
  color:var(--muted);
  font-size:10px;
  margin-top:4px;
}

.activity-amount{
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
}

/* TELEGRAM */

.telegram{
  margin-top:15px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  padding:14px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:var(--shadow);
}

.telegram-icon{
  width:43px;
  height:43px;
  border-radius:50%;
  background:#229ed9;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.telegram-icon svg{
  width:24px;
  height:24px;
}

.telegram-text{
  flex:1;
  min-width:0;
}

.telegram-text strong{
  display:block;
  font-size:13px;
}

.telegram-text span{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:4px;
}

.join{
  background:#08a34d;
  color:white;
  text-decoration:none;
  padding:10px 16px;
  border-radius:9px;
  font-size:12px;
  font-weight:800;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:73px;
  background:var(--card);
  border-top:1px solid var(--border);
  z-index:30;
}

.nav-inner{
  max-width:760px;
  height:100%;
  margin:auto;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{
  text-decoration:none;
  color:#83928b;
  font-size:10px;
  text-align:center;
  min-width:58px;
  position:relative;
}

.nav-item svg{
  display:block;
  width:21px;
  height:21px;
  margin:0 auto 5px;
}

.nav-item.active{
  color:var(--green);
  font-weight:800;
}

.nav-item.active:after{
  content:"";
  position:absolute;
  width:28px;
  height:3px;
  border-radius:5px;
  background:var(--green);
  bottom:-8px;
  left:50%;
  transform:translateX(-50%);
}

.loading{
  text-align:center;
  color:var(--muted);
  padding:45px 10px;
}

.empty{
  text-align:center;
  padding:25px;
  color:var(--muted);
  font-size:12px;
}

/* DESKTOP */

@media(min-width:700px){

  .features{
    gap:14px;
  }

  main{
    padding:22px;
  }

}
</style>
</head>

<body>

<div class="app">

<header>

<button class="menu-btn" aria-label="Menu">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

<path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>

</div>

</div>

Surveys

</svg>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://cetsxdkoauucxwsbdktl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_crwxMSen3GDl9BQZfy_QLg_o_uicRCD";

const db = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================================
   THEME
========================================================= */

const themeBtn =
document.getElementById("themeBtn");

const themeMenu =
document.getElementById("themeMenu");

themeBtn.addEventListener("click",()=>{
themeMenu.classList.toggle("show");
});

function setTheme(theme){

localStorage.setItem(
"rextasks-theme",
theme
);

applyTheme(theme);

themeMenu.classList.remove("show");
}

function applyTheme(theme){

let dark=false;

if(theme==="dark"){
dark=true;
}

if(theme==="system"){
dark=window.matchMedia(
"(prefers-color-scheme:dark)"
).matches;
}

document.body.classList.toggle(
"dark",
dark
);
}

const savedTheme =
localStorage.getItem("rextasks-theme")
||"system";

applyTheme(savedTheme);

window.matchMedia(
"(prefers-color-scheme:dark)"
).addEventListener(
"change",
()=>{
if(
(localStorage.getItem("rextasks-theme")||"system")
==="system"
){
applyTheme("system");
}
}
);


/* =========================================================
   LOAD DASHBOARD
========================================================= */

const page =
document.getElementById("page");


async function loadDashboard(){

const {
data:{session},
error:sessionError
} = await db.auth.getSession();


if(sessionError || !session){

location.href="login.html";
return;

}


const user =
session.user;


/* PROFILE */

const {data:profile} =
await db
.from("profiles")
.select("full_name,country")
.eq("id",user.id)
.maybeSingle();


const fullName =
profile?.full_name ||
user.user_metadata?.full_name ||
user.email?.split("@")[0] ||
"User";


/* WALLET */

const {data:wallet} =
await db
.from("wallets")
.select(
"balance,total_earned,referral_earnings"
)
.eq("user_id",user.id)
.maybeSingle();


/* APPROVED TASKS */

const {data:approved} =
await db
.from("task_submissions")
.select("id")
.eq("user_id",user.id)
.eq("status","approved");


const completed =
approved?.length || 0;


/* REFERRALS */

const {data:referrals} =
await db
.from("referrals")
.select("id")
.eq("referrer_id",user.id);


const referralCount =
referrals?.length || 0;


/* TASKS */

const {data:tasks} =
await db
.from("tasks")
.select(`
id,
title,
description,
payout,
user_reward_percent,
task_url,
status
`)
.eq("status","active")
.order("created_at",{ascending:false})
.limit(4);


/* RECENT ACTIVITY */

const {data:activity} =
await db
.from("task_submissions")
.select(`
id,
status,
user_reward,
created_at,
tasks(title)
`)
.eq("user_id",user.id)
.order("created_at",{ascending:false})
.limit(4);


/* VALUES */

const balance =
Number(wallet?.balance || 0);

const totalEarned =
Number(wallet?.total_earned || 0);

const referralEarnings =
Number(wallet?.referral_earnings || 0);


/* TASKS */

let taskCards="";

if(tasks && tasks.length){

tasks.forEach(task=>{

const payout =
Number(task.payout || 0);

const percentage =
Number(task.user_reward_percent || 0);

const reward =
payout * percentage / 100;


taskCards += `

<div class="feature" style="text-align:left;min-height:145px">

<div class="feature-icon green"
style="margin:0 0 9px">

<svg viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<rect x="4" y="4"
width="16"
height="16"
rx="3"/>

<path d="M8 9h8M8 13h6M8 17h4"/>

</svg>

</div>

<strong>
${escapeHtml(task.title)}
</strong>

<span>
Earn $${reward.toFixed(2)}
</span>

<a
href="submit-task.html?task=${encodeURIComponent(task.id)}"
style="
display:block;
margin-top:12px;
background:#079447;
color:white;
padding:8px;
border-radius:8px;
text-align:center;
text-decoration:none;
font-size:11px;
font-weight:700;
">
Start Task
</a>

</div>

`;

});

}


/* ACTIVITY */

let activityHTML="";

if(activity && activity.length){

activity.forEach(row=>{

const title =
row.tasks?.title ||
"Task";

const status =
String(row.status || "")
.toLowerCase();

const reward =
Number(row.user_reward || 0);

const date =
new Date(row.created_at)
.toLocaleDateString(
undefined,
{
month:"short",
day:"numeric",
year:"numeric"
}
);


let iconClass="green";
let amount="";
let statusText="";

if(status==="approved"){

iconClass="green";
amount="+$"+reward.toFixed(2);

}else if(status==="pending"){

iconClass="orange";
amount="Pending";

}else{

iconClass="purple";
amount="Denied";

}


activityHTML += `

<div class="activity-row">

<div class="activity-left">

<div class="activity-icon ${iconClass}">

<svg viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<path d="M6 3h9l3 3v15H6z"/>
<path d="M14 3v4h4"/>
<path d="m9 13 2 2 4-4"/>

</svg>

</div>

<div>

<div class="activity-name">
${escapeHtml(title)}
</div>

<div class="activity-date">
${escapeHtml(date)}
</div>

</div>

</div>

<div
class="activity-amount"
style="color:${
status==="approved"
?"#079447":
status==="pending"
?"#c58b00":
"#c74343"
}">
${escapeHtml(amount)}
</div>

</div>

`;

});

}else{

activityHTML=`
<div class="empty">
No activity yet.
</div>
`;

}


/* PAGE */

page.className="";

page.innerHTML=`

<div class="welcome">

<h2>
Welcome back, ${escapeHtml(fullName)}
</h2>

<p>
Let's complete some tasks and earn more!
</p>

</div>


<div class="wallet">

<div class="wallet-main">

<div class="wallet-label">
Wallet Balance
</div>

<div class="wallet-balance">
$${balance.toFixed(2)}
</div>

<div class="eye">

<svg viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
