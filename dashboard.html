<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RexTasks — Dashboard</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f5faf7;
color:#14251d;
font-family:Arial,sans-serif;
}

header{
background:#073b29;
color:white;
padding:18px 16px 22px;
}

.header{
max-width:760px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:22px;
font-weight:800;
color:#8ff0b8;
}

.profile{
width:42px;
height:42px;
border-radius:50%;
background:#c9f7da;
color:#073b29;
display:flex;
align-items:center;
justify-content:center;
font-weight:800;
}

main{
max-width:760px;
margin:auto;
padding:18px 15px 95px;
}

.welcome{
margin-bottom:18px;
}

.welcome small{
color:#6d8177;
}

.welcome h2{
margin:5px 0 0;
font-size:24px;
}

.wallet{
background:#073b29;
color:white;
border-radius:22px;
padding:22px;
box-shadow:0 12px 30px rgba(7,59,41,.15);
}

.wallet-label{
color:#a8cbb9;
font-size:13px;
}

.balance{
font-size:34px;
font-weight:800;
margin:8px 0 18px;
}

.wallet-row{
display:flex;
justify-content:space-between;
gap:10px;
}

.wallet-item{
background:rgba(255,255,255,.09);
border-radius:14px;
padding:11px;
flex:1;
}

.wallet-item small{
display:block;
color:#a8cbb9;
font-size:11px;
}

.wallet-item strong{
display:block;
margin-top:5px;
font-size:15px;
}

.stats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
margin:16px 0;
}

.stat{
background:white;
border:1px solid #dcebe2;
border-radius:17px;
padding:16px;
}

.stat-icon{
width:38px;
height:38px;
border-radius:11px;
background:#dcf8e7;
color:#087044;
display:flex;
align-items:center;
justify-content:center;
margin-bottom:10px;
}

.stat-icon svg{
width:20px;
height:20px;
}

.stat small{
color:#72847b;
}

.stat strong{
display:block;
font-size:20px;
margin-top:5px;
}

.section-head{
display:flex;
align-items:center;
justify-content:space-between;
margin:25px 0 12px;
}

.section-head h3{
margin:0;
font-size:18px;
}

.section-head a{
color:#087044;
font-size:13px;
font-weight:700;
text-decoration:none;
}

.task{
background:white;
border:1px solid #dcebe2;
border-radius:18px;
padding:16px;
margin-bottom:11px;
}

.task-top{
display:flex;
gap:12px;
align-items:center;
}

.task-icon{
width:45px;
height:45px;
border-radius:13px;
background:#e0f8e9;
color:#087044;
display:flex;
align-items:center;
justify-content:center;
flex-shrink:0;
}

.task-icon svg{
width:22px;
height:22px;
}

.task-title{
font-weight:700;
font-size:15px;
}

.task-desc{
font-size:12px;
color:#75867d;
margin-top:4px;
line-height:1.4;
}

.task-bottom{
display:flex;
align-items:center;
justify-content:space-between;
margin-top:15px;
}

.reward{
color:#087044;
font-weight:800;
}

.start{
background:#0a7748;
color:white;
border:0;
padding:10px 17px;
border-radius:11px;
font-weight:700;
text-decoration:none;
font-size:13px;
}

.activity{
background:white;
border:1px solid #dcebe2;
border-radius:18px;
overflow:hidden;
}

.activity-row{
padding:14px 15px;
border-bottom:1px solid #edf3ef;
display:flex;
justify-content:space-between;
gap:12px;
}

.activity-row:last-child{
border-bottom:0;
}

.activity-title{
font-size:13px;
font-weight:700;
}

.activity-date{
font-size:11px;
color:#84958c;
margin-top:4px;
}

.activity-right{
text-align:right;
font-size:13px;
font-weight:800;
}

.approved{color:#087044}
.pending{color:#c18a00}
.denied{color:#c43d3d}

.promo{
margin-top:15px;
background:#dff8e9;
border:1px solid #c5edd4;
border-radius:19px;
padding:18px;
}

.promo h3{
margin:0 0 7px;
font-size:17px;
color:#073b29;
}

.promo p{
margin:0 0 14px;
font-size:13px;
line-height:1.5;
color:#486457;
}

.promo a{
display:inline-block;
background:#073b29;
color:white;
padding:10px 16px;
border-radius:11px;
text-decoration:none;
font-size:13px;
font-weight:700;
}

.empty{
padding:25px;
text-align:center;
color:#7b8d84;
font-size:13px;
}

.loading{
text-align:center;
padding:40px;
color:#72847b;
}

nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
border-top:1px solid #dcebe2;
display:flex;
justify-content:center;
z-index:10;
}

.nav-inner{
width:100%;
max-width:760px;
display:flex;
justify-content:space-around;
padding:10px 5px;
}

nav a{
text-decoration:none;
color:#789087;
font-size:11px;
text-align:center;
}

nav a.active{
color:#087044;
font-weight:800;
}

.nav-icon{
display:block;
margin:auto auto 4px;
}

.nav-icon svg{
width:20px;
height:20px;
}

@media(min-width:600px){
.stats{
grid-template-columns:repeat(4,1fr);
}
}
</style>
</head>

<body>

<header>
<div class="header">

<div class="logo">RexTasks</div>

<div class="profile" id="profileLetter">
R
</div>

</div>
</header>

<main>

<div id="page" class="loading">
Loading dashboard...
</div>

</main>


<nav>
<div class="nav-inner">

<a class="active" href="dashboard.html">
<span class="nav-icon">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<path d="M3 11l9-8 9 8"/>
<path d="M5 10v10h14V10"/>
</svg>
</span>
Home
</a>

<a href="tasks.html">
<span class="nav-icon">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<rect x="4" y="4" width="16" height="16" rx="3"/>
<path d="M8 9h8M8 13h8M8 17h5"/>
</svg>
</span>
Earn
</a>

<a href="referrals.html">
<span class="nav-icon">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<circle cx="9" cy="8" r="3"/>
<circle cx="17" cy="10" r="3"/>
<path d="M3 20c0-3 2-5 6-5s6 2 6 5"/>
<path d="M14 16c4 0 6 1.5 7 4"/>
</svg>
</span>
Refer
</a>

<a href="withdraw.html">
<span class="nav-icon">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<rect x="3" y="5" width="18" height="14" rx="3"/>
<path d="M3 10h18"/>
<path d="M16 15h2"/>
</svg>
</span>
Withdraw
</a>

<a href="profile.html">
<span class="nav-icon">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<circle cx="12" cy="8" r="3"/>
<path d="M5 21c0-4 3-7 7-7s7 3 7 7"/>
</svg>
</span>
Profile
</a>

</div>
</nav>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://cetsxdkoauucxwsbdktl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_crwxMSen3GDl9BQZfy_QLg_o_uicRCD";

const db=supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const page=document.getElementById("page");


async function start(){

const {
data:{session},
error
}=await db.auth.getSession();


if(error || !session){

location.href="login.html";
return;

}


const user=session.user;


/* PROFILE */

const {data:profile}=await db
.from("profiles")
.select("full_name,country")
.eq("id",user.id)
.maybeSingle();


const name=
profile?.full_name ||
user.user_metadata?.full_name ||
user.email?.split("@")[0] ||
"User";


document.getElementById("profileLetter")
.textContent=name.charAt(0).toUpperCase();


/* WALLET */

const {data:wallet,walletError}=await db
.from("wallets")
.select(`
balance,
total_earned,
referral_earnings
`)
.eq("user_id",user.id)
.maybeSingle();


/* APPROVED TASK COUNT */

const {data:approved}=await db
.from("task_submissions")
.select("id")
.eq("user_id",user.id)
.eq("status","approved");


const completed=
approved?.length || 0;


/* TASKS */

const {data:tasks}=await db
.from("tasks")
.select(`
id,
title,
description,
payout,
user_reward_percent,
task_url,
status
`)
.eq("status","active")
.order("created_at",{ascending:false})
.limit(4);


/* RECENT ACTIVITY */

const {data:activity}=await db
.from("task_submissions")
.select(`
id,
status,
user_reward,
created_at,
tasks(title)
`)
.eq("user_id",user.id)
.order("created_at",{ascending:false})
.limit(5);


/* RENDER */

const balance=
Number(wallet?.balance || 0);

const total=
Number(wallet?.total_earned || 0);

const referral=
Number(wallet?.referral_earnings || 0);


let taskHTML="";

if(!tasks || !tasks.length){

taskHTML=
`<div class="empty">No tasks available right now.</div>`;

}else{

tasks.forEach(task=>{

const payout=
Number(task.payout || 0);

const percent=
Number(task.user_reward_percent || 0);

const reward=
payout * percent / 100;


taskHTML+=`

<div class="task">

<div class="task-top">

<div class="task-icon">

<svg viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<path d="M4 5h16v14H4z"/>
<path d="M8 9h8M8 13h5"/>

</svg>

</div>

<div>

<div class="task-title">
${escapeHtml(task.title)}
</div>

<div class="task-desc">
${escapeHtml(
task.description || "Complete this task and submit your proof."
)}
</div>

</div>

</div>

<div class="task-bottom">

<div class="reward">
Earn $${reward.toFixed(2)}
</div>

<a
class="start"
href="${escapeAttribute(
task.task_url || "submit-task.html?task="+task.id
)}"
target="_blank"
rel="noopener">
Start
</a>

</div>

</div>

`;

});

}


/* ACTIVITY */

let activityHTML="";

if(!activity || !activity.length){

activityHTML=
`<div class="empty">No activity yet.</div>`;

}else{

activity.forEach(row=>{

const title=
row.tasks?.title || "Task";

const reward=
Number(row.user_reward || 0);

const status=
String(row.status || "").toLowerCase();

const date=
new Date(row.created_at)
.toLocaleDateString();


activityHTML+=`

<div class="activity-row">

<div>

<div class="activity-title">
${escapeHtml(title)}
</div>

<div class="activity-date">
${escapeHtml(date)}
</div>

</div>

<div class="activity-right ${escapeAttribute(status)}">

${
status==="approved"
? "+$"+reward.toFixed(2)
: status.charAt(0).toUpperCase()+status.slice(1)
}

</div>

</div>

`;

});

}


/* FINAL PAGE */

page.className="";

page.innerHTML=`

<div class="welcome">

<small>Welcome back</small>

<h2>
${escapeHtml(name)}
</h2>

</div>


<div class="wallet">

<div class="wallet-label">
Wallet Balance
</div>

<div class="balance">
$${balance.toFixed(2)}
</div>

<div class="wallet-row">

<div class="wallet-item">

<small>Total Earned</small>

<strong>
$${total.toFixed(2)}
</strong>

</div>

<div class="wallet-item">

<small>Referral Earnings</small>

<strong>
$${referral.toFixed(2)}
</strong>

</div>

</div>

</div>


<div class="stats">

<div class="stat">

<div class="stat-icon">

<svg viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<path d="M12 3v18"/>
<path d="M17 7h-7a3 3 0 000 6h4a3 3 0 010 6H7"/>

</svg>

</div>

<small>Balance</small>

<strong>
$${balance.toFixed(2)}
</strong>

</div>


<div class="stat">

<div class="stat-icon">

<svg viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<path d="M5 12l4 4L19 6"/>

</svg>

</div>

<small>Tasks Completed</small>

<strong>
${completed}
</strong>

</div>


<div class="stat">

<div class="stat-icon">

<svg viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<circle cx="12" cy="8" r="3"/>
<path d="M5 21c0-4 3-7 7-7s7 3 7 7"/>

</svg>

</div>

<small>Referrals</small>

<strong>
${referral > 0 ? "Active" : "0"}
</strong>

</div>


<div class="stat">

<div class="stat-icon">

<svg viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<path d="M12 3v18"/>
<path d="M6 8h8a3 3 0 010 6H9a3 3 0 000 6h9"/>

</svg>

</div>

<small>Total Earned</small>

<strong>
$${total.toFixed(2)}
</strong>

</div>

</div>


<div class="section-head">

<h3>Available Tasks</h3>

<a href="tasks.html">
View All
</a>

</div>

${taskHTML}


<div class="section-head">

<h3>Recent Activity</h3>

<a href="history.html">
View All
</a>

</div>

<div class="activity">

${activityHTML}

</div>


<div class="promo">

<h3>Daily Check-in</h3>

<p>
Come back every day to check for new earning opportunities and available tasks.
</p>

<a href="tasks.html">
View Tasks
</a>

</div>


<div class="promo">

<h3>Invite & Earn</h3>

<p>
Invite friends to RexTasks and earn $0.10 when your referred user completes an eligible verified task.
</p>

<a href="referrals.html">
Invite Friends
</a>

</div>

`;

}


function escapeHtml(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeAttribute(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/"/g,"&quot;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");

}


start();

</script>

</body>
</html>
