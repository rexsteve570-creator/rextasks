<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RexTasks — Dashboard</title>

<style>
*{box-sizing:border-box}

:root{
--bg:#f5faf7;
--card:#ffffff;
--text:#10251b;
--muted:#718279;
--border:#dcebe2;
--green:#087044;
--dark:#073b29;
--light:#ddf7e7;
--soft:#eef9f2;
--shadow:0 10px 30px rgba(7,59,41,.08);
}

body.dark{
--bg:#07140f;
--card:#0c2118;
--text:#edf8f1;
--muted:#8da99b;
--border:#183c2c;
--green:#69d59a;
--dark:#062d20;
--light:#123d2b;
--soft:#0e2b1f;
--shadow:0 10px 30px rgba(0,0,0,.25);
}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:Arial,sans-serif;
transition:.25s;
}

button,a{font-family:inherit}

header{
background:var(--dark);
color:white;
padding:16px;
}

.header{
max-width:760px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:22px;
font-weight:800;
color:#8ff0b8;
}

.header-actions{
display:flex;
align-items:center;
gap:9px;
}

.theme-btn{
width:42px;
height:42px;
border:1px solid rgba(255,255,255,.15);
background:rgba(255,255,255,.08);
color:white;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

.theme-btn svg{
width:20px;
height:20px;
}

.profile{
width:42px;
height:42px;
border-radius:50%;
background:#c9f7da;
color:#073b29;
display:flex;
align-items:center;
justify-content:center;
font-weight:800;
}

.theme-menu{
position:absolute;
right:15px;
top:70px;
background:var(--card);
border:1px solid var(--border);
border-radius:15px;
padding:7px;
box-shadow:var(--shadow);
display:none;
z-index:20;
min-width:140px;
}

.theme-menu.show{
display:block;
}

.theme-option{
width:100%;
border:0;
background:transparent;
color:var(--text);
padding:11px;
text-align:left;
border-radius:9px;
cursor:pointer;
font-size:13px;
}

.theme-option:hover{
background:var(--soft);
}

main{
max-width:760px;
margin:auto;
padding:18px 15px 100px;
}

.welcome{
margin-bottom:18px;
}

.welcome small{
color:var(--muted);
}

.welcome h2{
margin:5px 0 0;
font-size:24px;
}

.wallet{
background:var(--dark);
color:white;
border-radius:22px;
padding:22px;
box-shadow:var(--shadow);
}

.wallet-label{
color:#a8cbb9;
font-size:13px;
}

.balance{
font-size:34px;
font-weight:800;
margin:8px 0 18px;
}

.wallet-row{
display:flex;
gap:10px;
}

.wallet-item{
background:rgba(255,255,255,.09);
border-radius:14px;
padding:11px;
flex:1;
}

.wallet-item small{
display:block;
color:#a8cbb9;
font-size:11px;
}

.wallet-item strong{
display:block;
margin-top:5px;
font-size:15px;
}

.stats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
margin:16px 0;
}

.stat{
background:var(--card);
border:1px solid var(--border);
border-radius:17px;
padding:16px;
box-shadow:var(--shadow);
}

.stat-icon,
.task-icon{
display:flex;
align-items:center;
justify-content:center;
background:var(--light);
color:var(--green);
}

.stat-icon{
width:40px;
height:40px;
border-radius:12px;
margin-bottom:10px;
}

.stat-icon svg{
width:21px;
height:21px;
}

.stat small{
color:var(--muted);
}

.stat strong{
display:block;
font-size:20px;
margin-top:5px;
}

.section-head{
display:flex;
align-items:center;
justify-content:space-between;
margin:25px 0 12px;
}

.section-head h3{
margin:0;
font-size:18px;
}

.section-head a{
color:var(--green);
font-size:13px;
font-weight:700;
text-decoration:none;
}

.task{
background:var(--card);
border:1px solid var(--border);
border-radius:18px;
padding:16px;
margin-bottom:11px;
box-shadow:var(--shadow);
}

.task-top{
display:flex;
gap:12px;
align-items:center;
}

.task-icon{
width:46px;
height:46px;
border-radius:13px;
flex-shrink:0;
}

.task-icon svg{
width:23px;
height:23px;
}

.task-title{
font-weight:700;
font-size:15px;
}

.task-desc{
font-size:12px;
color:var(--muted);
margin-top:4px;
line-height:1.4;
}

.task-bottom{
display:flex;
align-items:center;
justify-content:space-between;
margin-top:15px;
}

.reward{
color:var(--green);
font-weight:800;
}

.start{
background:#0a7748;
color:white;
border:0;
padding:10px 17px;
border-radius:11px;
font-weight:700;
text-decoration:none;
font-size:13px;
}

.activity{
background:var(--card);
border:1px solid var(--border);
border-radius:18px;
overflow:hidden;
box-shadow:var(--shadow);
}

.activity-row{
padding:14px 15px;
border-bottom:1px solid var(--border);
display:flex;
justify-content:space-between;
gap:12px;
}

.activity-row:last-child{
border-bottom:0;
}

.activity-title{
font-size:13px;
font-weight:700;
}

.activity-date{
font-size:11px;
color:var(--muted);
margin-top:4px;
}

.activity-right{
text-align:right;
font-size:13px;
font-weight:800;
}

.approved{color:#087044}
.pending{color:#b27b00}
.denied{color:#c43d3d}

.promo{
margin-top:15px;
background:var(--light);
border:1px solid var(--border);
border-radius:19px;
padding:18px;
}

.promo-head{
display:flex;
align-items:center;
gap:12px;
}

.promo-icon{
width:43px;
height:43px;
border-radius:12px;
background:var(--card);
color:var(--green);
display:flex;
align-items:center;
justify-content:center;
}

.promo-icon svg{
width:21px;
height:21px;
}

.promo h3{
margin:0;
font-size:17px;
color:var(--text);
}

.promo p{
margin:9px 0 14px;
font-size:13px;
line-height:1.5;
color:var(--muted);
}

.promo a{
display:inline-block;
background:var(--dark);
color:white;
padding:10px 16px;
border-radius:11px;
text-decoration:none;
font-size:13px;
font-weight:700;
}

.empty{
padding:25px;
text-align:center;
color:var(--muted);
font-size:13px;
}

.loading{
text-align:center;
padding:40px;
color:var(--muted);
}

nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:var(--card);
border-top:1px solid var(--border);
display:flex;
justify-content:center;
z-index:10;
}

.nav-inner{
width:100%;
max-width:760px;
display:flex;
justify-content:space-around;
padding:9px 5px;
}

nav a{
text-decoration:none;
color:var(--muted);
font-size:11px;
text-align:center;
}

nav a.active{
color:var(--green);
font-weight:800;
}

.nav-icon{
display:block;
margin:auto auto 4px;
}

.nav-icon svg{
width:20px;
height:20px;
}

@media(min-width:600px){
.stats{
grid-template-columns:repeat(4,1fr);
}
}
</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">RexTasks</div>

<div class="header-actions">

<button class="theme-btn" id="themeBtn" aria-label="Theme">

<svg viewBox="0 0 24 24" fill="none"
stroke="currentColor" stroke-width="2">
<circle cx="12" cy="12" r="4"/>
<path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
</svg>

</button>

<div class="profile" id="profileLetter">R</div>

</div>

</div>

<div class="theme-menu" id="themeMenu">

<button class="theme-option" onclick="setTheme('light')">
Light
</button>

<button class="theme-option" onclick="setTheme('dark')">
Dark
</button>

<button class="theme-option" onclick="setTheme('system')">
System
</button>

</div>

</header>


<main>

<div id="page" class="loading">
Loading dashboard...
</div>

</main>


<nav>

<div class="nav-inner">

<a class="active" href="dashboard.html">
<span class="nav-icon">
<svg viewBox="0 0 24 24" fill="none"
stroke="currentColor" stroke-width="2">
<path d="M3 11l9-8 9 8"/>
<path d="M5 10v10h14V10"/>
</svg>
</span>
Home
</a>

<a href="tasks.html">
<span class="nav-icon">
<svg viewBox="0 0 24 24" fill="none"
stroke="currentColor" stroke-width="2">
<rect x="4" y="4" width="16" height="16" rx="3"/>
<path d="M8 9h8M8 13h6M8 17h4"/>
</svg>
</span>
Earn
</a>

<a href="referrals.html">
<span class="nav-icon">
<svg viewBox="0 0 24 24" fill="none"
stroke="currentColor" stroke-width="2">
<circle cx="9" cy="8" r="3"/>
<circle cx="17" cy="10" r="3"/>
<path d="M3 20c0-3 2-5 6-5s6 2 6 5"/>

</svg>
</span>
Refer

<a href="withdraw.html">
<span class="nav-icon">
<svg viewBox="0 0 24 24" fill="none"
stroke="currentColor" stroke-width="2">
<rect x="3" y="5" width="18" height="14" rx="3"/>
<path d="M3 10h18"/>
<path d="M16 15h2"/>
</svg>
</span>
Withdraw
</a>

<a href="profile.html">
<span class="nav-icon">
<svg viewBox="0 0 24 24" fill="none"
stroke="currentColor" stroke-width="2">
<circle cx="12" cy="8" r="3"/>
<path d="M5 21c0-4 3-7 7-7s7 3 7 7"/>
</svg>
</span>
Profile
</a>

</div>
</nav>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL=
"https://cetsxdkoauucxwsbdktl.supabase.co";

const SUPABASE_KEY=
"sb_publishable_crwxMSen3GDl9BQZfy_QLg_o_uicRCD";

const db=supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
   THEME
===================================================== */

const themeBtn=
document.getElementById("themeBtn");

const themeMenu=
document.getElementById("themeMenu");


themeBtn.onclick=()=>{
themeMenu.classList.toggle("show");
};


function setTheme(theme){

localStorage.setItem(
"rextasks-theme",
theme
);

applyTheme(theme);

themeMenu.classList.remove("show");

}


function applyTheme(theme){

let dark=false;

if(theme==="dark"){
dark=true;
}

if(theme==="system"){
dark=window.matchMedia(
"(prefers-color-scheme: dark)"
).matches;
}

document.body.classList.toggle(
"dark",
dark
);

}


const savedTheme=
localStorage.getItem("rextasks-theme")
||"system";

applyTheme(savedTheme);


window.matchMedia(
"(prefers-color-scheme: dark)"
).addEventListener(
"change",
()=>{
if(
(localStorage.getItem("rextasks-theme")||"system")
==="system"
){
applyTheme("system");
}
}
);


/* =====================================================
   LOAD DASHBOARD
===================================================== */

const page=
document.getElementById("page");


async function start(){

const {
data:{session},
error
}=await db.auth.getSession();


if(error || !session){

location.href="login.html";
return;

}


const user=session.user;


/* PROFILE */

const {data:profile}=await db
.from("profiles")
.select("full_name,country")
.eq("id",user.id)
.maybeSingle();


const name=
profile?.full_name ||
user.user_metadata?.full_name ||
user.email?.split("@")[0] ||
"User";


document.getElementById(
"profileLetter"
).textContent=
name.charAt(0).toUpperCase();


/* WALLET */

const {data:wallet}=await db
.from("wallets")
.select(
"balance,total_earned,referral_earnings"
)
.eq("user_id",user.id)
.maybeSingle();


/* COMPLETED TASKS */

const {data:approved}=await db
.from("task_submissions")
.select("id")
.eq("user_id",user.id)
.eq("status","approved");


const completed=
approved?.length || 0;


/* REFERRALS */

const {data:referrals}=await db
.from("referrals")
.select("id")
.eq("referrer_id",user.id);


const referralCount=
referrals?.length || 0;


/* TASKS */

const {data:tasks}=await db
.from("tasks")
.select(`
id,
title,
description,
payout,
user_reward_percent,
task_url,
status
`)
.eq("status","active")
.order("created_at",{ascending:false})
.limit(4);


/* ACTIVITY */

const {data:activity}=await db
.from("task_submissions")
.select(`
id,
status,
user_reward,
created_at,
tasks(title)
`)
.eq("user_id",user.id)
.order("created_at",{ascending:false})
.limit(5);


/* VALUES */

const balance=
Number(wallet?.balance||0);

const total=
Number(wallet?.total_earned||0);

const referral=
Number(wallet?.referral_earnings||0);


/* TASK HTML */

let taskHTML="";


if(!tasks||!tasks.length){

taskHTML=
`<div class="empty">
No tasks available right now.
</div>`;

}else{

tasks.forEach(task=>{

const payout=
Number(task.payout||0);

const percent=
Number(task.user_reward_percent||0);

const reward=
payout*percent/100;


taskHTML+=`

<div class="task">

<div class="task-top">

<div class="task-icon">

<svg viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<rect x="4" y="4"
width="16" height="16"
rx="3"/>

<path d="M8 9h8"/>
<path d="M8 13h6"/>
<path d="M8 17h4"/>

</svg>

</div>

<div>

<div class="task-title">
${escapeHtml(task.title)}
</div>

<div class="task-desc">
${escapeHtml(
task.description||
"Complete this task and submit your proof."
)}
</div>

</div>

</div>

<div class="task-bottom">

<div class="reward">
Earn $${reward.toFixed(2)}
</div>

<a
class="start"
href="${escapeAttribute(
task.task_url||
"submit-task.html?task="+task.id
)}"
target="_blank"
rel="noopener">
Start
</a>

</div>

</div>

`;

});

}


/* ACTIVITY HTML */

let activityHTML="";


if(!activity||!activity.length){

activityHTML=
`<div class="empty">
No activity yet.
</div>`;

}else{

activity.forEach(row=>{

const title=
row.tasks?.title||
"Task";

const reward=
Number(row.user_reward||0);

const status=
String(row.status||"")
.toLowerCase();

const date=
new Date(row.created_at)
.toLocaleDateString();


activityHTML+=`

<div class="activity-row">

<div>

<div class="activity-title">
${escapeHtml(title)}
</div>

<div class="activity-date">
${escapeHtml(date)}
</div>

</div>

<div class="activity-right ${escapeAttribute(status)}">

${
status==="approved"
?"+$"+reward.toFixed(2)
:status.charAt(0).toUpperCase()
+status.slice(1)
}

</div>

</div>

`;

});

}


/* RENDER */

page.className="";

page.innerHTML=`

<div class="welcome">

<small>Welcome back</small>

<h2>
${escapeHtml(name)}
</h2>

</div>


<div class="wallet">

<div class="wallet-label">
Wallet Balance
</div>

<div class="balance">
$${balance.toFixed(2)}
</div>

<div class="wallet-row">

<div class="wallet-item">
<small>Total Earned</small>
<strong>
$${total.toFixed(2)}
</strong>
</div>

<div class="wallet-item">
<small>Referral Earnings</small>
<strong>
$${referral.toFixed(2)}
</strong>
</div>

</div>

</div>


<div class="stats">

<div class="stat">

<div class="stat-icon">

<svg viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<path d="M12 3v18"/>
<path d="M17 7h-7a3 3 0 000 6h4a3 3 0 010 6H7"/>

</svg>

</div>

<small>Balance</small>

<strong>
$${balance.toFixed(2)}
</strong>

</div>


<div class="stat">

<div class="stat-icon">

<svg viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<circle cx="12" cy="12" r="8"/>
<path d="M8 12l3 3 5-6"/>

</svg>

</div>

<small>Tasks Completed</small>

<strong>
${completed}
</strong>

</div>


<div class="stat">

<div class="stat-icon">

<svg viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<circle cx="9" cy="8" r="3"/>
<circle cx="17" cy="10" r="3"/>
<path d="M3 20c0-3 2-5 6-5s6 2 6 5"/>
<path d="M14 16c4 0 6 1.5 7 4"/>

</svg>

</div>

<small>Referrals</small>

<strong>
${referralCount}
</strong>

</div>


<div class="stat">

<div class="stat-icon">

<svg viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<path d="M12 3v18"/>
<path d="M17 7h-7a3 3 0 000 6h4a3 3 0 010 6H7"/>

</svg>

</div>

<small>Total Earned</small>

<strong>
$${total.toFixed(2)}
</strong>

</div>

</div>


<div class="section-head">

<h3>Available Tasks</h3>

<a href="tasks.html">
View All
</a>

</div>

${taskHTML}


<div class="section-head">

<h3>Recent Activity</h3>

<a href="history.html">
View All
</a>

</div>

<div class="activity">
${activityHTML}
</div>


<div class="promo">

<div class="promo-head">

<div class="promo-icon">

<svg viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<rect x="4" y="5"
width="16" height="15"
rx="3"/>

<path d="M8 3v4M16 3v4"/>
<path d="M8 12h3M8 16h5"/>

</svg>

</div>

<h3>Daily Check-in</h3>

</div>

<p>
Check back every day for new earning opportunities and available tasks.
</p>

<a href="tasks.html">
View Tasks
</a>

</div>


<div class="promo">

<div class="promo-head">

<div class="promo-icon">

<svg viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<circle cx="9" cy="8" r="3"/>
<circle cx="17" cy="10" r="3"/>
<path d="M3 20c0-3 2-5 6-5s6 2 6 5"/>
<path d="M14 16c4 0 6 1.5 7 4"/>

</svg>

</div>

<h3>Invite & Earn</h3>

</div>

<p>
Invite friends to RexTasks and earn $0.10 when your referred user completes an eligible verified task.
</p>

<a href="referrals.html">
Invite Friends
</a>

</div>

`;

}


function escapeHtml(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeAttribute(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/"/g,"&quot;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");

}


start();

</script>

</body>
</html>
