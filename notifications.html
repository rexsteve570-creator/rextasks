<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>TallyBuck — Notifications</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#f5faf7;
  --card:#ffffff;
  --text:#15231d;
  --muted:#718078;
  --border:#e3ebe7;
  --green:#079447;
  --darkgreen:#063f2d;
  --lightgreen:#e9f8ef;
  --danger:#d64545;
  --shadow:0 4px 18px rgba(6,63,45,.07);
}

html.dark{
  --bg:#06130d;
  --card:#0b2117;
  --text:#effaf4;
  --muted:#91aa9e;
  --border:#1b3a2c;
  --green:#59e696;
  --darkgreen:#052d20;
  --lightgreen:#123a29;
  --danger:#ff7272;
  --shadow:0 5px 20px rgba(0,0,0,.28);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:20px;
}

body.menu-open{
  overflow:hidden;
}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

a{
  text-decoration:none;
  color:inherit;
}

/* =========================
   APP
========================= */

.app{
  width:100%;
  max-width:760px;
  min-height:100vh;
  margin:0 auto;
  background:var(--bg);
  position:relative;
}

/* =========================
   HEADER
========================= */

.header{
  height:68px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:sticky;
  top:0;
  z-index:100;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  font-size:19px;
}

.logo{
  width:38px;
  height:38px;
  border-radius:11px;
  background:var(--green);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  font-weight:900;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.icon-btn{
  width:42px;
  height:42px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  position:relative;
}

.icon{
  width:20px;
  height:20px;
  display:block;
  fill:none;
  stroke:currentColor;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.notification-count{
  position:absolute;
  top:-4px;
  right:-4px;
  min-width:18px;
  height:18px;
  padding:0 5px;
  border-radius:20px;
  background:var(--danger);
  color:#fff;
  font-size:10px;
  font-weight:800;
  display:none;
  align-items:center;
  justify-content:center;
  border:2px solid var(--card);
}

/* =========================
   SIDE MENU OVERLAY
========================= */

.menu-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.38);
  opacity:0;
  visibility:hidden;
  transition:.22s ease;
  z-index:190;
}

.menu-overlay.show{
  opacity:1;
  visibility:visible;
}

/* =========================
   RIGHT SIDE MENU
========================= */

.side-menu{
  position:fixed;
  top:0;
  right:0;
  width:min(310px,86vw);
  height:100vh;
  background:var(--card);
  border-left:1px solid var(--border);
  padding:20px 14px;
  z-index:200;
  overflow-y:auto;
  transform:translateX(105%);
  transition:transform .24s ease;
  box-shadow:-10px 0 30px rgba(0,0,0,.12);
}

.side-menu.open{
  transform:translateX(0);
}

.menu-head{
  height:48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 4px 0 10px;
  margin-bottom:8px;
}

.menu-title{
  font-size:11px;
  font-weight:800;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.08em;
}

.close-menu{
  width:38px;
  height:38px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.close-menu svg{
  width:18px;
  height:18px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.menu-link{
  display:flex;
  align-items:center;
  gap:13px;
  padding:13px 14px;
  border-radius:12px;
  margin-bottom:4px;
  color:var(--muted);
  font-size:14px;
  font-weight:700;
}

.menu-link:hover,
.menu-link.active{
  background:var(--lightgreen);
  color:var(--green);
}

.menu-icon{
  width:21px;
  height:21px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 21px;
}

.menu-icon svg{
  width:18px;
  height:18px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.menu-divider{
  height:1px;
  background:var(--border);
  margin:12px 10px;
}

.theme-row{
  width:100%;
  border:0;
  background:transparent;
  color:var(--muted);
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}

/* =========================
   MAIN
========================= */

.main{
  padding:24px 18px 30px;
}

.page-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px;
}

.page-title{
  font-size:25px;
  font-weight:850;
  margin-bottom:6px;
}

.page-subtitle{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.mark-all{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--green);
  padding:10px 13px;
  border-radius:11px;
  font-weight:800;
  font-size:12px;
  cursor:pointer;
  white-space:nowrap;
}

.mark-all:hover{
  background:var(--lightgreen);
}

/* =========================
   NOTIFICATIONS CARD
========================= */

.notifications-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.notification{
  display:flex;
  gap:13px;
  padding:17px 16px;
  border-bottom:1px solid var(--border);
  position:relative;
}

.notification:last-child{
  border-bottom:0;
}

.notification.unread{
  background:var(--lightgreen);
}

.notification.unread::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:3px;
  background:var(--green);
}

.notification-icon{
  width:42px;
  height:42px;
  flex:0 0 42px;
  border-radius:12px;
  background:var(--lightgreen);
  color:var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
}

.notification-icon svg{
  width:20px;
  height:20px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.notification-content{
  flex:1;
  min-width:0;
}

.notification-title{
  font-size:14px;
  font-weight:800;
  margin-bottom:5px;
}

.notification-message{
  font-size:12.5px;
  color:var(--muted);
  line-height:1.55;
  margin-bottom:8px;
}

.notification-time{
  font-size:11px;
  color:var(--muted);
}

.read-btn{
  border:0;
  background:transparent;
  color:var(--green);
  font-size:11px;
  font-weight:800;
  cursor:pointer;
  padding:0;
  margin-top:8px;
}

.empty{
  padding:55px 20px;
  text-align:center;
}

.empty-icon{
  width:60px;
  height:60px;
  border-radius:18px;
  background:var(--lightgreen);
  color:var(--green);
  margin:0 auto 15px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.empty-icon svg{
  width:27px;
  height:27px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.empty h3{
  font-size:17px;
  margin-bottom:7px;
}

.empty p{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.loading{
  padding:50px 20px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:88px;
  transform:translateX(-50%) translateY(20px);
  background:var(--darkgreen);
  color:#fff;
  padding:12px 17px;
  border-radius:12px;
  font-size:13px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:300;
  max-width:calc(100vw - 30px);
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  display:flex;
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(760px,100%);
  height:73px;
  background:var(--card);
  border-top:1px solid var(--border);
  z-index:100;
  padding:6px 5px;
}

.bottom-link{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  color:var(--muted);
  font-size:10px;
  font-weight:700;
  border-radius:10px;
}

.bottom-link.active{
  color:var(--green);
  background:var(--lightgreen);
}

.bottom-icon{
  width:20px;
  height:20px;
}

.bottom-icon svg{
  width:19px;
  height:19px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* =========================
   DESKTOP
========================= */

@media(min-width:761px){

  body{
    padding-bottom:0;
  }

  .app{
    max-width:760px;
  }

  .bottom-nav{
    display:none;
  }

  .main{
    padding-bottom:40px;
  }
}

/* =========================
   MOBILE
========================= */

@media(max-width:760px){

  body{
    padding-bottom:86px;
  }

  .header{
    padding:0 14px;
  }

  .main{
    padding:20px 15px 20px;
  }

  .page-head{
    margin-bottom:17px;
  }

  .page-title{
    font-size:22px;
  }

  .page-subtitle{
    font-size:12.5px;
  }

  .mark-all{
    padding:9px 10px;
    font-size:10.5px;
  }

  .notification{
    padding:15px 13px;
  }

  .notification-icon{
    width:40px;
    height:40px;
    flex-basis:40px;
  }

  .notification-title{
    font-size:13.5px;
  }

  .notification-message{
    font-size:12px;
  }
}
</style>
</head>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://cetsxdkoauucxwsbdktl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_crwxMSen3GDl9BQZfy_QLg_o_uicRCD";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const $ =
  id => document.getElementById(id);


let currentUser = null;


/* =========================
   TOAST
========================= */

function showToast(message){

  const toast =
    $("toast");

  toast.textContent =
    message;

  toast.classList.add("show");

  setTimeout(
    ()=>{
      toast.classList.remove("show");
    },
    2500
  );
}


/* =========================
   THEME
========================= */

function applyTheme(){

  const saved =
    localStorage.getItem(
      "tallybuck-theme"
    ) || "system";


  if(saved === "dark"){

    document.documentElement
      .classList.add("dark");

  }else if(saved === "light"){

    document.documentElement
      .classList.remove("dark");

  }else{

    const dark =
      window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches;

    document.documentElement
      .classList.toggle(
        "dark",
        dark
      );
  }


  updateThemeLabel();
}


function updateThemeLabel(){

  const saved =
    localStorage.getItem(
      "tallybuck-theme"
    ) || "system";

  const label =
    $("themeLabel");

  if(!label){
    return;
  }

  label.textContent =
    saved === "dark"
      ? "Theme: Dark"
      : saved === "light"
      ? "Theme: Light"
      : "Theme: System";
}


applyTheme();


$("themeMenuBtn").addEventListener(
  "click",
  ()=>{

    const current =
      localStorage.getItem(
        "tallybuck-theme"
      ) || "system";


    const next =
      current === "system"
        ? "light"
        : current === "light"
        ? "dark"
        : "system";


    localStorage.setItem(
      "tallybuck-theme",
      next
    );


    applyTheme();


    showToast(
      next === "system"
        ? "Theme: System"
        : next === "light"
        ? "Theme: Light"
        : "Theme: Dark"
    );
  }
);


/* =========================
   SYSTEM THEME CHANGE
========================= */

const mediaQuery =
  window.matchMedia(
    "(prefers-color-scheme: dark)"
  );


if(mediaQuery.addEventListener){

  mediaQuery.addEventListener(
    "change",
    ()=>{
      const saved =
        localStorage.getItem(
          "tallybuck-theme"
        ) || "system";

      if(saved === "system"){
        applyTheme();
      }
    }
  );

}


/* =========================

/* =========================

========================= */

async function checkAuth(){

  const {
    data:{
      session
    },
    error
  } =
    await db.auth.getSession();


  if(error || !session){

    window.location.href =
      "login.html";

/* =========================
   TIME
========================= */

function formatTime(value){

  const date =
    new Date(value);


  const seconds =
    Math.floor(
      (
        Date.now() -
        date.getTime()
      ) / 1000
    );


  if(seconds < 60){
    return "Just now";
  }


  const minutes =
    Math.floor(
      seconds / 60
    );


  if(minutes < 60){

    return minutes === 1
      ? "1 minute ago"
      : `${minutes} minutes ago`;
  }


  const hours =
    Math.floor(
      minutes / 60
    );


  if(hours < 24){

    return hours === 1
      ? "1 hour ago"
      : `${hours} hours ago`;
  }


  const days =
    Math.floor(
      hours / 24
    );


  if(days < 7){

    return days === 1
      ? "Yesterday"
      : `${days} days ago`;
  }


  return date.toLocaleDateString(
    undefined,
    {
      day:"numeric",
      month:"short",
      year:"numeric"
    }
  );
}


/* =========================
   ESCAPE
========================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );
}


/* =========================
   UNREAD COUNT
========================= */

function updateUnreadCount(items){

  const count =
    items.filter(
      item => !item.is_read
    ).length;


  const badge =
    $("headerNotificationCount");


  if(count > 0){

    badge.textContent =
      count > 99
        ? "99+"
        : count;


    badge.style.display =
      "flex";

  }else{

    badge.style.display =
      "none";
  }
}


/* =========================
   LOAD NOTIFICATIONS
========================= */

async function loadNotifications(){

  const loading =
    $("loading");

  const list =
    $("notificationList");


  loading.style.display =
    "block";


  list.innerHTML =
    "";


  const {
    data,
    error
  } =
    await db
      .from("notifications")
      .select("*")
      .eq(
        "user_id",
        currentUser.id
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  loading.style.display =
    "none";


  if(error){

    console.error(error);


    list.innerHTML = `

      <div class="empty">

        <div class="empty-icon">

          <svg viewBox="0 0 24 24">

            <circle
              cx="12"
              cy="12"
              r="9"
            ></circle>

            <path
              d="M12 8v5"
            ></path>

            <path
              d="M12 16h.01"
            ></path>

          </svg>

        </div>


        <h3>
          Unable to load notifications
        </h3>


        <p>
          Please refresh the page and try again.
        </p>

      </div>

    `;


    updateUnreadCount([]);

    return;
  }


  updateUnreadCount(
    data || []
  );


  if(
    !data ||
    data.length === 0
  ){

    list.innerHTML = `

      <div class="empty">

        <div class="empty-icon">

          <svg viewBox="0 0 24 24">

            <path
              d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
            ></path>

            <path
              d="M10 21h4"
            ></path>

          </svg>

        </div>


        <h3>
          No notifications yet
        </h3>


        <p>
          Your important TallyBuck updates will appear here.
        </p>

      </div>

    `;


    return;
  }


  list.innerHTML =
    data.map(
      item => `

        <div
          class="notification ${
            !item.is_read
              ? "unread"
              : ""
          }"
          data-id="${escapeHtml(item.id)}"
        >

          <div class="notification-icon">
            ${
              notificationIcon(
                item.type
              )
            }
          </div>


          <div class="notification-content">

            <div class="notification-title">
              ${
                escapeHtml(
                  item.title
                )
              }
            </div>


            <div class="notification-message">
              ${
                escapeHtml(
                  item.message
                )
              }
            </div>


            <div class="notification-time">
              ${
                formatTime(
                  item.created_at
                )
              }
            </div>


            ${
              !item.is_read
                ? `
                  <button
                    class="read-btn"
                    onclick="markAsRead('${escapeHtml(item.id)}')"
                  >
                    Mark as read
                  </button>
                `
                : ""
            }

          </div>

        </div>

      `
    ).join("");
}


/* =========================
   MARK ONE AS READ
========================= */

async function markAsRead(id){

  const {
    error
  } =
    await db
      .from("notifications")
      .update({
        is_read:true
      })
      .eq(
        "id",
        id
      )
      .eq(
        "user_id",
        currentUser.id
      );


  if(error){

    console.error(error);

    showToast(
      "Unable to update notification"
    );

    return;
  }


  showToast(
    "Notification marked as read"
  );


  await loadNotifications();
}

========================= */

(async()=>{
