<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>TallyBuck — Referrals</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#f5faf7;
  --card:#fff;
  --text:#15231d;
  --muted:#718078;
  --border:#e3ebe7;
  --green:#079447;
  --darkgreen:#063f2d;
  --lightgreen:#e9f8ef;
  --danger:#d64545;
  --warning:#c58b00;
  --shadow:0 4px 18px rgba(6,63,45,.07);
}

body.dark{
  --bg:#06130d;
  --card:#0b2117;
  --text:#effaf4;
  --muted:#91aa9e;
  --border:#1b3a2c;
  --green:#59e696;
  --darkgreen:#052d20;
  --lightgreen:#123a29;
  --danger:#ff7272;
  --warning:#e7b34b;
  --shadow:0 5px 20px rgba(0,0,0,.28);
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  transition:.25s;
}

button,a{
  font-family:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.app{
  max-width:760px;
  margin:auto;
  min-height:100vh;
  padding-bottom:90px;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{
  height:68px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:sticky;
  top:0;
  z-index:50;
}

.logo{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:21px;
  font-weight:800;
}

.logo-mark{
  width:30px;
  height:30px;
  border-radius:9px;
  background:var(--green);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:900;
}

.header-right{
  display:flex;
  align-items:center;
  gap:4px;
}

.icon-btn{
  width:42px;
  height:42px;
  border:0;
  background:transparent;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  cursor:pointer;
  position:relative;
}

.icon-btn:active,
.menu-btn:active{
  transform:scale(.94);
}

.icon-btn svg,
.menu-btn svg{
  width:22px;
  height:22px;
}

.notification-dot{
  position:absolute;
  right:6px;
  top:6px;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#09a84f;
  border:2px solid var(--card);
  display:none;
}

.menu-btn{
  width:42px;
  height:42px;
  border:0;
  background:transparent;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  cursor:pointer;
}


/* =========================================================
   SIDE MENU
========================================================= */

.menu-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.42);
  z-index:90;
  display:none;
}

.menu-overlay.show{
  display:block;
}

.side-menu{
  position:fixed;
  right:-310px;
  top:0;
  bottom:0;
  width:290px;
  max-width:88%;
  background:var(--card);
  z-index:100;
  box-shadow:-5px 0 25px rgba(0,0,0,.15);
  transition:right .25s ease;
  overflow-y:auto;
}

.side-menu.show{
  right:0;
}

.side-head{
  height:75px;
  background:var(--darkgreen);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
}

.side-logo{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:20px;
  font-weight:800;
}

.side-logo-mark{
  width:30px;
  height:30px;
  border-radius:9px;
  background:#5ee696;
  color:#052d20;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:900;
}

.side-close{
  width:38px;
  height:38px;
  border:0;
  background:rgba(255,255,255,.1);
  color:#fff;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.side-close svg{
  width:20px;
  height:20px;
}

.side-user{
  padding:17px 18px;
  border-bottom:1px solid var(--border);
}

.side-user strong{
  display:block;
  font-size:14px;
}

.side-user span{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
  word-break:break-all;
}

.side-links{
  padding:10px;
}

.side-link{
  width:100%;
  display:flex;
  align-items:center;
  gap:13px;
  padding:13px 12px;
  border:0;
  background:transparent;
  color:var(--text);
  text-decoration:none;
  border-radius:11px;
  font-size:13px;
  cursor:pointer;
  text-align:left;
}

.side-link:hover,
.side-link.active{
  background:var(--lightgreen);
  color:var(--green);
}

.side-link svg{
  width:20px;
  height:20px;
  flex-shrink:0;
}

.side-link.active{
  font-weight:700;
}

.logout{
  color:var(--danger);
}


/* =========================================================
   NOTIFICATION PANEL
========================================================= */

.notification-panel{
  display:none;
  position:fixed;
  top:73px;
  right:18px;
  width:min(330px,calc(100% - 36px));
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow);
  z-index:80;
  overflow:hidden;
}

.notification-panel.show{
  display:block;
}

.notification-head{
  padding:14px 15px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.notification-head strong{
  font-size:14px;
}

.notification-head a{
  color:var(--green);
  font-size:11px;
  font-weight:700;
  text-decoration:none;
}

.notification-item{
  display:flex;
  gap:10px;
  padding:13px 15px;
  border-bottom:1px solid var(--border);
}

.notification-item:last-child{
  border-bottom:0;
}

.notification-icon{
  width:35px;
  height:35px;
  border-radius:10px;
  background:var(--lightgreen);
  color:var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.notification-icon svg{
  width:18px;
  height:18px;
}

.notification-item strong{
  display:block;
  font-size:11px;
}

.notification-item span{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:4px;
}


/* =========================================================
   MAIN
========================================================= */

main{
  padding:18px;
}

.page-heading{
  margin:2px 2px 17px;
}

.page-heading h2{
  margin:0;
  font-size:22px;
  line-height:1.25;
}

.page-heading p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}


/* =========================================================
   REFERRAL HERO
========================================================= */

.referral-hero{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:20px;
}

.hero-icon{
  width:48px;
  height:48px;
  border-radius:14px;
  background:var(--lightgreen);
  color:var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:13px;
}

.hero-icon svg{
  width:25px;
  height:25px;
}

.referral-hero h3{
  margin:0;
  font-size:19px;
}

.referral-hero p{
  margin:7px 0 0;
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
}


/* =========================================================
   CODE
========================================================= */

.code-box{
  margin-top:17px;
  background:var(--lightgreen);
  border:1px solid var(--border);
  border-radius:14px;
  padding:15px;
}

.code-label{
  color:var(--muted);
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
}

.code-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:8px;
}

.referral-code{
  flex:1;
  min-width:0;
  font-size:21px;
  font-weight:800;
  color:var(--green);
  letter-spacing:1px;
  word-break:break-all;
}

.copy-btn{
  border:0;
  background:var(--green);
  color:#fff;
  border-radius:9px;
  padding:10px 13px;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
  flex-shrink:0;
}

.copy-btn:active{
  transform:scale(.96);
}

.link-box{
  margin-top:13px;
}

.link-input-wrap{
  display:flex;
  gap:8px;
  margin-top:7px;
}

.link-input{
  flex:1;
  min-width:0;
  height:43px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--card);
  color:var(--muted);
  padding:0 11px;
  font-size:10px;
  outline:none;
}

.copy-link-btn{
  height:43px;
  border:0;
  border-radius:9px;
  background:var(--darkgreen);
  color:#fff;
  padding:0 13px;
  font-size:10px;
  font-weight:800;
  cursor:pointer;
}


/* =========================================================
   STATS
========================================================= */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:11px;
  margin-top:17px;
}

.stat-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:15px 11px;
  min-height:100px;
}

.stat-icon{
  width:34px;
  height:34px;
  border-radius:10px;
  background:var(--lightgreen);
  color:var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
}

.stat-icon svg{
  width:18px;
  height:18px;
}

.stat-label{
  color:var(--muted);
  font-size:10px;
}

.stat-value{
  font-size:19px;
  font-weight:800;
  margin-top:5px;
}

.stat-value.green-text{
  color:var(--green);
}


/* =========================================================
   SECTIONS
========================================================= */

.section{
  margin-top:21px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.section-title h3{
  margin:0;
  font-size:17px;
}

.section-title span{
  color:var(--muted);
  font-size:10px;
}


/* =========================================================
   REFERRAL LIST
========================================================= */

.referral-list{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.referral-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:14px 13px;
  border-bottom:1px solid var(--border);
}

.referral-row:last-child{
  border-bottom:0;
}

.referral-user{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
}

.referral-avatar{
  width:38px;
  height:38px;
  border-radius:11px;
  background:var(--lightgreen);
  color:var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:800;
  flex-shrink:0;
}

.referral-name{
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:190px;
}

.referral-country{
  color:var(--muted);
  font-size:10px;
  margin-top:4px;
}

.referral-status{
  font-size:9px;
  font-weight:800;
  padding:6px 8px;
  border-radius:7px;
  white-space:nowrap;
}

.status-qualified{
  color:var(--green);
  background:var(--lightgreen);
}

.status-pending{
  color:var(--warning);
  background:#fff4d9;
}

body.dark .status-pending{
  background:#3a2d12;
}


/* =========================================================
   HOW IT WORKS
========================================================= */

.steps{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.step{
  display:flex;
  gap:12px;
  padding:15px;
  border-bottom:1px solid var(--border);
}

.step:last-child{
  border-bottom:0;
}

.step-number{
  width:29px;
  height:29px;
  border-radius:50%;
  background:var(--green);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:800;
  flex-shrink:0;
}

.step strong{
  display:block;
  font-size:12px;
}

.step span{
  display:block;
  color:var(--muted);
  font-size:10px;
  line-height:1.5;
  margin-top:4px;
}


/* =========================================================
   STATES
========================================================= */

.loading{
  text-align:center;
  color:var(--muted);
  padding:45px 10px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:30px 15px;
  font-size:12px;
  line-height:1.5;
}

.error{
  text-align:center;
  color:var(--danger);
  padding:35px 10px;
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:73px;
  background:var(--card);
  border-top:1px solid var(--border);
  z-index:40;
}

.nav-inner{
  max-width:760px;
  height:100%;
  margin:auto;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{
  text-decoration:none;
  color:#83928b;
  font-size:10px;
  text-align:center;
  min-width:58px;
  position:relative;
}

.nav-item svg{
  display:block;
  width:21px;
  height:21px;
  margin:0 auto 5px;
}

.nav-item.active{
  color:var(--green);
  font-weight:800;
}

.nav-item.active:after{
  content:"";
  position:absolute;
  width:28px;
  height:3px;
  border-radius:5px;
  background:var(--green);
  bottom:-8px;
  left:50%;
  transform:translateX(-50%);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:500px){

  main{
    padding:16px;
  }

  .stats{
    grid-template-columns:repeat(3,1fr);
  }

  .stat-card{
    padding:13px 8px;
  }

  .stat-value{
    font-size:17px;
  }

  .referral-name{
    max-width:145px;
  }

}

@media(max-width:390px){

  .code-row{
    align-items:flex-start;
  }

  .referral-code{
    font-size:18px;
  }

  .copy-btn{
    padding:9px 10px;
  }

  .link-input-wrap{
    flex-direction:column;
  }

  .copy-link-btn{
    width:100%;
  }

  .referral-name{
    max-width:125px;
  }

}

@media(max-width:340px){

  .stats{
    grid-template-columns:1fr;
  }

  .stat-card{
    min-height:auto;
  }

}
</style>
</head>

</aside>

<!-- =======================================================
     TOP BAR
======================================================= -->

  <div class="logo">

    <div class="logo-mark">
      T
    </div>

    <span>
      TallyBuck
    </span>

  </div>

      </svg>

      <span

      </span>

      <svg

        <path d="M4 6h16"/>
        <path d="M4 12h16"/>
        <path d="M4 18h16"/>

      </svg>

    </button>

  </div>

</header>


<!-- =======================================================
     NOTIFICATION PANEL
======================================================= -->

<div
  class="notification-panel"

/* =========================================================
   THEME
========================================================= */

function applyTheme(){

  const saved =
    localStorage.getItem(
      "tallybuck-theme"
    ) || "system";

  let dark = false;

  if(saved === "dark"){

    dark = true;

  }else if(saved === "system"){

    dark =
      window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches;

  }

  document.body.classList.toggle(
    "dark",
    dark
  );

}

applyTheme();

themeToggle.addEventListener(
  "click",
  function(){

    const current =
      localStorage.getItem(
        "tallybuck-theme"
      ) || "system";

    let next;

    if(current === "dark"){

      next = "light";

    }else{

      next = "dark";

    }

    localStorage.setItem(
      "tallybuck-theme",
      next
    );

    applyTheme();

  }
);

window.matchMedia(
  "(prefers-color-scheme: dark)"
).addEventListener(
  "change",
  function(){

    const current =
      localStorage.getItem(
        "tallybuck-theme"
      ) || "system";

    if(current === "system"){

      applyTheme();

    }

  }
);


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function getInitials(name){

  if(!name){

    return "U";

  }

  const parts =
    String(name)
      .trim()
      .split(/\s+/);

  if(parts.length === 1){

    return parts[0]
      .substring(0,2)
      .toUpperCase();

  }

  return (
    parts[0][0] +
    parts[1][0]
  ).toUpperCase();

}


/* =========================================================
   COPY
========================================================= */

async function copyText(text){

  try{

    await navigator.clipboard.writeText(
      text
    );

    alert(
      "Copied successfully."
    );

  }catch(error){

    const textarea =
      document.createElement(
        "textarea"
      );

    textarea.value = text;

    document.body.appendChild(
      textarea
    );

    textarea.select();

    document.execCommand(
      "copy"
    );

    textarea.remove();

    alert(
      "Copied successfully."
    );

  }

}


/* =========================================================

async function loadNotifications(){

  try{

    const {
      data:{session}
    } =
      await db.auth.getSession();

    if(!session)return;

    const {
      data,
      error
    } =
      await db
        .from("notifications")
        .select(
          "id,title,message,is_read,created_at"
        )
        .eq(
          "user_id",
          session.user.id
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        )
        .limit(3);

    if(error){

      console.error(
        "Notification error:",
        error
      );

      return;

    }

    const notifications =
      data || [];

    const unread =
      notifications.some(
        item => !item.is_read
      );

    notificationDot.style.display =
      unread ? "block" : "none";

    const list =
      document.getElementById(
        "notificationList"
      );

    if(!notifications.length){

      list.innerHTML = `
        <div class="empty">
          No notifications yet.
        </div>
      `;

      return;

    }

    list.innerHTML =
      notifications.map(
        item => `

          <div class="notification-item">

            <div class="notification-icon">

              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2">

                <path d="M10 21h4"/>

            </div>

            <div>

              <strong>
                ${escapeHtml(item.title)}
              </strong>

              <span>
                ${escapeHtml(item.message)}
              </span>

            </div>

          </div>

        `
      ).join("");

  }catch(error){

    console.error(
      "Notification load error:",
      error
    );

  }

}

        .filter(Boolean);
