<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Account — RexTasks</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#06120d;color:#fff;min-height:100vh;padding:24px;display:flex;align-items:center;justify-content:center}
.box{width:100%;max-width:440px}
.logo{text-align:center;margin-bottom:25px}
.logo b{display:flex;width:52px;height:52px;margin:auto;border-radius:16px;background:#18a957;align-items:center;justify-content:center;font-size:25px}
.logo h1{margin-top:10px;font-size:25px}
.logo p,.sub{color:#8fa69a;font-size:14px;margin-top:6px}
.card{background:#0b1d15;border:1px solid #18392a;border-radius:24px;padding:26px 20px}
h2{font-size:23px;margin-bottom:7px}
.sub{margin-bottom:22px}
.group{margin-bottom:15px}
label{display:block;font-size:13px;font-weight:bold;margin-bottom:7px}
input,select{width:100%;height:50px;background:#07150f;border:1px solid #254737;border-radius:12px;color:#fff;padding:0 13px;font-size:14px;outline:0}
input:focus,select:focus{border-color:#25d366}
input::placeholder{color:#63786d}
.terms{display:flex;gap:8px;margin:17px 0;color:#84998f;font-size:12px;line-height:1.5}
.terms input{width:16px;height:16px;accent-color:#25d366}
a{color:#25d366;text-decoration:none}
button{width:100%;height:52px;border:0;border-radius:13px;background:#25d366;color:#031009;font-weight:bold;font-size:15px}
button:disabled{opacity:.6}
.msg{display:none;padding:12px;border-radius:10px;margin-bottom:15px;font-size:13px;line-height:1.4}
.error{display:block;background:#351719;color:#ffb5b8;border:1px solid #713337}
.success{display:block;background:#0c3020;color:#9af0bd;border:1px solid #1d6844}
.login,.back{text-align:center;font-size:13px;color:#82978d;margin-top:18px}
</style>
</head>

<body>
<div class="box">

<div class="logo">
<b>R</b>
<h1>RexTasks</h1>
<p>Complete tasks. Earn real rewards.</p>
</div>

<div class="card">
<h2>Create your account</h2>
<p class="sub">Join RexTasks for free and start earning.</p>

<div id="msg" class="msg"></div>

<form id="form">

<div class="group">
<label>Full name</label>
<input id="name" type="text" placeholder="Enter your full name" required>
</div>

<div class="group">
<label>Email address</label>
<input id="email" type="email" placeholder="you@example.com" required>
</div>

<div class="group">
<label>Password</label>
<input id="password" type="password" minlength="6" placeholder="Create a password" required>
</div>

<div class="group">
<label>Country</label>
<select id="country" required>
<option value="">Select your country</option>
<option>Nigeria</option>
<option>United States</option>
<option>United Kingdom</option>
<option>Canada</option>
<option>Australia</option>
<option>Germany</option>
<option>France</option>
<option>South Africa</option>
<option>Ghana</option>
<option>Kenya</option>
<option>Other</option>
</select>
</div>

<div class="group">
<label>Referral code <span style="color:#71867b">(optional)</span></label>
<input id="referral" type="text" placeholder="Enter referral code">
</div>

<label class="terms">
<input id="terms" type="checkbox" required>
<span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</span>
</label>

<button id="btn" type="submit">Create Free Account</button>

</form>

<div class="login">Already have an account? <a href="login.html">Sign in</a></div>
<div class="back"><a href="index.html">← Back to RexTasks</a></div>

</div>
</div>

<script>
const SUPABASE_URL="https://cetsxdkoauucxwsbdktl.supabase.co";
const SUPABASE_KEY="sb_publishable_crwxMSen3GDl9BQZfy_QLg_o_uicRCD";

const form=document.getElementById("form");
const msg=document.getElementById("msg");
const btn=document.getElementById("btn");
const referral=document.getElementById("referral");

const params=new URLSearchParams(location.search);
if(params.get("ref")) referral.value=params.get("ref");

function show(text,type){
msg.textContent=text;
msg.className="msg "+type;
}

form.addEventListener("submit",async e=>{
e.preventDefault();

btn.disabled=true;
btn.textContent="Creating account...";
msg.className="msg";
msg.style.display="none";

const fullName=document.getElementById("name").value.trim();
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
const country=document.getElementById("country").value;
const ref=referral.value.trim();

try{

const response=await fetch(
SUPABASE_URL+"/auth/v1/signup",
{
method:"POST",
headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY
},
body:JSON.stringify({
email:email,
password:password,
data:{
full_name:fullName,
country:country,
referral_code:"",
referred_by_code:ref
}
})
});

const data=await response.json();

if(!response.ok){
throw new Error(data.msg||data.message||"Unable to create account.");
}

show(
"Account created successfully! Check your email to confirm your account.",
"success"
);

form.reset();

}catch(error){

show(error.message,"error");

}

btn.disabled=false;
btn.textContent="Create Free Account";
});
</script>

</body>
</html>
