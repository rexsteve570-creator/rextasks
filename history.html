<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TallyBuck — History</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f5faf7;
  --card:#ffffff;
  --text:#15231d;
  --muted:#718078;
  --border:#e3ebe7;
  --green:#079447;
  --darkgreen:#063f2d;
  --lightgreen:#e9f8ef;
  --danger:#d63636;
  --warning:#b77900;
  --shadow:0 8px 30px rgba(20,50,35,.06);
}

body.dark{
  --bg:#06130d;
  --card:#0b2117;
  --text:#effaf4;
  --muted:#91aa9e;
  --border:#1b3a2c;
  --green:#59e696;
  --darkgreen:#052d20;
  --lightgreen:#123a29;
  --danger:#ff7373;
  --warning:#f3c45f;
  --shadow:0 8px 30px rgba(0,0,0,.25);
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
  padding-bottom:78px;
}

/* HEADER */

.header{
  height:64px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  position:sticky;
  top:0;
  z-index:50;
}

.logo{
  width:36px;
  height:36px;
  border-radius:11px;
  background:var(--green);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:800;
  position:absolute;
  left:50%;
  transform:translateX(-50%);
}

.header-right{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:8px;
}

.icon-btn{
  width:40px;
  height:40px;
  border:0;
  background:transparent;
  color:var(--text);
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.icon-btn:hover{
  background:var(--lightgreen);
}

.icon-btn svg{
  width:21px;
  height:21px;
}

/* THEME */

.theme-wrap{
  position:relative;
}

.theme-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  background:transparent;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
}

.theme-btn:hover{
  background:var(--lightgreen);
}

.theme-btn svg{
  width:20px;
  height:20px;
}

.theme-menu{
  position:absolute;
  top:48px;
  right:0;
  width:145px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:var(--shadow);
  padding:6px;
  display:none;
  z-index:100;
}

.theme-menu.show{
  display:block;
}

.theme-option{
  width:100%;
  border:0;
  background:transparent;
  color:var(--text);
  text-align:left;
  padding:10px 11px;
  border-radius:9px;
}

.theme-option:hover{
  background:var(--lightgreen);
}

/* SIDE MENU */

.menu-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  z-index:80;
}

.menu-overlay.show{
  display:block;
}

.side-menu{
  position:fixed;
  top:0;
  left:-290px;
  width:280px;
  height:100vh;
  background:var(--card);
  border-right:1px solid var(--border);
  z-index:90;
  transition:left .25s ease;
  padding:20px 14px;
  overflow-y:auto;
}

.side-menu.open{
  left:0;
}

.menu-logo{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 8px 22px;
  border-bottom:1px solid var(--border);
  margin-bottom:12px;
}

.menu-logo-mark{
  width:38px;
  height:38px;
  background:var(--green);
  color:white;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:20px;
}

.menu-logo-text{
  font-size:19px;
  font-weight:800;
}

.menu-link{
  width:100%;
  border:0;
  background:transparent;
  color:var(--text);
  display:flex;
  align-items:center;
  gap:13px;
  padding:13px 12px;
  border-radius:12px;
  text-align:left;
  margin-bottom:4px;
}

.menu-link:hover,
.menu-link.active{
  background:var(--lightgreen);
  color:var(--green);
}

.menu-link svg{
  width:20px;
  height:20px;
  flex:none;
}

.menu-divider{
  height:1px;
  background:var(--border);
  margin:12px 8px;
}

/* MAIN */

main{
  width:100%;
  max-width:760px;
  margin:0 auto;
  padding:25px 16px 30px;
}

.page-title{
  font-size:27px;
  font-weight:800;
  margin-bottom:6px;
}

.page-subtitle{
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
  margin-bottom:22px;
}

/* SUMMARY */

.summary-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:18px;
}

.summary-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:15px 12px;
  box-shadow:var(--shadow);
}

.summary-label{
  color:var(--muted);
  font-size:11px;
  margin-bottom:7px;
}

.summary-value{
  font-size:17px;
  font-weight:800;
}

/* FILTER */

.filter-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  margin-bottom:16px;
  box-shadow:var(--shadow);
}

.filter-row{
  display:flex;
  gap:9px;
}

.filter-select{
  flex:1;
  height:44px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--bg);
  color:var(--text);
  padding:0 11px;
  outline:none;
}

.filter-select:focus{
  border-color:var(--green);
}

/* HISTORY */

.history-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.history-header{
  padding:17px;
  border-bottom:1px solid var(--border);
  font-weight:800;
  font-size:16px;
}

.history-list{
  width:100%;
}

.history-item{
  padding:16px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:12px;
}

.history-item:last-child{
  border-bottom:0;
}

.history-icon{
  width:42px;
  height:42px;
  border-radius:12px;
  background:var(--lightgreen);
  color:var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
}

.history-icon svg{
  width:20px;
  height:20px;
}

.history-content{
  min-width:0;
  flex:1;
}

.history-title{
  font-weight:700;
  font-size:14px;
  margin-bottom:5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.history-date{
  color:var(--muted);
  font-size:12px;
}

.history-right{
  text-align:right;
  flex:none;
}

.history-amount{
  font-size:14px;
  font-weight:800;
  margin-bottom:5px;
}

.history-amount.positive{
  color:var(--green);
}

.history-amount.negative{
  color:var(--danger);
}

.status{
  display:inline-block;
  padding:4px 7px;
  border-radius:7px;
  font-size:10px;
  font-weight:700;
  text-transform:capitalize;
}

.status.completed{
  background:var(--lightgreen);
  color:var(--green);
}

.status.pending,
.status.processing{
  background:#fff5d9;
  color:var(--warning);
}

body.dark .status.pending,
body.dark .status.processing{
  background:#3b3017;
}

.status.failed,
.status.cancelled,
.status.canceled,
.status.rejected{
  background:#fdeaea;
  color:var(--danger);
}

body.dark .status.failed,
body.dark .status.cancelled,
body.dark .status.canceled,
body.dark .status.rejected{
  background:#3a1717;
}

.empty{
  padding:45px 20px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
}

.loading{
  padding:35px 20px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
}

.error-message{
  padding:18px;
  color:var(--danger);
  font-size:13px;
  text-align:center;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:68px;
  background:var(--card);
  border-top:1px solid var(--border);
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:60;
}

.bottom-link{
  border:0;
  background:transparent;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:10px;
  min-width:60px;
}

.bottom-link svg{
  width:20px;
  height:20px;
}

.bottom-link.active{
  color:var(--green);
}

/* RESPONSIVE */

@media(max-width:480px){

  main{
    padding-left:13px;
    padding-right:13px;
  }

  .summary-grid{
    gap:7px;
  }

  .summary-card{
    padding:13px 9px;
  }

  .summary-value{
    font-size:15px;
  }

  .history-item{
    padding:14px 12px;
  }

  .history-icon{
    width:38px;
    height:38px;
  }

  .history-title{
    font-size:13px;
  }

  .history-amount{
    font-size:13px;
  }
}
</style>
</head>

<script>
const SUPABASE_URL =
  "https://cetsxdkoauucxwsbdktl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_crwxMSen3GDl9BQZfy_QLg_o_uicRCD";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const THEME_KEY =
  "tallybuck-theme";

let currentUser = null;
let allHistory = [];

const historyList =
  document.getElementById("historyList");

const typeFilter =
  document.getElementById("typeFilter");

const statusFilter =
  document.getElementById("statusFilter");

const totalEarnedEl =
  document.getElementById("totalEarned");

const totalWithdrawnEl =
  document.getElementById("totalWithdrawn");

const transactionCountEl =
  document.getElementById("transactionCount");

/* =========================================================
   THEME
========================================================= */

function applyTheme(theme){

  let finalTheme = theme;

  if(theme === "system"){

    finalTheme =
      window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches
        ? "dark"
        : "light";
  }

  document.body.classList.toggle(
    "dark",
    finalTheme === "dark"
  );
}

function setTheme(theme){

  localStorage.setItem(
    THEME_KEY,
    theme
  );

  applyTheme(theme);

  document
    .getElementById("themeMenu")
    .classList.remove("show");
}

const savedTheme =
  localStorage.getItem(THEME_KEY) ||
  "system";

applyTheme(savedTheme);

document
  .getElementById("themeBtn")
  .addEventListener("click", function(e){

    e.stopPropagation();

    document
      .getElementById("themeMenu")
      .classList.toggle("show");
  });

document
  .querySelectorAll(".theme-option")
  .forEach(function(button){

    button.addEventListener(
      "click",
      function(){

        setTheme(
          this.dataset.theme
        );
      }
    );
  });

document.addEventListener(
  "click",
  function(e){

    if(!e.target.closest(".theme-wrap")){

      document
        .getElementById("themeMenu")
        .classList.remove("show");
    }
  }
);

window
  .matchMedia(
    "(prefers-color-scheme: dark)"
  )
  .addEventListener(
    "change",
    function(){

      const theme =
        localStorage.getItem(THEME_KEY) ||
        "system";

      if(theme === "system"){
        applyTheme("system");
      }
    }
  );

/* =========================================================
   SIDE MENU
========================================================= */

const menuBtn =
  document.getElementById("menuBtn");

const sideMenu =
  document.getElementById("sideMenu");

const menuOverlay =
  document.getElementById("menuOverlay");

function openMenu(){

  sideMenu.classList.add("open");
  menuOverlay.classList.add("show");
}

function closeMenu(){

  sideMenu.classList.remove("open");
  menuOverlay.classList.remove("show");
}

menuBtn.addEventListener(
  "click",
  openMenu
);

menuOverlay.addEventListener(
  "click",
  closeMenu
);

/* =========================================================
   HELPERS
========================================================= */

function money(value){

  return "$" +
    Number(value || 0)
      .toFixed(2);
}

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatDate(date){

  if(!date) return "";

  const d =
    new Date(date);

  if(Number.isNaN(d.getTime())){
    return "";
  }

  return d.toLocaleString(
    [],
    {
      year:"numeric",
      month:"short",
      day:"numeric",
      hour:"numeric",
      minute:"2-digit"
    }
  );
}

/* =========================================================
   AUTH
========================================================= */

async function checkUser(){

  const {
    data,
    error
  } =
    await db.auth.getSession();

  if(error){

    console.error(error);

    location.href =
      "login.html";

    return;
  }

  if(!data.session){

    location.href =
      "login.html";

    return;
  }

  currentUser =
    data.session.user;

  await loadHistory();
}

/* =========================================================
   LOAD HISTORY
========================================================= */

async function loadHistory(){

  historyList.innerHTML =
    '<div class="loading">Loading history...</div>';

  try{

    const [
      transactionsResult,
      withdrawalsResult
    ] =
      await Promise.all([

        db
          .from("wallet_transactions")
          .select(`
            id,
            user_id,
            type,
            amount,
            reference_type,
            reference_id,
            description,
            created_at
          `)
          .eq(
            "user_id",
            currentUser.id
          )
          .order(
            "created_at",
            {
              ascending:false
            }
          )
          .limit(100),

        db
          .from("withdrawals")
          .select(`
            id,
            amount,
            fee,
            net_amount,
            method,
            network,
            status,
            created_at,
            processed_at
          `)
          .eq(
            "user_id",
            currentUser.id
          )
          .order(
            "created_at",
            {
              ascending:false
            }
          )
          .limit(100)

      ]);

    if(transactionsResult.error){
      throw transactionsResult.error;
    }

    if(withdrawalsResult.error){
      throw withdrawalsResult.error;
    }

    const transactions =
      transactionsResult.data || [];

    const withdrawals =
      withdrawalsResult.data || [];

    allHistory = [];

    /*
      Wallet transactions represent actual wallet movements.

      Withdrawal records are handled separately because their
      status belongs to the withdrawals table.

      Therefore withdrawal-related wallet transaction rows are
      intentionally excluded here to prevent duplicate history.
    */

    transactions.forEach(function(item){

      const type =
        String(item.type || "")
          .toLowerCase();

      if(
        type === "withdrawal_pending" ||
        type === "withdrawal_paid" ||
        type === "withdrawal_cancelled" ||
        type === "withdrawal_canceled"
      ){
        return;
      }

      const amount =
        Number(item.amount || 0);

      let title =
        "Wallet transaction";

      if(item.description){

        title =
          item.description;

      }else if(item.type){

        title =
          formatTransactionType(
            item.type
          );
      }

      allHistory.push({

        id:
          "transaction-" +
          item.id,

        type:
          "earning",

        title:
          title,

        amount:
          amount,

        status:
          "completed",

        created_at:
          item.created_at,

        positive:
          amount >= 0
      });

    });

    /*
      Withdrawals get their real status directly from
      public.withdrawals.
    */

    withdrawals.forEach(function(item){

      const amount =
        Number(item.amount || 0);

      let title =
        "Withdrawal";

      const method =
        String(item.method || "")
          .toLowerCase();

      if(method === "bank"){

        title =
          "Nigeria Bank withdrawal";

      }else if(method === "crypto"){

        title =
          "Crypto withdrawal";

        if(item.network){

          title +=
            " · " +
            item.network;
        }
      }

      allHistory.push({

        id:
          "withdrawal-" +
          item.id,

        type:
          "withdrawal",

        title:
          title,

        amount:
          -Math.abs(amount),

        status:
          normalizeStatus(
            item.status || "pending"
          ),

        created_at:
          item.created_at,

        processed_at:
          item.processed_at,

        positive:
          false
      });

    });

    allHistory.sort(
      function(a,b){

        return new Date(
          b.created_at
        ) -
        new Date(
          a.created_at
        );
      }
    );

    updateSummary();

    renderHistory();

  }catch(error){

    console.error(
      "History error:",
      error
    );

    historyList.innerHTML =
      '<div class="error-message">' +
      'Unable to load your history. Please refresh and try again.' +
      '</div>';
  }
}

/* =========================================================
   TRANSACTION TYPE
========================================================= */

function formatTransactionType(type){

  const value =
    String(type || "")
      .replace(/_/g," ")
      .trim();

  if(!value){
    return "Wallet transaction";
  }

  return (
    value.charAt(0).toUpperCase() +
    value.slice(1)
  );
}

/* =========================================================
   SUMMARY
========================================================= */

function updateSummary(){

  let totalEarned = 0;
  let totalWithdrawn = 0;

  allHistory.forEach(function(item){

    /*
      Earnings are positive wallet rewards.
    */

    if(
      item.type === "earning" &&
      item.amount > 0
    ){

      totalEarned +=
        item.amount;
    }

    /*
      Only PAID withdrawals count as
      actually withdrawn.

      Pending and cancelled withdrawals
      do not count here.
    */

    if(
      item.type === "withdrawal" &&
      normalizeStatus(item.status) === "completed"
    ){

      totalWithdrawn +=
        Math.abs(item.amount);
    }

  });

  totalEarnedEl.textContent =
    money(totalEarned);

  totalWithdrawnEl.textContent =
    money(totalWithdrawn);

  transactionCountEl.textContent =
    allHistory.length;
}

/* =========================================================
   RENDER
========================================================= */

function renderHistory(){

  const typeValue =
    typeFilter.value;

  const statusValue =
    statusFilter.value;

  const filtered =
    allHistory.filter(
      function(item){

        const typeMatch =
          typeValue === "all" ||
          item.type === typeValue;

        const statusMatch =
          statusValue === "all" ||
          normalizeStatus(
            item.status
          ) === statusValue;

        return (
          typeMatch &&
          statusMatch
        );
      }
    );

  if(filtered.length === 0){

    historyList.innerHTML =
      '<div class="empty">' +
      'No transactions found.' +
      '</div>';

    return;
  }

  historyList.innerHTML =
    filtered.map(
      function(item){

        const isWithdrawal =
          item.type === "withdrawal";

        const icon =
          isWithdrawal

          ? `
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M12 5v14"/>
              <path d="M7 14l5 5 5-5"/>
            </svg>
          `

          : `
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M12 21V3"/>
              <path d="M7 8l5-5 5 5"/>
            </svg>
          `;

        const status =
          normalizeStatus(
            item.status
          );

        const amountClass =
          item.amount >= 0
            ? "positive"
            : "negative";

        const amountText =
          item.amount >= 0
            ? "+" +
              money(item.amount)
            : "-" +
              money(
                Math.abs(
                  item.amount
                )
              );

        return `
          <div class="history-item">

            <div class="history-icon">
              ${icon}
            </div>

            <div class="history-content">

              <div class="history-title">
                ${escapeHtml(
                  item.title
                )}
              </div>

              <div class="history-date">
                ${escapeHtml(
                  formatDate(
                    item.created_at
                  )
                )}
              </div>

            </div>

            <div class="history-right">

              <div class="history-amount ${amountClass}">
                ${amountText}
              </div>

              <span class="status ${escapeHtml(status)}">
                ${escapeHtml(status)}
              </span>

            </div>

          </div>
        `;

      }
    ).join("");
}

/* =========================================================
   STATUS
========================================================= */

function normalizeStatus(status){

  const value =
    String(
      status || "completed"
    ).toLowerCase();

  if(
    value === "success" ||
    value === "successful" ||
    value === "approved" ||
    value === "paid"
  ){

    return "completed";
  }

  if(value === "canceled"){
    return "cancelled";
  }

  if(value === "processing"){
    return "processing";
  }

  if(
    value === "pending"
  ){

    return "pending";
  }

  if(
    value === "failed"
  ){

    return "failed";
  }

  if(
    value === "rejected"
  ){

    return "rejected";
  }

  if(
    value === "cancelled"
  ){

    return "cancelled";
  }

  return value;
}

/* =========================================================
   FILTERS
========================================================= */

typeFilter.addEventListener(
  "change",
  renderHistory
);

statusFilter.addEventListener(
  "change",
  renderHistory
);

/* =========================================================
   LOGOUT
========================================================= */

document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    async function(){

      const button =
        this;

      button.disabled =
        true;

      const {
        error
      } =
        await db.auth.signOut();

      if(error){

        console.error(error);

        button.disabled =
          false;

        return;
      }

      location.href =
        "login.html";
    }
  );

/* =========================================================
   START
========================================================= */

checkUser();
