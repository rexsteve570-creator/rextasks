<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — TallyBuck</title><style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100vh;
  background:
    radial-gradient(circle at top right,rgba(35,197,94,.12),transparent 32%),
    #06100b;
  color:#f4faf6;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.container{
  width:100%;
  max-width:430px;
}

.logo{
  text-align:center;
  margin-bottom:28px;
}

.logo a{
  color:#dfffea;
  text-decoration:none;
  font-size:28px;
  font-weight:800;
  letter-spacing:-1px;
}

.logo span{
  color:#35d878;
}

.card{
  background:rgba(10,25,17,.92);
  border:1px solid rgba(91,214,133,.16);
  border-radius:24px;
  padding:30px 24px;
  box-shadow:0 24px 70px rgba(0,0,0,.35);
}

.icon{
  width:58px;
  height:58px;
  margin:0 auto 20px;
  border-radius:18px;
  background:rgba(53,216,120,.1);
  border:1px solid rgba(53,216,120,.2);
  display:flex;
  align-items:center;
  justify-content:center;
}

.icon svg{
  width:28px;
  height:28px;
  stroke:#35d878;
}

h1{
  text-align:center;
  font-size:27px;
  margin-bottom:10px;
  letter-spacing:-.5px;
}

.subtitle{
  text-align:center;
  color:#91a99b;
  line-height:1.6;
  font-size:14px;
  margin-bottom:28px;
}

.input-group{
  margin-bottom:18px;
}

label{
  display:block;
  font-size:13px;
  font-weight:600;
  color:#cce0d3;
  margin-bottom:8px;
}

.password-wrap{
  position:relative;
}

input{
  width:100%;
  height:52px;
  border-radius:14px;
  border:1px solid #23392b;
  background:#08150e;
  color:#fff;
  outline:none;
  padding:0 48px 0 15px;
  font-size:15px;
  transition:.2s;
}

input:focus{
  border-color:#35d878;
  box-shadow:0 0 0 3px rgba(53,216,120,.08);
}

.toggle{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  width:28px;
  height:28px;
  padding:0;
  border:0;
  background:none;
  color:#789182;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

.toggle:hover{
  background:none;
  color:#35d878;
}

.toggle svg{
  width:19px;
  height:19px;
}

button.submit{
  width:100%;
  height:52px;
  border:0;
  border-radius:14px;
  background:#35d878;
  color:#041008;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
  margin-top:4px;
}

button.submit:hover{
  background:#48e687;
}

button.submit:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  margin-top:18px;
  padding:13px 14px;
  border-radius:12px;
  font-size:13px;
  line-height:1.5;
}

.message.success{
  display:block;
  background:rgba(53,216,120,.08);
  border:1px solid rgba(53,216,120,.2);
  color:#8af0b3;
}

.message.error{
  display:block;
  background:rgba(239,68,68,.08);
  border:1px solid rgba(239,68,68,.2);
  color:#ff9a9a;
}

.login-link{
  text-align:center;
  margin-top:22px;
}

.login-link a{
  color:#70e99d;
  text-decoration:none;
  font-size:14px;
  font-weight:600;
}

.login-link a:hover{
  text-decoration:underline;
}

.footer{
  text-align:center;
  color:#61776a;
  font-size:12px;
  line-height:1.5;
  margin-top:22px;
}

@media(max-width:480px){
  body{
    padding:18px;
  }

  .card{
    padding:27px 20px;
    border-radius:20px;
  }

  h1{
    font-size:24px;
  }
}
</style></head><body><div class="container">  <div class="logo">
    <a href="index.html">Tally<span>Buck</span></a>
  </div>  <div class="card"><div class="icon">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="10" width="16" height="10" rx="2"></rect>
    <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
    <path d="M12 14v2"></path>
  </svg>
</div>

<h1>Create a new password</h1>

<p class="subtitle">
  Choose a strong new password for your TallyBuck account.
</p>

<form id="resetForm">

  <div class="input-group">
    <label for="password">New password</label>

    <div class="password-wrap">
      <input
        type="password"
        id="password"
        placeholder="Enter your new password"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <button
        type="button"
        class="toggle"
        id="togglePassword"
        aria-label="Show password"
      >
        <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>
          <circle cx="12" cy="12" r="2.5"></circle>
        </svg>
      </button>
    </div>
  </div>

  <div class="input-group">
    <label for="confirmPassword">Confirm new password</label>

    <div class="password-wrap">
      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your new password"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <button
        type="button"
        class="toggle"
        id="toggleConfirm"
        aria-label="Show password"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>
          <circle cx="12" cy="12" r="2.5"></circle>
        </svg>
      </button>
    </div>
  </div>

  <button type="submit" class="submit" id="resetBtn">
    Update password
  </button>

</form>

<div id="message" class="message"></div>

<div class="login-link">
  <a href="login.html">← Back to Log in</a>
</div>

  </div>  <div class="footer">
    TallyBuck is a rewards platform for completing eligible tasks and activities.
  </div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL = "https://cetsxdkoauucxwsbdktl.supabase.co";
const SUPABASE_KEY = "sb_publishable_crwxMSen3GDl9BQZfy_QLg_o_uicRCD";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form = document.getElementById("resetForm");
const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirmPassword");
const resetBtn = document.getElementById("resetBtn");
const message = document.getElementById("message");

function showMessage(text, type){
  message.textContent = text;
  message.className = "message " + type;
}

function setupToggle(buttonId, input){
  const button = document.getElementById(buttonId);

  button.addEventListener("click", () => {

    const isPassword = input.type === "password";

    input.type = isPassword ? "text" : "password";

    button.setAttribute(
      "aria-label",
      isPassword ? "Hide password" : "Show password"
    );
  });
}

setupToggle("togglePassword", password);
setupToggle("toggleConfirm", confirmPassword);

async function checkSession(){

  const { data, error } = await supabaseClient.auth.getSession();

  if(error){
    console.error(error);
  }

  if(!data.session){

    showMessage(
      "This password reset link is invalid or has expired. Please request a new reset link.",
      "error"
    );

    resetBtn.disabled = true;
  }
}

checkSession();

form.addEventListener("submit", async (event) => {

  event.preventDefault();

  const newPassword = password.value;
  const confirm = confirmPassword.value;

  if(newPassword.length < 6){
    showMessage(
      "Your password must be at least 6 characters long.",
      "error"
    );
    return;
  }

  if(newPassword !== confirm){
    showMessage(
      "The passwords do not match.",
      "error"
    );
    return;
  }

  resetBtn.disabled = true;
  resetBtn.textContent = "Updating...";

  message.className = "message";
  message.textContent = "";

  try{

    const { error } = await supabaseClient.auth.updateUser({
      password: newPassword
    });

    if(error){
      throw error;
    }

    showMessage(
      "Your password has been updated successfully. You can now log in with your new password.",
      "success"
    );

    form.reset();

    setTimeout(() => {
      window.location.href = "login.html";
    }, 2200);

  }catch(error){

    showMessage(
      error.message || "Unable to update your password. Please request a new reset link.",
      "error"
    );

    resetBtn.disabled = false;
    resetBtn.textContent = "Update password";
  }

});
</script></body>
</html>
