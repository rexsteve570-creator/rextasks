<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TallyBuck — Profile</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f5faf7;
  --card:#ffffff;
  --text:#15231d;
  --muted:#718078;
  --border:#e3ebe7;
  --green:#079447;
  --darkgreen:#063f2d;
  --lightgreen:#e9f8ef;
  --danger:#d63636;
  --shadow:0 8px 30px rgba(20,50,35,.06);
}

body.dark{
  --bg:#06130d;
  --card:#0b2117;
  --text:#effaf4;
  --muted:#91aa9e;
  --border:#1b3a2c;
  --green:#59e696;
  --darkgreen:#052d20;
  --lightgreen:#123a29;
  --danger:#ff7373;
  --shadow:0 8px 30px rgba(0,0,0,.25);
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
  padding-bottom:78px;
}

/* HEADER */

.header{
  height:64px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  position:sticky;
  top:0;
  z-index:50;
}

.logo{
  width:36px;
  height:36px;
  border-radius:11px;
  background:var(--green);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:800;
  position:absolute;
  left:50%;
  transform:translateX(-50%);
}

.header-right{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:8px;
}

.icon-btn{
  width:40px;
  height:40px;
  border:0;
  background:transparent;
  color:var(--text);
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.icon-btn:hover{
  background:var(--lightgreen);
}

.icon-btn svg{
  width:21px;
  height:21px;
}

/* THEME */

.theme-wrap{
  position:relative;
}

.theme-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  background:transparent;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
}

.theme-btn:hover{
  background:var(--lightgreen);
}

.theme-btn svg{
  width:20px;
  height:20px;
}

.theme-menu{
  position:absolute;
  top:48px;
  right:0;
  width:145px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:var(--shadow);
  padding:6px;
  display:none;
  z-index:100;
}

.theme-menu.show{
  display:block;
}

.theme-option{
  width:100%;
  border:0;
  background:transparent;
  color:var(--text);
  text-align:left;
  padding:10px 11px;
  border-radius:9px;
}

.theme-option:hover{
  background:var(--lightgreen);
}

/* SIDE MENU */

.menu-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  z-index:80;
}

.menu-overlay.show{
  display:block;
}

.side-menu{
  position:fixed;
  top:0;
  left:-290px;
  width:280px;
  height:100vh;
  background:var(--card);
  border-right:1px solid var(--border);
  z-index:90;
  transition:left .25s ease;
  padding:20px 14px;
  overflow-y:auto;
}

.side-menu.open{
  left:0;
}

.menu-logo{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 8px 22px;
  border-bottom:1px solid var(--border);
  margin-bottom:12px;
}

.menu-logo-mark{
  width:38px;
  height:38px;
  background:var(--green);
  color:#fff;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:20px;
}

.menu-logo-text{
  font-size:19px;
  font-weight:800;
}

.menu-link{
  width:100%;
  border:0;
  background:transparent;
  color:var(--text);
  display:flex;
  align-items:center;
  gap:13px;
  padding:13px 12px;
  border-radius:12px;
  text-align:left;
  margin-bottom:4px;
}

.menu-link:hover,
.menu-link.active{
  background:var(--lightgreen);
  color:var(--green);
}

.menu-link svg{
  width:20px;
  height:20px;
  flex:none;
}

.menu-divider{
  height:1px;
  background:var(--border);
  margin:12px 8px;
}

/* MAIN */

main{
  width:100%;
  max-width:700px;
  margin:0 auto;
  padding:25px 16px 30px;
}

.page-title{
  font-size:27px;
  font-weight:800;
  margin-bottom:6px;
}

.page-subtitle{
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
  margin-bottom:22px;
}

/* PROFILE HEADER */

.profile-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
  box-shadow:var(--shadow);
  margin-bottom:16px;
}

.profile-top{
  display:flex;
  align-items:center;
  gap:15px;
}

.avatar{
  width:64px;
  height:64px;
  border-radius:50%;
  background:var(--lightgreen);
  color:var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  font-weight:800;
  flex:none;
}

.profile-name{
  font-size:20px;
  font-weight:800;
  margin-bottom:5px;
}

.profile-email{
  color:var(--muted);
  font-size:13px;
  word-break:break-word;
}

/* CARDS */

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  box-shadow:var(--shadow);
  margin-bottom:16px;
}

.card-title{
  font-size:16px;
  font-weight:800;
  margin-bottom:17px;
}

.form-group{
  margin-bottom:15px;
}

.form-group:last-child{
  margin-bottom:0;
}

label{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
  margin-bottom:7px;
}

input,
select{
  width:100%;
  height:46px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--bg);
  color:var(--text);
  padding:0 12px;
  outline:none;
}

input:focus,
select:focus{
  border-color:var(--green);
}

input:disabled{
  opacity:.7;
}

.save-btn{
  width:100%;
  height:46px;
  border:0;
  border-radius:11px;
  background:var(--green);
  color:#fff;
  font-weight:800;
  margin-top:4px;
}

.save-btn:hover{
  opacity:.92;
}

.save-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

/* PASSWORD */

.password-note{
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
  margin-bottom:15px;
}

/* MESSAGES */

.message{
  display:none;
  padding:11px 12px;
  border-radius:10px;
  font-size:13px;
  line-height:1.4;
  margin-bottom:14px;
}

.message.show{
  display:block;
}

.message.success{
  background:var(--lightgreen);
  color:var(--green);
}

.message.error{
  background:#fdeaea;
  color:var(--danger);
}

body.dark .message.error{
  background:#3a1717;
}

/* LOGOUT */

.logout-btn{
  width:100%;
  height:46px;
  border:1px solid var(--danger);
  border-radius:11px;
  background:transparent;
  color:var(--danger);
  font-weight:800;
}

.logout-btn:hover{
  background:#fdeaea;
}

body.dark .logout-btn:hover{
  background:#3a1717;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:68px;
  background:var(--card);
  border-top:1px solid var(--border);
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:60;
}

.bottom-link{
  border:0;
  background:transparent;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:10px;
  min-width:60px;
}

.bottom-link svg{
  width:20px;
  height:20px;
}

.bottom-link.active{
  color:var(--green);
}

/* RESPONSIVE */

@media(max-width:480px){

  main{
    padding-left:13px;
    padding-right:13px;
  }

  .profile-card{
    padding:18px;
  }

  .avatar{
    width:58px;
    height:58px;
    font-size:22px;
  }

  .profile-name{
    font-size:18px;
  }
}
</style>
</head>

<script>

const SUPABASE_URL =
  "https://cetsxdkoauucxwsbdktl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_crwxMSen3GDl9BQZfy_QLg_o_uicRCD";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const THEME_KEY =
  "tallybuck-theme";

let currentUser = null;

/* =========================================================
   THEME
========================================================= */

function applyTheme(theme){

  let finalTheme = theme;

  if(theme === "system"){

    finalTheme =
      window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches
      ? "dark"
      : "light";
  }

  document.body.classList.toggle(
    "dark",
    finalTheme === "dark"
  );
}

function setTheme(theme){

  localStorage.setItem(
    THEME_KEY,
    theme
  );

  applyTheme(theme);

  document
    .getElementById("themeMenu")
    .classList.remove("show");
}

applyTheme(
  localStorage.getItem(THEME_KEY) ||
  "system"
);

document
  .getElementById("themeBtn")
  .addEventListener(
    "click",
    function(e){

      e.stopPropagation();

      document
        .getElementById("themeMenu")
        .classList.toggle("show");

    }
  );

document
  .querySelectorAll(".theme-option")
  .forEach(function(button){

    button.addEventListener(
      "click",
      function(){

        setTheme(
          this.dataset.theme
        );

      }
    );

  });

document.addEventListener(
  "click",
  function(e){

    if(
      !e.target.closest(".theme-wrap")
    ){

      document
        .getElementById("themeMenu")
        .classList.remove("show");

    }

  }
);

window
  .matchMedia(
    "(prefers-color-scheme: dark)"
  )
  .addEventListener(
    "change",
    function(){

      const theme =
        localStorage.getItem(
          THEME_KEY
        ) || "system";

      if(theme === "system"){

        applyTheme("system");

      }

    }
  );

/* =========================================================
   SIDE MENU
========================================================= */

const menuBtn =
  document.getElementById("menuBtn");

const sideMenu =
  document.getElementById("sideMenu");

const menuOverlay =
  document.getElementById("menuOverlay");

function openMenu(){

  sideMenu.classList.add("open");

  menuOverlay.classList.add("show");

}

function closeMenu(){

  sideMenu.classList.remove("open");

  menuOverlay.classList.remove("show");

}

menuBtn.addEventListener(
  "click",
  openMenu
);

menuOverlay.addEventListener(
  "click",
  closeMenu
);

/* =========================================================
   HELPERS
========================================================= */

function showMessage(
  element,
  text,
  type
){

  element.textContent =
    text;

  element.className =
    "message show " + type;

}

function clearMessage(
  element
){

  element.textContent =
    "";

  element.className =
    "message";

}

/* =========================================================
   LOAD USER
========================================================= */

async function loadUser(){

  const {
    data,
    error
  } = await db.auth.getSession();

  if(error){

    console.error(error);

    location.href =
      "login.html";

    return;
  }

  if(!data.session){

    location.href =
      "login.html";

    return;
  }

  currentUser =
    data.session.user;

  document
    .getElementById("email")
    .value =
    currentUser.email || "";

  document
    .getElementById("profileEmail")
    .textContent =
    currentUser.email || "";

  await loadProfile();

}

/* =========================================================
   LOAD PROFILE
========================================================= */

async function loadProfile(){

  const {
    data,
    error
  } = await db
    .from("profiles")
    .select(
      "full_name,country"
    )
    .eq(
      "id",
      currentUser.id
    )
    .maybeSingle();

  if(error){

    console.error(error);

    updateProfileHeader(
      currentUser.user_metadata?.full_name ||
      ""
    );

    return;
  }

  const fullName =
    data?.full_name ||
    currentUser.user_metadata?.full_name ||
    "";

  const country =
    data?.country ||
    currentUser.user_metadata?.country ||
    "";

  document
    .getElementById("fullName")
    .value =
    fullName;

  document
    .getElementById("country")
    .value =
    country;

  updateProfileHeader(
    fullName
  );

}

/* =========================================================
   PROFILE HEADER
========================================================= */

function updateProfileHeader(name){

  const displayName =
    name ||
    "TallyBuck User";

  document
    .getElementById("profileName")
    .textContent =
    displayName;

  const firstLetter =
    displayName
      .trim()
      .charAt(0)
      .toUpperCase() ||
    "T";

  document
    .getElementById("avatar")
    .textContent =
    firstLetter;

}

/* =========================================================
   SAVE PROFILE
========================================================= */

document
  .getElementById("saveProfile")
  .addEventListener(
    "click",
    async function(){

      const button =
        this;

      const message =
        document.getElementById(
          "profileMessage"
        );

      clearMessage(
        message
      );

      const fullName =
        document
          .getElementById("fullName")
          .value
          .trim();

      const country =
        document
          .getElementById("country")
          .value;

      if(!fullName){

        showMessage(
          message,
          "Please enter your full name.",
          "error"
        );

        return;
      }

      button.disabled =
        true;

      button.textContent =
        "Saving...";

      try{

        const {
          error
        } = await db
          .from("profiles")
          .update({

            full_name:
              fullName,

            country:
              country ||
              null

          })
          .eq(
            "id",
            currentUser.id
          );

        if(error){

          throw error;

        }

        updateProfileHeader(
          fullName
        );

        showMessage(
          message,
          "Profile updated successfully.",
          "success"
        );

      }catch(error){

        console.error(
          error
        );

        showMessage(
          message,
          error.message ||
          "Unable to update your profile.",
          "error"
        );

      }finally{

        button.disabled =
          false;

        button.textContent =
          "Save changes";

      }

    }
  );

/* =========================================================
   CHANGE PASSWORD
========================================================= */

document
  .getElementById("changePassword")
  .addEventListener(
    "click",
    async function(){

      const button =
        this;

      const message =
        document.getElementById(
          "passwordMessage"
        );

      clearMessage(
        message
      );

      const newPassword =
        document
          .getElementById("newPassword")
          .value;

      const confirmPassword =
        document
          .getElementById("confirmPassword")
          .value;

      if(
        newPassword.length < 6
      ){

        showMessage(
          message,
          "Password must be at least 6 characters.",
          "error"
        );

        return;
      }

      if(
        newPassword !==
        confirmPassword
      ){

        showMessage(
          message,
          "Passwords do not match.",
          "error"
        );

        return;
      }

      button.disabled =
        true;

      button.textContent =
        "Updating...";

      try{

        const {
          error
        } = await db.auth.updateUser({

          password:
            newPassword

        });

        if(error){

          throw error;

        }

        document
          .getElementById(
            "newPassword"
          )
          .value = "";

        document
          .getElementById(
            "confirmPassword"
          )
          .value = "";

        showMessage(
          message,
          "Password updated successfully.",
          "success"
        );

      }catch(error){

        console.error(
          error
        );

        showMessage(
          message,
          error.message ||
          "Unable to update your password.",
          "error"
        );

      }finally{

        button.disabled =
          false;

        button.textContent =
          "Update password";

      }

    }
  );

/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

  try{

    const {
      error
    } =
      await db.auth.signOut();

    if(error){

      throw error;

    }

    location.href =
      "login.html";

  }catch(error){

    console.error(
      error
    );

    alert(
      error.message ||
      "Unable to log out."
    );

  }

}

document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    logout
  );

document
  .getElementById("logoutMain")
  .addEventListener(
    "click",
    logout
  );

/* =========================================================
   START
========================================================= */

loadUser();

</script>
