<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>TallyBuck — Profile</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#f5faf7;
  --card:#ffffff;
  --text:#15231d;
  --muted:#718078;
  --border:#e3ebe7;
  --green:#079447;
  --darkgreen:#063f2d;
  --lightgreen:#e9f8ef;
  --danger:#d64545;
  --shadow:0 4px 18px rgba(6,63,45,.07);
}

html.dark{
  --bg:#06130d;
  --card:#0b2117;
  --text:#effaf4;
  --muted:#91aa9e;
  --border:#1b3a2c;
  --green:#59e696;
  --darkgreen:#052d20;
  --lightgreen:#123a29;
  --danger:#ff7272;
  --shadow:0 5px 20px rgba(0,0,0,.28);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:86px;
}

body.menu-open{
  overflow:hidden;
}

button,
input,
select{
  font:inherit;
}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

button{
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}

/* =========================
   APP
========================= */

.app{
  width:100%;
  max-width:760px;
  min-height:100vh;
  margin:0 auto;
  background:var(--bg);
  position:relative;
}

/* =========================
   HEADER
========================= */

.header{
  height:68px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:sticky;
  top:0;
  z-index:100;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  font-size:19px;
}

.logo{
  width:38px;
  height:38px;
  border-radius:11px;
  background:var(--green);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  font-weight:900;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.icon-btn{
  width:42px;
  height:42px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  position:relative;
}

.icon-btn:hover{
  background:var(--lightgreen);
}

.icon{
  width:20px;
  height:20px;
  display:block;
  fill:none;
  stroke:currentColor;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.notification-count{
  position:absolute;
  top:-4px;
  right:-4px;
  min-width:18px;
  height:18px;
  padding:0 5px;
  border-radius:20px;
  background:var(--danger);
  color:#fff;
  font-size:10px;
  font-weight:800;
  display:none;
  align-items:center;
  justify-content:center;
  border:2px solid var(--card);
}

/* =========================
   MENU OVERLAY
========================= */

.menu-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.38);
  opacity:0;
  visibility:hidden;
  transition:.22s ease;
  z-index:190;
}

.menu-overlay.show{
  opacity:1;
  visibility:visible;
}

/* =========================
   RIGHT SIDE MENU
========================= */

.side-menu{
  position:fixed;
  top:0;
  right:0;
  width:min(310px,86vw);
  height:100vh;
  background:var(--card);
  border-left:1px solid var(--border);
  padding:20px 14px;
  z-index:200;
  overflow-y:auto;
  transform:translateX(105%);
  transition:transform .24s ease;
  box-shadow:-10px 0 30px rgba(0,0,0,.12);
}

.side-menu.open{
  transform:translateX(0);
}

.menu-head{
  height:48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 4px 0 10px;
  margin-bottom:8px;
}

.menu-title{
  font-size:11px;
  font-weight:800;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.08em;
}

.close-menu{
  width:38px;
  height:38px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.close-menu svg{
  width:18px;
  height:18px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.menu-link{
  width:100%;
  display:flex;
  align-items:center;
  gap:13px;
  padding:13px 14px;
  border-radius:12px;
  margin-bottom:4px;
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:14px;
  font-weight:700;
  text-align:left;
}

.menu-link:hover,
.menu-link.active{
  background:var(--lightgreen);
  color:var(--green);
}

.menu-icon{
  width:21px;
  height:21px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 21px;
}

.menu-icon svg{
  width:18px;
  height:18px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.menu-divider{
  height:1px;
  background:var(--border);
  margin:12px 10px;
}

/* =========================
   MAIN
========================= */

.main{
  padding:24px 18px 30px;
}

.page-title{
  font-size:25px;
  font-weight:850;
  margin-bottom:6px;
}

.page-subtitle{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
  margin-bottom:20px;
}

/* =========================
   PROFILE HEADER
========================= */

.profile-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:19px;
  box-shadow:var(--shadow);
  margin-bottom:14px;
}

.profile-top{
  display:flex;
  align-items:center;
  gap:14px;
}

.avatar{
  width:58px;
  height:58px;
  border-radius:16px;
  background:var(--lightgreen);
  color:var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:800;
  flex:none;
}

.profile-name{
  font-size:18px;
  font-weight:800;
  margin-bottom:4px;
}

.profile-email{
  color:var(--muted);
  font-size:12px;
  word-break:break-word;
}

/* =========================
   CARDS
========================= */

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:17px;
  box-shadow:var(--shadow);
  margin-bottom:14px;
}

.card-title{
  font-size:15px;
  font-weight:800;
  margin-bottom:16px;
}

.form-group{
  margin-bottom:14px;
}

.form-group:last-child{
  margin-bottom:0;
}

label{
  display:block;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  margin-bottom:7px;
}

input,
select{
  width:100%;
  height:45px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--bg);
  color:var(--text);
  padding:0 12px;
  outline:none;
}

input:focus,
select:focus{
  border-color:var(--green);
}

input:disabled{
  opacity:.65;
  cursor:not-allowed;
}

.save-btn{
  width:100%;
  height:45px;
  border:0;
  border-radius:11px;
  background:var(--green);
  color:#fff;
  font-weight:800;
  margin-top:4px;
}

.save-btn:hover{
  opacity:.92;
}

.save-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

/* =========================
   PASSWORD
========================= */

.password-note{
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
  margin-bottom:14px;
}

/* =========================
   MESSAGES
========================= */

.message{
  display:none;
  padding:11px 12px;
  border-radius:10px;
  font-size:12px;
  line-height:1.4;
  margin-bottom:14px;
}

.message.show{
  display:block;
}

.message.success{
  background:var(--lightgreen);
  color:var(--green);
}

.message.error{
  background:#fdeaea;
  color:var(--danger);
}

html.dark .message.error{
  background:#3a1717;
}

/* =========================
   LOGOUT
========================= */

.logout-btn{
  width:100%;
  height:45px;
  border:1px solid var(--danger);
  border-radius:11px;
  background:transparent;
  color:var(--danger);
  font-weight:800;
}

.logout-btn:hover{
  background:#fdeaea;
}

html.dark .logout-btn:hover{
  background:#3a1717;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  display:flex;
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(760px,100%);
  height:73px;
  background:var(--card);
  border-top:1px solid var(--border);
  z-index:100;
  padding:6px 5px;
}

.bottom-link{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  color:var(--muted);
  font-size:10px;
  font-weight:700;
  border-radius:10px;
}

.bottom-link.active{
  color:var(--green);
  background:var(--lightgreen);
}

.bottom-icon{
  width:20px;
  height:20px;
}

.bottom-icon svg{
  width:19px;
  height:19px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:88px;
  transform:translateX(-50%) translateY(20px);
  background:var(--darkgreen);
  color:#fff;
  padding:12px 17px;
  border-radius:12px;
  font-size:13px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:300;
  max-width:calc(100vw - 30px);
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* =========================
   DESKTOP
========================= */

@media(min-width:761px){

  body{
    padding-bottom:0;
  }

  .bottom-nav{
    display:none;
  }

  .main{
    padding-bottom:40px;
  }
}

/* =========================
   MOBILE
========================= */

@media(max-width:760px){

  .header{
    padding:0 14px;
  }

  .main{
    padding:20px 15px 20px;
  }

  .page-title{
    font-size:22px;
  }

  .page-subtitle{
    font-size:12.5px;
  }
}
</style>

/* =========================

========================= */

function showToast(message){

  const toast =
    $("toast");

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  setTimeout(
    ()=>{
      toast.classList.remove(
        "show"
      );
    },
    2500
  );
}


/* =========================
   THEME
========================= */

function applyTheme(){

  const saved =
    localStorage.getItem(
      "tallybuck-theme"
    ) || "system";


  if(saved === "dark"){

    document.documentElement
      .classList.add("dark");

  }else if(saved === "light"){

    document.documentElement
      .classList.remove("dark");

  }else{

    const dark =
      window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches;


    document.documentElement
      .classList.toggle(
        "dark",
        dark
      );
  }


  updateThemeLabel();
}


function updateThemeLabel(){

  const saved =
    localStorage.getItem(
      "tallybuck-theme"
    ) || "system";


  const label =
    $("themeLabel");


  if(!label){
    return;
  }


  label.textContent =
    saved === "dark"
      ? "Theme: Dark"
      : saved === "light"
      ? "Theme: Light"
      : "Theme: System";
}


applyTheme();


$("themeMenuBtn").addEventListener(
  "click",
  ()=>{

    const current =
      localStorage.getItem(
        "tallybuck-theme"
      ) || "system";


    const next =
      current === "system"
        ? "light"
        : current === "light"
        ? "dark"
        : "system";


    localStorage.setItem(
      "tallybuck-theme",
      next
    );


    applyTheme();


    showToast(
      next === "system"
        ? "Theme: System"
        : next === "light"
        ? "Theme: Light"
        : "Theme: Dark"
    );
  }
);


/* =========================
   SYSTEM THEME
========================= */

const mediaQuery =
  window.matchMedia(
    "(prefers-color-scheme: dark)"
  );


if(mediaQuery.addEventListener){

  mediaQuery.addEventListener(
    "change",
    ()=>{

      const saved =
        localStorage.getItem(
          "tallybuck-theme"
        ) || "system";


      if(saved === "system"){
        applyTheme();
      }

    }
  );

}


/* =========================
   SIDE MENU
========================= */

const sideMenu =
  $("sideMenu");

const menuOverlay =
  $("menuOverlay");


function openMenu(){

  sideMenu.classList.add(
    "open"
  );

  menuOverlay.classList.add(
    "show"
  );

  document.body.classList.add(
    "menu-open"
  );
}


function closeMenu(){

  sideMenu.classList.remove(
    "open"
  );

  menuOverlay.classList.remove(
    "show"
  );

  document.body.classList.remove(
    "menu-open"
  );
}


$("menuBtn").addEventListener(
  "click",
  openMenu
);


$("closeMenuBtn").addEventListener(
  "click",
  closeMenu
);


menuOverlay.addEventListener(
  "click",
  closeMenu
);


/* =========================
   MESSAGES
========================= */

function showMessage(
  element,
  text,
  type
){

  element.textContent =
    text;

  element.className =
    "message show " +
    type;
}


function clearMessage(
  element
){

  element.textContent =
    "";

  element.className =
    "message";
}


/* =========================
   LOAD USER
========================= */

async function loadUser(){

  const {
    data,
    error
  } =
    await db.auth.getSession();


  if(error){

    console.error(error);

    window.location.href =
      "login.html";

    return;
  }


  if(!data.session){

    window.location.href =
      "login.html";

    return;
  }


  currentUser =
    data.session.user;


  $("email").value =
    currentUser.email || "";


  $("profileEmail").textContent =
    currentUser.email || "";


  await loadProfile();

}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(){

  const {
    data,
    error
  } =
    await db
      .from("profiles")
      .select(
        "full_name,country"
      )
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();


  if(error){

    console.error(error);


    const fallbackName =
      currentUser.user_metadata?.full_name ||
      "";


    updateProfileHeader(
      fallbackName
    );


    return;
  }


  const fullName =
    data?.full_name ||
    currentUser.user_metadata?.full_name ||
    "";


  const country =
    data?.country ||
    currentUser.user_metadata?.country ||
    "";


  $("fullName").value =
    fullName;


  $("country").value =
    country;


  updateProfileHeader(
    fullName
  );
}


/* =========================
   PROFILE HEADER
========================= */

function updateProfileHeader(
  name
){

  const displayName =
    name ||
    "TallyBuck User";


  $("profileName").textContent =
    displayName;


  const firstLetter =
    displayName
      .trim()
      .charAt(0)
      .toUpperCase() ||
    "T";


  $("avatar").textContent =
    firstLetter;
}


/* =========================
   UNREAD NOTIFICATION COUNT
========================= */

async function loadNotificationCount(){

  if(!currentUser){
    return;
  }


  const {
    count,
    error
  } =
    await db
      .from("notifications")
      .select(
        "id",
        {
          count:"exact",
          head:true
        }
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .eq(
        "is_read",
        false
      );


  if(error){

    console.error(
      error
    );

    return;
  }


  const badge =
    $("headerNotificationCount");


  if(count > 0){

    badge.textContent =
      count > 99
        ? "99+"
        : count;


    badge.style.display =
      "flex";

  }else{

    badge.style.display =
      "none";
  }
}


/* =========================
   SAVE PROFILE
========================= */

$("saveProfile").addEventListener(
  "click",
  async function(){

    const button =
      this;


    const message =
      $("profileMessage");


    clearMessage(
      message
    );


    const fullName =
      $("fullName")
        .value
        .trim();


    const country =
      $("country")
        .value;


    if(!fullName){

      showMessage(
        message,
        "Please enter your full name.",
        "error"
      );

      return;
    }


    button.disabled =
      true;


    button.textContent =
      "Saving...";


    try{

      const {
        error
      } =
        await db
          .from("profiles")
          .update({
            full_name:
              fullName,
            country:
              country || null
          })
          .eq(
            "id",
            currentUser.id
          );


      if(error){
        throw error;
      }


      updateProfileHeader(
        fullName
      );


      showMessage(
        message,
        "Profile updated successfully.",
        "success"
      );


      showToast(
        "Profile updated"
      );

    }catch(error){

      console.error(
        error
      );


      showMessage(
        message,
        error.message ||
        "Unable to update your profile.",
        "error"
      );

    }finally{

      button.disabled =
        false;


      button.textContent =
        "Save changes";
    }

  }
);


/* =========================
   CHANGE PASSWORD
========================= */

$("changePassword").addEventListener(
  "click",
  async function(){

    const button =
      this;


    const message =
      $("passwordMessage");


    clearMessage(
      message
    );


    const newPassword =
      $("newPassword")
        .value;


    const confirmPassword =
      $("confirmPassword")
        .value;


    if(
      newPassword.length < 6
    ){

      showMessage(
        message,
        "Password must be at least 6 characters.",
        "error"
      );

      return;
    }


    if(
      newPassword !==
      confirmPassword
    ){

      showMessage(
        message,
        "Passwords do not match.",
        "error"
      );

      return;
    }


    button.disabled =
      true;


    button.textContent =
      "Updating...";


    try{

      const {
        error
      } =
        await db.auth.updateUser({
          password:
            newPassword
        });


      if(error){
        throw error;
      }


      $("newPassword").value =
        "";

      $("confirmPassword").value =
        "";


      showMessage(
        message,
        "Password updated successfully.",
        "success"
      );


      showToast(
        "Password updated"
      );

    }catch(error){

      console.error(
        error
      );


      showMessage(
        message,
        error.message ||
        "Unable to update your password.",
        "error"
      );

    }finally{

      button.disabled =
        false;


      button.textContent =
        "Update password";
    }

  }
);


/* =========================
   LOGOUT
========================= */

async function logout(){

  const {
    error
  } =
    await db.auth.signOut();


  if(error){

    console.error(
      error
    );


    showToast(
      "Unable to sign out"
    );


    return;
  }


  window.location.href =
    "login.html";
}


$("logoutBtn").addEventListener(
  "click",
  event => {

    event.preventDefault();

    logout();

  }
);


$("logoutMain").addEventListener(
  "click",
  logout
);

$("notificationBtn").addEventListener(

);
