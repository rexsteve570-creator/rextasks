<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RexTasks - Surveys</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#03150f;
  --card:#08251c;
  --card2:#0a2b21;
  --border:#123d30;
  --green:#35e69d;
  --green2:#20c982;
  --white:#f4faf7;
  --muted:#8ea79e;
}

body{
  background:var(--bg);
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  padding-bottom:88px;
}

/* HEADER */

.header{
  height:78px;
  background:#061d15;
  border-bottom:1px solid #12372c;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:sticky;
  top:0;
  z-index:20;
}

.menu{
  width:38px;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
}

.menu svg{
  width:29px;
  height:29px;
}

.logo{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:25px;
  font-weight:800;
  margin-right:auto;
  margin-left:25px;
}

.logo-r{
  color:var(--green);
  font-size:43px;
  line-height:1;
  font-weight:900;
}

.logo-text{
  color:#f3f8f6;
}

.header-right{
  display:flex;
  align-items:center;
  gap:13px;
}

.notification{
  position:relative;
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.notification svg{
  width:28px;
  height:28px;
}

.notification-dot{
  position:absolute;
  width:7px;
  height:7px;
  background:#1fd184;
  border-radius:50%;
  top:5px;
  right:6px;
}

.theme{
  width:58px;
  height:45px;
  border:1px solid #153f32;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--green);
}

.theme svg{
  width:22px;
}

/* PAGE */

.container{
  padding:28px 18px 30px;
  max-width:1000px;
  margin:auto;
}

.title{
  font-size:34px;
  line-height:1.1;
  font-weight:800;
  margin-bottom:8px;
}

.subtitle{
  color:var(--muted);
  font-size:16px;
  margin-bottom:25px;
}

/* LOCATION */

.location-box{
  background:#062219;
  border:1px solid #154638;
  border-radius:18px;
  padding:17px;
  margin-bottom:25px;
  min-height:68px;
  display:flex;
  align-items:center;
  gap:13px;
}

.location-icon{
  width:38px;
  height:38px;
  color:var(--green);
  flex:none;
}

.location-content{
  font-size:15px;
}

.location-status{
  color:#b6cbc4;
  line-height:1.5;
}

.country{
  color:var(--green);
  font-weight:800;
}

/* LOADING */

.loading{
  display:flex;
  align-items:center;
  gap:9px;
}

.spinner{
  width:19px;
  height:19px;
  border:2px solid #245647;
  border-top-color:var(--green);
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* TASKS */

.task-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:17px;
}

.task-card{
  background:linear-gradient(
    145deg,
    #09291f,
    #061e17
  );
  border:1px solid #16483a;
  border-radius:22px;
  padding:19px;
  min-height:350px;
  display:flex;
  flex-direction:column;
}

.task-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.task-category{
  display:flex;
  align-items:center;
  gap:10px;
}

.task-icon{
  width:58px;
  height:58px;
  border-radius:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
}

.task-icon svg{
  width:30px;
  height:30px;
}

.app{
  background:#119d78;
}

.survey{
  background:#3978d8;
}

.signup{
  background:#dc8b18;
}

.offer{
  background:#7d48d2;
}

.daily{
  background:#159e72;
}

.task{
  background:#168d9b;
}

.referral{
  background:#bc3c92;
}

.badge{
  border-radius:30px;
  padding:8px 12px;
  font-size:11px;
  font-weight:800;
  margin-top:9px;
}

.badge-app{
  background:#0e6e59;
  color:#b8ffe7;
}

.badge-survey{
  background:#214d8e;
  color:#c9ddff;
}

.badge-signup{
  background:#87520e;
  color:#ffe0a4;
}

.badge-offer{
  background:#56309a;
  color:#e2cfff;
}

.badge-daily{
  background:#12694f;
  color:#b9ffe5;
}

.badge-task{
  background:#145e68;
  color:#b7f4f6;
}

.badge-referral{
  background:#74275b;
  color:#ffc9ec;
}

.more{
  color:#dce9e5;
  width:28px;
  height:35px;
}

.more svg{
  width:23px;
}

.task-title{
  font-size:22px;
  line-height:1.25;
  margin-top:23px;
  font-weight:800;
}

.task-description{
  color:#9db5ae;
  font-size:15px;
  line-height:1.55;
  margin-top:11px;
}

.task-bottom{
  margin-top:auto;
  padding-top:23px;
}

.reward{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--green);
  font-size:25px;
  font-weight:900;
  margin-bottom:18px;
}

.money{
  width:38px;
  height:38px;
  border-radius:50%;
  background:var(--green);
  color:#052017;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:900;
}

.start{
  width:100%;
  border:none;
  border-radius:14px;
  padding:16px;
  background:linear-gradient(
    135deg,
    #32e29b,
    #18c981
  );
  color:#032017;
  font-size:17px;
  font-weight:900;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:55px 20px;
  color:var(--muted);
  line-height:1.6;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:82px;
  background:#061d15;
  border-top:1px solid #12372c;
  display:flex;
  align-items:center;
  justify-content:space-around;
  z-index:30;
}

.nav-item{
  text-decoration:none;
  color:#7e968f;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  font-size:11px;
  font-weight:700;
  min-width:58px;
}

.nav-item svg{
  width:25px;
  height:25px;
}

.nav-item.active{
  color:var(--green);
}

.nav-line{
  position:absolute;
  bottom:10px;
  width:32px;
  height:3px;
  border-radius:5px;
  background:var(--green);
}

/* DESKTOP */

@media(min-width:700px){

  .task-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .container{
    padding-top:42px;
  }

  .title{
    font-size:42px;
  }

}

/* SMALL PHONES */

@media(max-width:380px){

  .logo{
    margin-left:12px;
    font-size:22px;
  }

  .logo-r{
    font-size:37px;
  }

  .theme{
    display:none;
  }

  .title{
    font-size:30px;
  }
}
</style>
</head>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://cetsxdkoauucxwsbdktl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_crwxMSen3GDl9BQZfy_QLg_o_uicRCD";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   SESSION
========================= */

async function checkSession(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getSession();

  if(error || !data.session){

    window.location.href =
      "login.html";

    return null;
  }

  return data.session.user;
}


/* =========================
   COUNTRY DETECTION
========================= */

async function detectCountry(){

  /* FIRST SERVICE */

  try{

    const response =
      await fetch(
        "https://ipapi.co/json/",
        {
          cache:"no-store"
        }
      );

    if(response.ok){

      const data =
        await response.json();

      if(data && data.country_name){

        return data.country_name.trim();

      }

    }

  }catch(error){

    console.log(
      "Primary location service failed."
    );

  }


  /* FALLBACK SERVICE */

  try{

    const response =
      await fetch(
        "https://ipwho.is/",
        {
          cache:"no-store"
        }
      );

    if(response.ok){

      const data =
        await response.json();

      if(
        data &&
        data.success &&
        data.country
      ){

        return data.country.trim();

      }

    }

  }catch(error){

    console.log(
      "Fallback location service failed."
    );

  }


  throw new Error(
    "Unable to detect country."
  );
}


/* =========================
   SHOW COUNTRY
========================= */

function showCountry(country){

  document.getElementById(
    "locationContent"
  ).innerHTML = `

    <div class="location-status">
      Your location:
      <span class="country">
        ${escapeHTML(country)}
      </span>
    </div>

  `;

}


/* =========================
   LOAD TASKS
========================= */

async function loadTasks(country){

  const grid =
    document.getElementById(
      "taskGrid"
    );


  const {
    data:tasks,
    error
  } =
  await supabaseClient
    .from("tasks")
    .select(`
      id,
      title,
      description,
      category,
      country,
      payout,
      user_reward_percent,
      task_url,
      proof_required,
      max_completions,
      status,
      created_at
    `)
    .eq(
      "status",
      "active"
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    console.error(error);

    showEmpty(
      "Tasks could not be loaded right now."
    );

    return;

  }


  const detected =
    country
      .trim()
      .toLowerCase();


  const available =
    (tasks || []).filter(task => {

      const target =
        String(
          task.country ||
          "Worldwide"
        )
        .trim()
        .toLowerCase();


      return (
        target === "worldwide" ||
        target === detected
      );

    });


  if(!available.length){

    showEmpty(
      "No tasks are available for your location right now."
    );

    return;

  }


  grid.innerHTML = "";


  available.forEach(task => {

    const reward =
      Number(task.payout || 0) *
      Number(
        task.user_reward_percent || 0
      ) /
      100;


    const category =
      getCategory(
        task.category
      );


    const card =
      document.createElement(
        "article"
      );

    card.className =
      "task-card";


    card.innerHTML = `

      <div class="task-top">

        <div class="task-category">

          <div class="
            task-icon
            ${category.iconClass}
          ">

            ${category.icon}

          </div>

          <div class="
            badge
            ${category.badgeClass}
          ">

            ${category.label}

          </div>

        </div>


        <div class="more">

          <svg viewBox="0 0 24 24"
               fill="currentColor">

            <circle cx="12"
                    cy="5"
                    r="1.6"/>

            <circle cx="12"
                    cy="12"
                    r="1.6"/>

            <circle cx="12"
                    cy="19"
                    r="1.6"/>

          </svg>

        </div>

      </div>


      <h2 class="task-title">
        ${escapeHTML(task.title)}
      </h2>


      <p class="task-description">
        ${escapeHTML(
          task.description ||
          "Complete this task and earn your reward."
        )}
      </p>


      <div class="task-bottom">

        <div class="reward">

          <span class="money">$</span>

          $${reward.toFixed(2)}

        </div>


        <button
          class="start"
          onclick="startTask(${Number(task.id)})"
        >
          Start Task
        </button>

      </div>

    `;


    grid.appendChild(card);

  });

}


/* =========================
   START TASK
========================= */

function startTask(taskId){

  window.location.href =
    "submit-task.html?task=" +
    encodeURIComponent(taskId);

}


/* =========================
   EMPTY STATE
========================= */

function showEmpty(message){

  document.getElementById(
    "taskGrid"
  ).innerHTML = `

    <div class="empty">

      ${escapeHTML(message)}

    </div>

  `;

}


/* =========================
   CATEGORY
========================= */

function getCategory(value){

  const c =
    String(value || "")
    .toLowerCase();


  if(c.includes("survey")){

    return {
      label:"SURVEY",
      iconClass:"survey",
      badgeClass:"badge-survey",
      icon:`
        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2">

          <rect x="5"
                y="3"
                width="14"
                height="18"
                rx="2"/>

          <path d="M9 7h6"/>
          <path d="M9 11h6"/>
          <path d="M9 15h3"/>

        </svg>
      `
    };

  }


  if(
    c.includes("sign") ||
    c.includes("signup") ||
    c.includes("register")
  ){

    return {
      label:"SIGN UP",
      iconClass:"signup",
      badgeClass:"badge-signup",
      icon:`
        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2">

          <circle cx="9"
                  cy="8"
                  r="3"/>

          <path d="M3 20c0-3.5 2.5-6 6-6s6 2.5 6 6"/>

          <path d="M18 12v6"/>
          <path d="M15 15h6"/>

        </svg>
      `
    };

  }


  if(c.includes("offer")){

    return {
      label:"OFFER",
      iconClass:"offer",
      badgeClass:"badge-offer",
      icon:`
        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2">

          <path d="M3 8h18v5H3z"/>
          <path d="M12 8v12"/>
          <path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>

        </svg>
      `
    };

  }


  if(c.includes("daily")){

    return {
      label:"DAILY",
      iconClass:"daily",
      badgeClass:"badge-daily",
      icon:`
        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2">

          <rect x="4"
                y="5"
                width="16"
                height="15"
                rx="2"/>

          <path d="M8 3v4"/>
          <path d="M16 3v4"/>
          <path d="M4 9h16"/>

        </svg>
      `
    };

  }


  if(c.includes("referral")){

    return {
      label:"REFERRAL",
      iconClass:"referral",
      badgeClass:"badge-referral",
      icon:`
        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2">

          <circle cx="9"
                  cy="8"
                  r="3"/>

          <circle cx="17"
                  cy="9"
                  r="2.5"/>

          <path d="M3 20c0-3.2 2.6-5 6-5s6 1.8 6 5"/>

          <path d="M15 15c3 0 5 1.6 5 4"/>

        </svg>
      `
    };

  }


  if(
    c.includes("app") ||
    c.includes("install")
  ){

    return {
      label:"APP",
      iconClass:"app",
      badgeClass:"badge-app",
      icon:`
        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2">

          <rect x="6"
                y="3"
                width="12"
                height="18"
                rx="2"/>

          <path d="M9 6h6"/>
          <path d="M10 18h4"/>

        </svg>
      `
    };

  }


  return {
    label:"TASK",
    iconClass:"task",
    badgeClass:"badge-task",
    icon:`
      <svg viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="2">

        <rect x="5"
              y="3"
              width="14"
              height="18"
              rx="2"/>

        <path d="M9 8h6"/>
        <path d="M9 12h6"/>
        <path d="M9 16h3"/>

      </svg>
    `
  };

}


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

(async function(){

  const user =
    await checkSession();

  if(!user){
    return;
  }


  try{

    const country =
      await detectCountry();


    showCountry(country);


    await loadTasks(country);


  }catch(error){

    console.error(
      "Country detection error:",
      error
    );


    document.getElementById(
      "locationContent"
    ).innerHTML = `

      <div class="location-status">
        Unable to detect your country.
        Please refresh and try again.
