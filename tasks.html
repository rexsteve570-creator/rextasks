<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RexTasks — Tasks</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#07140f;
  color:#fff;
  min-height:100vh;
}

header{
  padding:18px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #17352a;
  background:#091b14;
}

.logo{
  font-size:22px;
  font-weight:800;
  color:#72e6a3;
}

.back{
  color:#9ee9bd;
  text-decoration:none;
  font-size:14px;
}

.container{
  max-width:700px;
  margin:auto;
  padding:24px 16px 40px;
}

h1{
  font-size:28px;
  margin-bottom:8px;
}

.subtitle{
  color:#9bb8aa;
  font-size:14px;
  margin-bottom:24px;
}

.task-list{
  display:grid;
  gap:15px;
}

.task{
  background:#0d2119;
  border:1px solid #1d4936;
  border-radius:18px;
  padding:18px;
}

.task-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  margin-bottom:12px;
}

.task-title{
  font-size:18px;
  font-weight:700;
  line-height:1.3;
}

.reward{
  color:#72e6a3;
  font-weight:800;
  white-space:nowrap;
  font-size:17px;
}

.description{
  color:#aac1b5;
  font-size:14px;
  line-height:1.6;
  margin-bottom:17px;
}

.task-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.country{
  font-size:12px;
  color:#829f91;
}

.open-btn{
  border:0;
  background:#62d994;
  color:#06130d;
  font-weight:800;
  padding:11px 17px;
  border-radius:10px;
  cursor:pointer;
}

.empty{
  text-align:center;
  padding:45px 20px;
  background:#0d2119;
  border:1px solid #1d4936;
  border-radius:18px;
  color:#9bb8aa;
}

.loading{
  text-align:center;
  padding:40px;
  color:#9bb8aa;
}

.error{
  background:#351717;
  border:1px solid #713131;
  color:#ffb1b1;
  padding:16px;
  border-radius:12px;
  font-size:14px;
  line-height:1.5;
}

@media(max-width:500px){

  h1{
    font-size:25px;
  }

  .task-top{
    gap:10px;
  }

  .task-title{
    font-size:16px;
  }

  .reward{
    font-size:15px;
  }

  .open-btn{
    padding:10px 14px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    RexTasks
  </div>

  <a href="dashboard.html" class="back">
    ← Dashboard
  </a>

</header>


<main class="container">

  <h1>Available Tasks</h1>

  <p class="subtitle">
    Complete tasks and earn rewards.
  </p>

  <div id="taskList" class="loading">
    Loading tasks...
  </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://cetsxdkoauucxwsbdktl.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_crwxMSen3GDl9BQZfy_QLg_o_uicRCD";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const taskList =
document.getElementById("taskList");


async function loadTasks(){

  try{

    /* CHECK LOGIN */

    const {
      data: sessionData,
      error: sessionError
    } =
    await supabaseClient.auth.getSession();


    if(sessionError){

      console.error(sessionError);

      showError(
        "Unable to check your account session."
      );

      return;
    }


    if(!sessionData.session){

      window.location.href =
        "login.html";

      return;
    }


    /*
      LOAD ACTIVE TASKS

      We intentionally query ONLY the tasks
      table for now.
    */

    const {
      data: tasks,
      error: tasksError
    } =
    await supabaseClient
      .from("tasks")
      .select(
        "id,title,description,category,country,payout,user_reward_percent,task_url,proof_required,max_completions,status,created_at"
      )
      .eq("status","active")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


    if(tasksError){

      console.error(
        "TASK DATABASE ERROR:",
        tasksError
      );

      showError(
        "We couldn't load the available tasks. Please try again."
      );

      return;
    }


    if(!tasks || tasks.length === 0){

      taskList.innerHTML = `
        <div class="empty">
          No tasks are available right now.
          Please check again later.
        </div>
      `;

      return;
    }


    /*
      DISPLAY TASKS

      IMPORTANT:
      payout = CPA payout

      user_reward_percent =
      percentage paid to user

      Example:

      payout = $1.00
      user_reward_percent = 20%

      user sees $0.20
    */

    taskList.innerHTML = "";


    tasks.forEach(task => {

      const cpaPayout =
        Number(task.payout || 0);

      const rewardPercent =
        Number(
          task.user_reward_percent || 0
        );

      const userReward =
        cpaPayout *
        rewardPercent /
        100;


      const card =
      document.createElement("div");

      card.className =
        "task";


      const top =
      document.createElement("div");

      top.className =
        "task-top";


      const title =
      document.createElement("div");

      title.className =
        "task-title";

      title.textContent =
        task.title || "Available Task";


      const reward =
      document.createElement("div");

      reward.className =
        "reward";

      reward.textContent =
        "Earn $" +
        userReward.toFixed(2);


      top.appendChild(title);
      top.appendChild(reward);


      const description =
      document.createElement("div");

      description.className =
        "description";

      description.textContent =
        task.description ||
        "Complete this task and submit your proof.";


      const footer =
      document.createElement("div");

      footer.className =
        "task-footer";


      const country =
      document.createElement("div");

      country.className =
        "country";

      country.textContent =
        task.country || "Worldwide";


      const button =
      document.createElement("button");

      button.className =
        "open-btn";

      button.textContent =
        "Open Task";


      button.addEventListener(
        "click",
        function(){

          openTask(task.task_url);

        }
      );


      footer.appendChild(country);
      footer.appendChild(button);


      card.appendChild(top);
      card.appendChild(description);
      card.appendChild(footer);


      taskList.appendChild(card);

    });


  }catch(error){

    console.error(
      "UNEXPECTED TASK ERROR:",
      error
    );

    showError(
      "Something went wrong while loading tasks."
    );

  }

}


/* OPEN TASK */

function openTask(url){

  if(!url){

    alert(
      "This task does not have a link yet."
    );

    return;
  }


  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );

}


/* ERROR */

function showError(message){

  taskList.innerHTML = `
    <div class="error">
      ${message}
    </div>
  `;

}


/* START */

loadTasks();

</script>

</body>
</html>
