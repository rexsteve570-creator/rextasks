<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TallyBuck — Earn Tasks</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --green:#079447;
      --green-dark:#063f2d;
      --green-soft:#eaf8f1;
      --bg:#f5f7f6;
      --card:#ffffff;
      --text:#15231d;
      --muted:#718078;
      --border:#e5ebe8;
      --danger:#dc3545;
      --warning:#d97706;
      --shadow:0 8px 25px rgba(6,63,45,.06);
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Inter,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
    }

    body.dark{
      --bg:#0c1210;
      --card:#121a17;
      --text:#f1f6f3;
      --muted:#94a39b;
      --border:#24332d;
      --green-soft:#142d22;
      --shadow:0 8px 25px rgba(0,0,0,.2);
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    button{
      font-family:inherit;
    }

    .app{
      max-width:760px;
      margin:0 auto;
      min-height:100vh;
      padding-bottom:90px;
    }

    /* =========================================================
       HEADER
    ========================================================= */

    .topbar{
      position:sticky;
      top:0;
      z-index:100;
      height:68px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 18px;
      background:var(--card);
      border-bottom:1px solid var(--border);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:20px;
      font-weight:800;
      color:var(--green);
    }

    .brand-mark{
      width:34px;
      height:34px;
      border-radius:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--green);
      color:#fff;
      font-weight:900;
    }

    .header-actions{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .icon-btn{
      width:40px;
      height:40px;
      border:1px solid var(--border);
      border-radius:12px;
      background:var(--card);
      color:var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      position:relative;
    }

    .icon-btn svg{
      width:20px;
      height:20px;
    }

    .notification-dot{
      position:absolute;
      top:7px;
      right:7px;
      width:7px;
      height:7px;
      background:#ef4444;
      border-radius:50%;
      border:2px solid var(--card);
    }

    /* =========================================================
       CONTENT
    ========================================================= */

    .content{
      padding:18px;
    }

    .page-header{
      margin-bottom:18px;
    }

    .page-header h1{
      font-size:24px;
      margin-bottom:5px;
    }

    .page-header p{
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
    }

    /* =========================================================
       FILTERS
    ========================================================= */

    .filters{
      display:flex;
      gap:8px;
      overflow-x:auto;
      padding-bottom:4px;
      margin-bottom:18px;
      scrollbar-width:none;
    }

    .filters::-webkit-scrollbar{
      display:none;
    }

    .filter-btn{
      flex:none;
      border:1px solid var(--border);
      background:var(--card);
      color:var(--muted);
      padding:9px 14px;
      border-radius:10px;
      font-size:12px;
      font-weight:700;
      cursor:pointer;
    }

    .filter-btn.active{
      background:var(--green);
      border-color:var(--green);
      color:#fff;
    }

    /* =========================================================
       SECTION HEADER
    ========================================================= */

    .section-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:11px;
    }

    .section-title{
      font-size:17px;
      font-weight:800;
    }

    .task-count{
      color:var(--muted);
      font-size:12px;
    }

    /* =========================================================
       TASK CARD
    ========================================================= */

    .task-list{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .task-card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:17px;
      padding:16px;
      box-shadow:var(--shadow);
    }

    .task-top{
      display:flex;
      align-items:flex-start;
      gap:13px;
    }

    .task-image{
      width:48px;
      height:48px;
      border-radius:13px;
      background:var(--green-soft);
      display:flex;
      align-items:center;
      justify-content:center;
      flex:none;
      overflow:hidden;
      color:var(--green);
    }

    .task-image img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .task-image svg{
      width:23px;
      height:23px;
    }

    .task-info{
      flex:1;
      min-width:0;
    }

    .task-title{
      font-size:14px;
      font-weight:800;
      line-height:1.35;
      margin-bottom:5px;
    }

    .task-description{
      color:var(--muted);
      font-size:12px;
      line-height:1.45;
    }

    .task-reward{
      color:var(--green);
      font-size:14px;
      font-weight:800;
      white-space:nowrap;
    }

    .task-bottom{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-top:14px;
      padding-top:13px;
      border-top:1px solid var(--border);
    }

    .task-type{
      display:inline-flex;
      align-items:center;
      gap:5px;
      color:var(--muted);
      font-size:11px;
      font-weight:600;
      text-transform:capitalize;
    }

    .task-type svg{
      width:14px;
      height:14px;
    }

    .start-btn{
      border:0;
      background:var(--green);
      color:#fff;
      padding:9px 15px;
      border-radius:10px;
      font-size:12px;
      font-weight:800;
      cursor:pointer;
    }

    .start-btn:active{
      transform:scale(.98);
    }

    /* =========================================================
       STATES
    ========================================================= */

    .state-card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:17px;
      padding:30px 20px;
      text-align:center;
      box-shadow:var(--shadow);
    }

    .state-icon{
      width:48px;
      height:48px;
      margin:0 auto 12px;
      border-radius:14px;
      background:var(--green-soft);
      color:var(--green);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .state-icon svg{
      width:23px;
      height:23px;
    }

    .state-title{
      font-size:15px;
      font-weight:800;
      margin-bottom:5px;
    }

    .state-text{
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }

    .retry-btn{
      margin-top:14px;
      border:1px solid var(--green);
      background:var(--card);
      color:var(--green);
      padding:9px 15px;
      border-radius:10px;
      font-size:12px;
      font-weight:800;
      cursor:pointer;
    }

    /* =========================================================
       SKELETON
    ========================================================= */

    .skeleton-card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:17px;
      padding:16px;
    }

    .skeleton{
      background:linear-gradient(
        90deg,
        var(--border) 25%,
        var(--green-soft) 50%,
        var(--border) 75%
      );
      background-size:200% 100%;
      animation:skeletonMove 1.4s infinite;
      border-radius:8px;
    }

    .skeleton-row{
      display:flex;
      gap:13px;
    }

    .skeleton-image{
      width:48px;
      height:48px;
      border-radius:13px;
      flex:none;
    }

    .skeleton-content{
      flex:1;
    }

    .skeleton-title{
      height:13px;
      width:65%;
      margin-bottom:9px;
    }

    .skeleton-text{
      height:10px;
      width:90%;
      margin-bottom:6px;
    }

    .skeleton-text.small{
      width:60%;
    }

    .skeleton-button{
      height:34px;
      width:80px;
      margin-top:14px;
      margin-left:auto;
    }

    @keyframes skeletonMove{
      0%{
        background-position:200% 0;
      }
      100%{
        background-position:-200% 0;
      }
    }

    /* =========================================================
       BOTTOM NAV
    ========================================================= */

    .bottom-nav{
      position:fixed;
      z-index:90;
      left:50%;
      transform:translateX(-50%);
      bottom:0;
      width:100%;
      max-width:760px;
      height:72px;
      background:var(--card);
      border-top:1px solid var(--border);
      display:grid;
      grid-template-columns:repeat(4,1fr);
      padding:7px 8px;
    }

    .nav-item{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;
      color:var(--muted);
      font-size:10px;
      font-weight:600;
    }

    .nav-item svg{
      width:20px;
      height:20px;
    }

    .nav-item.active{
      color:var(--green);
    }

    /* =========================================================
       SIDE MENU
    ========================================================= */

    .menu-overlay{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.4);
      z-index:200;
    }

    .menu-overlay.show{
      display:block;
    }

    .side-menu{
      position:fixed;
      z-index:201;
      top:0;
      right:-310px;
      width:290px;
      max-width:85%;
      height:100vh;
      background:var(--card);
      transition:right .25s ease;
      padding:20px;
      overflow-y:auto;
    }

    .side-menu.show{
      right:0;
    }

    .menu-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:22px;
    }

    .menu-header strong{
      font-size:18px;
    }

    .menu-item{
      width:100%;
      border:0;
      background:none;
      color:var(--text);
      display:flex;
      align-items:center;
      gap:12px;
      padding:13px 8px;
      border-radius:10px;
      cursor:pointer;
      text-align:left;
      font-size:14px;
    }

    .menu-item:hover{
      background:var(--green-soft);
    }

    .menu-item svg{
      width:19px;
      height:19px;
      color:var(--green);
    }

    @media(max-width:420px){

      .content{
        padding:15px;
      }

      .page-header h1{
        font-size:22px;
      }

      .task-card{
        padding:14px;
      }

      .task-reward{
        font-size:13px;
      }

      .start-btn{
        padding:8px 12px;
      }
    }
  </style>
</head>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://cetsxdkoauucxwsbdktl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_crwxMSen3GDl9BQZfy_QLg_o_uicRCD";

const OFFERS_FUNCTION =
  "https://cetsxdkoauucxwsbdktl.supabase.co/functions/v1/get-offers";


const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}


function escapeHtml(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function normalizeCategory(value){

  const category =
    String(value || "")
      .toLowerCase()
      .trim();

  if(
    category.includes("survey")
  ){
    return "survey";
  }

  if(
    category.includes("app") ||
    category.includes("install")
  ){
    return "app";
  }

  return "offer";
}


function categoryLabel(category){

  if(category === "survey"){
    return "Survey";
  }

  if(category === "app"){
    return "App Install";
  }

  return "Offer";
}


function categoryIcon(category){

  if(category === "survey"){

    return `
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M4 4h16v16H4z"></path>
        <path d="M8 8h8"></path>
        <path d="M8 12h6"></path>
        <path d="M8 16h4"></path>
      </svg>
    `;
  }


  if(category === "app"){

    return `
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <rect
          x="6"
          y="2"
          width="12"
          height="20"
          rx="2"
        ></rect>
        <path d="M10 18h4"></path>
      </svg>
    `;
  }


  return `
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M8 12h8"></path>
      <path d="M12 8v8"></path>
    </svg>
  `;
}


/* =========================================================
   AUTH
========================================================= */

let currentUser = null;


/* =========================================================
   OFFERS
========================================================= */

let allOffers = [];

let currentFilter = "all";


/* =========================================================
   COUNTRY
========================================================= */

async function detectCountry(){

  try{

    const response =
      await fetch(
        "https://ipapi.co/json/"
      );

    if(!response.ok){
      return "";
    }

    const data =
      await response.json();

    return (
      data.country_code ||
      data.country ||
      ""
    );

  }catch(error){

    console.error(
      "Country detection error:",
      error
    );

    return "";
  }
}


/* =========================================================
   NORMALIZE OFFER
========================================================= */

function normalizeOffer(raw){

  if(!raw){
    return null;
  }


  const id =
    raw.id ??
    raw.offer_id ??
    raw.offerId ??
    raw.external_id;


  const title =
    raw.title ??
    raw.name ??
    raw.offer_title ??
    raw.offer_name ??
    "Available Opportunity";


  const description =
    raw.description ??
    raw.short_description ??
    raw.desc ??
    "Complete this opportunity to earn a verified reward.";


  const url =
    raw.url ??
    raw.click_url ??
    raw.offer_url ??
    raw.link ??
    raw.tracking_url;


  const reward =
    Number(
      raw.reward ??
      raw.payout ??
      raw.amount ??
      raw.user_reward ??
      0
    );


  const image =
    raw.image ??
    raw.image_url ??
    raw.icon ??
    raw.thumbnail ??
    "";


  const category =
    normalizeCategory(
      raw.category ??
      raw.type ??
      raw.offer_type ??
      raw.vertical
    );


  if(
    !id ||
    !url ||
    !Number.isFinite(reward) ||
    reward <= 0
  ){
    return null;
  }


  return {

    id:String(id),

    title:String(title),

    description:String(description),

    url:String(url),

    reward:reward,

    image:String(image),

    category:category

  };
}


/* =========================================================
   EXTRACT OFFERS
========================================================= */

function extractOffers(data){

  if(Array.isArray(data)){
    return data;
  }


  if(!data || typeof data !== "object"){
    return [];
  }


  if(Array.isArray(data.offers)){
    return data.offers;
  }


  if(Array.isArray(data.data)){
    return data.data;
  }


  if(
    data.data &&
    Array.isArray(data.data.offers)
  ){
    return data.data.offers;
  }


  if(Array.isArray(data.results)){
    return data.results;
  }


  return [];
}


/* =========================================================
   LOAD OFFERS
========================================================= */

async function loadOffers(){

  const taskList =
    $("taskList");


  taskList.innerHTML = `
    <div class="skeleton-card">

      <div class="skeleton-row">

        <div class="skeleton skeleton-image"></div>

        <div class="skeleton-content">

          <div class="skeleton skeleton-title"></div>

          <div class="skeleton skeleton-text"></div>

          <div class="skeleton skeleton-text small"></div>

        </div>

      </div>

      <div class="skeleton skeleton-button"></div>

    </div>

    <div class="skeleton-card">

      <div class="skeleton-row">

        <div class="skeleton skeleton-image"></div>

        <div class="skeleton-content">

          <div class="skeleton skeleton-title"></div>

          <div class="skeleton skeleton-text"></div>

          <div class="skeleton skeleton-text small"></div>

        </div>

      </div>

      <div class="skeleton skeleton-button"></div>

    </div>
  `;


  $("taskCount").textContent =
    "Loading...";


  try{

    const country =
      await detectCountry();


    const {
      data:{
        session
      }
    } =
      await db.auth.getSession();


    if(!session){

      window.location.href =
        "login.html";

      return;
    }


    const requestUrl =
      new URL(
        OFFERS_FUNCTION
      );


    if(country){

      requestUrl.searchParams.set(
        "country",
        country
      );

    }


    const response =
      await fetch(
        requestUrl.toString(),
        {
          method:"GET",

          headers:{
            "Authorization":
              "Bearer " +
              session.access_token,

            "apikey":
              SUPABASE_KEY,

            "Content-Type":
              "application/json"
          }
        }
      );


    if(!response.ok){

      throw new Error(
        "Unable to load earning opportunities."
      );

    }


    const data =
      await response.json();


    const rawOffers =
      extractOffers(data);


    allOffers =
      rawOffers
        .map(normalizeOffer)
        .filter(Boolean);


    renderOffers();


  }catch(error){

    console.error(
      "Offer loading error:",
      error
    );


    $("taskCount").textContent =
      "Unable to load";


    taskList.innerHTML = `

      <div class="state-card">

        <div class="state-icon">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 8v4"></path>
            <path d="M12 16h.01"></path>
          </svg>

        </div>

        <div class="state-title">
          Unable to load tasks
        </div>

        <div class="state-text">
          We could not load the available opportunities right now. Please try again.
        </div>

        <button
          class="retry-btn"
          onclick="loadOffers()"
        >
          Try Again
        </button>

      </div>

    `;

  }

}


/* =========================================================
   RENDER OFFERS
========================================================= */

function renderOffers(){

  const taskList =
    $("taskList");


  let offers =
    allOffers;


  if(currentFilter !== "all"){

    offers =
      allOffers.filter(
        function(offer){

          return (
            offer.category ===
            currentFilter
          );

        }
      );

  }


  $("taskCount").textContent =
    offers.length +
    (
      offers.length === 1
        ? " available"
        : " available"
    );


  if(offers.length === 0){

    let message =
      "There are no opportunities available right now.";


    if(
      currentFilter === "survey"
    ){
      message =
        "There are no surveys available right now.";
    }


    if(
      currentFilter === "offer"
    ){
      message =
        "There are no offers available right now.";
    }


    if(
      currentFilter === "app"
    ){
      message =
        "There are no app install opportunities available right now.";
    }


    taskList.innerHTML = `

      <div class="state-card">

        <div class="state-icon">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M4 4h16v16H4z"></path>
            <path d="M8 8h8"></path>
            <path d="M8 12h6"></path>
            <path d="M8 16h4"></path>
          </svg>

        </div>

        <div class="state-title">
          No tasks available
        </div>

        <div class="state-text">
          ${escapeHtml(message)}
        </div>

      </div>

    `;

    return;
  }


  taskList.innerHTML =
    offers.map(
      function(offer){

        const imageHtml =
          offer.image
            ? `
              <img
                src="${escapeHtml(offer.image)}"
                alt=""
                loading="lazy"
                onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
              >

              <span style="display:none;">
                ${categoryIcon(offer.category)}
              </span>
            `
            : categoryIcon(
                offer.category
              );


        return `

          <article
            class="task-card"
          >

            <div class="task-top">

              <div class="task-image">

                ${imageHtml}

              </div>


              <div class="task-info">

                <div class="task-title">
                  ${escapeHtml(offer.title)}
                </div>

                <div class="task-description">
                  ${escapeHtml(offer.description)}
                </div>

              </div>


              <div class="task-reward">
                +$${offer.reward.toFixed(2)}
              </div>

            </div>


            <div class="task-bottom">

              <div class="task-type">

                ${categoryIcon(offer.category)}

                ${escapeHtml(
                  categoryLabel(
                    offer.category
                  )
                )}

              </div>


              <button
                class="start-btn"
                type="button"
                onclick="openOffer('${encodeURIComponent(offer.id)}')"
              >
                Start
              </button>

            </div>

          </article>

        `;

      }
    )
    .join("");

}


/* =========================================================
   OPEN OFFER
========================================================= */

function openOffer(encodedId){

  const id =
    decodeURIComponent(
      encodedId
    );


  const offer =
    allOffers.find(
      function(item){
        return item.id === id;
      }
    );


  if(!offer){
    return;
  }


  if(!offer.url){
    return;
  }


  window.open(
    offer.url,
    "_blank",
    "noopener,noreferrer"
  );

}


/* =========================================================
   FILTERS
========================================================= */

document
  .querySelectorAll(".filter-btn")
  .forEach(
    function(button){

      button.addEventListener(
        "click",
        function(){

          document
            .querySelectorAll(".filter-btn")
            .forEach(
              function(item){

                item.classList.remove(
                  "active"
                );

              }
            );


          button.classList.add(
            "active"
          );


          currentFilter =
            button.dataset.filter ||
            "all";


          renderOffers();

        }
      );

    }
  );


/* =========================================================
   NOTIFICATION BADGE
========================================================= */

async function loadNotificationBadge(){

  if(!currentUser){
    return;
  }


  const {
    count,
    error
  } =
    await db
      .from("notifications")
      .select(
        "id",
        {
          count:"exact",
          head:true
        }
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .eq(
        "is_read",
        false
      );


  if(error){

    console.error(
      "Notification count error:",
      error
    );

    return;
  }


  if(
    count &&
    count > 0
  ){

    $("notificationDot").style.display =
      "block";

  }else{

    $("notificationDot").style.display =
      "none";

  }

}


/* =========================================================
   THEME
========================================================= */

function applyTheme(){

  const saved =
    localStorage.getItem(
      "tallybuck-theme"
    );


  if(saved === "dark"){

    document.body.classList.add(
      "dark"
    );

  }else if(saved === "light"){

    document.body.classList.remove(
      "dark"
    );

  }else{

    const dark =
      window.matchMedia &&
      window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches;


    document.body.classList.toggle(
      "dark",
      dark
    );

  }

}


function toggleTheme(){

  const isDark =
    document.body.classList.contains(
      "dark"
    );


  document.body.classList.toggle(
    "dark",
    !isDark
  );


  localStorage.setItem(
    "tallybuck-theme",
    !isDark
      ? "dark"
      : "light"
  );

}


/* =========================================================
   MENU
========================================================= */

function openMenu(){

  $("sideMenu")
    .classList
    .add("show");


  $("menuOverlay")
    .classList
    .add("show");

}


function closeMenu(){

  $("sideMenu")
    .classList
    .remove("show");


  $("menuOverlay")
    .classList
    .remove("show");

}


/* =========================================================
   MENU EVENTS
========================================================= */

$("menuBtn")
  .addEventListener(
    "click",
    openMenu
  );


$("closeMenu")
  .addEventListener(
    "click",
    closeMenu
  );


$("menuOverlay")
  .addEventListener(
    "click",
    closeMenu
  );


$("themeBtn")
  .addEventListener(
    "click",
    function(){

      toggleTheme();

    }
  );


$("logoutBtn")
  .addEventListener(
    "click",
    async function(){

      await db.auth.signOut();

      window.location.href =
        "login.html";

    }
  );


/* =========================================================
   AUTH CHECK + START
========================================================= */

async function startPage(){

  applyTheme();


  const {
    data:{
      user
    },
    error
  } =
    await db.auth.getUser();


  if(error || !user){

    window.location.href =
      "login.html";

    return;
  }


  currentUser =
    user;


  await loadNotificationBadge();


  await loadOffers();

}


startPage();

</script>
