<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RexTasks — Available Tasks</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#031612;
  --bg2:#061f19;
  --card:#06251e;
  --border:#0b5d4b;
  --green:#35e6a5;
  --green2:#19c98b;
  --white:#f4fffb;
  --muted:#a8c3bc;
  --shadow:0 15px 45px rgba(0,0,0,.28);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(180deg,#02110e,#031b16 45%,#02120f);
  color:var(--white);
  min-height:100vh;
}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

.header{
  height:76px;
  border-bottom:1px solid rgba(53,230,165,.18);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(2,17,14,.94);
  backdrop-filter:blur(14px);
}

.logo{
  font-size:29px;
  font-weight:800;
  letter-spacing:-1.5px;
}

.logo span{
  color:var(--green);
}

.header-right{
  display:flex;
  align-items:center;
  gap:14px;
}

.balance{
  border:1px solid #087a60;
  color:var(--green);
  border-radius:30px;
  padding:10px 16px;
  font-size:16px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:8px;
}

.balance svg{
  width:21px;
  height:21px;
}

.menu-btn{
  border:0;
  background:none;
  color:white;
  width:40px;
  height:40px;
  cursor:pointer;
}

.menu-btn svg{
  width:32px;
  height:32px;
}

.container{
  width:min(1100px,100%);
  margin:auto;
  padding:34px 18px 110px;
}

.page-title{
  font-size:39px;
  line-height:1.05;
  font-weight:800;
  letter-spacing:-1.4px;
  margin-bottom:10px;
}

.page-subtitle{
  color:var(--muted);
  font-size:17px;
  line-height:1.5;
  margin-bottom:27px;
}

/* LOCATION */

.location-box{
  border:1px solid #087a60;
  background:rgba(5,45,35,.58);
  border-radius:22px;
  padding:17px 18px;
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:30px;
}

.location-icon{
  width:42px;
  height:42px;
  flex:none;
  color:var(--green);
}

.location-title{
  font-size:16px;
  font-weight:800;
  margin-bottom:5px;
}

.location-text{
  color:var(--muted);
  font-size:14px;
}

.location-text strong{
  color:var(--green);
}

/* TASK GRID */

.task-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:22px;
}

.task-card{
  background:linear-gradient(145deg,rgba(5,39,31,.94),rgba(3,28,23,.96));
  border:1px solid rgba(23,139,110,.6);
  border-radius:26px;
  padding:22px;
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  min-height:390px;
  transition:.2s ease;
}

.task-card:hover{
  transform:translateY(-3px);
  border-color:var(--green2);
}

.task-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}

.task-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.task-icon{
  width:62px;
  height:62px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  flex:none;
}

.task-icon svg{
  width:32px;
  height:32px;
}

/* CATEGORY COLORS */

.icon-app{
  background:linear-gradient(135deg,#12a984,#0d705e);
}

.icon-survey{
  background:linear-gradient(135deg,#4d8cff,#315db9);
}

.icon-signup{
  background:linear-gradient(135deg,#f3a42b,#c66d08);
}

.icon-offer{
  background:linear-gradient(135deg,#9556f1,#6130ae);
}

.icon-daily{
  background:linear-gradient(135deg,#19c98b,#087b5d);
}

.icon-task{
  background:linear-gradient(135deg,#18b8b0,#087b78);
}

.icon-referral{
  background:linear-gradient(135deg,#db4ca8,#8d2870);
}

.category{
  padding:8px 13px;
  border-radius:30px;
  font-size:12px;
  font-weight:800;
  letter-spacing:.5px;
  white-space:nowrap;
}

.cat-app{
  background:rgba(19,201,154,.22);
  color:#55edbd;
}

.cat-survey{
  background:rgba(69,132,255,.25);
  color:#8ab2ff;
}

.cat-signup{
  background:rgba(244,160,34,.22);
  color:#ffbb5b;
}

.cat-offer{
  background:rgba(139,76,239,.25);
  color:#c09aff;
}

.cat-daily{
  background:rgba(31,211,145,.22);
  color:#55edbd;
}

.cat-task{
  background:rgba(24,184,176,.22);
  color:#61e6e0;
}

.cat-referral{
  background:rgba(219,76,168,.22);
  color:#ef8bd0;
}

.more-btn{
  width:30px;
  height:40px;
  border:0;
  background:none;
  color:#dcebe7;
  cursor:pointer;
  flex:none;
}

.more-btn svg{
  width:25px;
  height:25px;
}

.task-title{
  font-size:25px;
  line-height:1.25;
  margin-top:25px;
  font-weight:800;
  letter-spacing:-.5px;
}

.task-description{
  color:var(--muted);
  font-size:16px;
  line-height:1.55;
  margin-top:12px;
}

.task-bottom{
  margin-top:auto;
  padding-top:25px;
}

.reward{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--green);
  font-size:27px;
  font-weight:900;
  margin-bottom:20px;
}

.reward-icon{
  width:39px;
  height:39px;
  border-radius:50%;
  background:var(--green);
  color:#032019;
  display:flex;
  align-items:center;
  justify-content:center;
}

.reward-icon svg{
  width:21px;
  height:21px;
}

.start-btn{
  width:100%;
  border:0;
  border-radius:15px;
  padding:16px;
  background:linear-gradient(135deg,#39e8a7,#20d394);
  color:#022117;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
  transition:.2s ease;
}

.start-btn:hover{
  transform:translateY(-1px);
  filter:brightness(1.05);
}

.start-btn:active{
  transform:scale(.98);
}

/* EMPTY / LOADING */

.message{
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
  font-size:16px;
}

.loader{
  width:35px;
  height:35px;
  border:3px solid rgba(53,230,165,.2);
  border-top-color:var(--green);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 15px;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:76px;
  background:rgba(2,20,16,.97);
  border-top:1px solid rgba(53,230,165,.18);
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:30;
  backdrop-filter:blur(15px);
}

.nav-item{
  text-decoration:none;
  color:#8ea9a2;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  font-size:12px;
  font-weight:700;
  min-width:70px;
}

.nav-item svg{
  width:25px;
  height:25px;
}

.nav-item.active{
  color:var(--green);
}

.nav-active-line{
  position:absolute;
  bottom:0;
  width:85px;
  height:4px;
  border-radius:10px 10px 0 0;
  background:var(--green);
}

/* TABLET / DESKTOP */

@media(min-width:800px){
  .container{
    padding-top:50px;
  }

  .page-title{
    font-size:48px;
  }

  .task-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

  .task-card{
    min-height:380px;
  }
}

/* MOBILE */

@media(max-width:650px){
  .header{
    height:68px;
    padding:0 14px;
  }

  .logo{
    font-size:25px;
  }

  .balance{
    padding:8px 12px;
    font-size:14px;
  }

  .balance svg{
    width:18px;
    height:18px;
  }

  .menu-btn{
    width:34px;
  }

  .menu-btn svg{
    width:29px;
  }

  .container{
    padding:29px 14px 100px;
  }

  .page-title{
    font-size:34px;
  }

  .page-subtitle{
    font-size:15px;
  }

  .location-box{
    border-radius:18px;
    padding:15px;
  }

  .task-grid{
    grid-template-columns:1fr;
    gap:17px;
  }

  .task-card{
    min-height:355px;
    padding:20px;
    border-radius:23px;
  }

  .task-title{
    font-size:23px;
  }

  .task-description{
    font-size:15px;
  }

  .reward{
    font-size:25px;
  }
}
</style>
</head>

<script>

const SUPABASE_URL =
"https://cetsxdkoauucxwsbdktl.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_crwxMSen3GDl9BQZfy_QLg_o_uicRCD";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================
   ICONS
========================= */

function getTaskIcon(category){

  const c = String(category || "").toLowerCase();

  if(c.includes("survey")){
    return {
      type:"survey",
      icon:`
        <svg viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2">
          <rect x="5" y="3" width="14" height="18" rx="2"/>
          <path d="M9 7h6M9 11h6M9 15h3"/>
          <path d="m14 15 1.5 1.5L18 14"/>
        </svg>
      `
    };
  }

  if(c.includes("sign") || c.includes("signup") || c.includes("register")){
    return {
      type:"signup",
      icon:`
        <svg viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="8" r="3"/>
          <path d="M3 20c0-3.5 2.5-6 6-6s6 2.5 6 6"/>
          <path d="M18 12v6M15 15h6"/>
        </svg>
      `
    };
  }

  if(c.includes("offer")){
    return {
      type:"offer",
      icon:`
        <svg viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2">
          <path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6"/>
          <path d="M3 7h18v5H3z"/>
          <path d="M12 7v13"/>
          <path d="M8 7c-2 0-3-1-3-2s1-2 2-2c2 0 5 4 5 4"/>
          <path d="M16 7c2 0 3-1 3-2s-1-2-2-2c-2 0-5 4-5 4"/>
        </svg>
      `
    };
  }

  if(c.includes("daily")){
    return {
      type:"daily",
      icon:`
        <svg viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2">
          <rect x="4" y="5" width="16" height="15" rx="2"/>
          <path d="M8 3v4M16 3v4M4 9h16"/>
          <path d="M8 13h2M12 13h2M16 13h1M8 16h2M12 16h2"/>
        </svg>
      `
    };
  }

  if(c.includes("referral")){
    return {
      type:"referral",
      icon:`
        <svg viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="8" r="3"/>
          <circle cx="17" cy="9" r="2.5"/>
          <path d="M3 20c0-3.2 2.6-5 6-5s6 1.8 6 5"/>
          <path d="M15 15c3 0 5 1.6 5 4"/>
        </svg>
      `
    };
  }

  if(c.includes("app") || c.includes("install")){
    return {
      type:"app",
      icon:`
        <svg viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2">
          <rect x="6" y="3" width="12" height="18" rx="2"/>
          <path d="M9 6h6M10 18h4"/>
          <circle cx="12" cy="15" r="1"/>
        </svg>
      `
    };
  }

  return {
    type:"task",
    icon:`
      <svg viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2">
        <path d="M9 5h6"/>
        <path d="M9 3h6v4H9z"/>
        <path d="M6 5H5a2 2 0 0 0-2 2v13h16a2 2 0 0 0 2-2v-1"/>
        <path d="M8 11h4M8 15h3"/>
        <path d="m15 15 2 2 4-5"/>
      </svg>
    `
  };
}


/* =========================
   LOAD SESSION
========================= */

async function getUser(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getSession();

  if(error || !data.session){

    window.location.href =
      "login.html";

    return null;
  }

  return data.session.user;
}


/* =========================
   LOAD BALANCE
========================= */

async function loadBalance(user){

  const {
    data
  } =
  await supabaseClient
  .from("wallets")
  .select("balance")
  .eq("user_id",user.id)
  .maybeSingle();

  if(data){

    document.getElementById("balance")
      .textContent =
      "$" +
      Number(data.balance || 0)
      .toFixed(2);

  }
}


/* =========================
   DETECT COUNTRY
========================= */

async function detectCountry(){

  const response =
    await fetch(
      "https://ipapi.co/json/"
    );

  if(!response.ok){

    throw new Error(
      "Country detection failed"
    );

  }

  const data =
    await response.json();

  if(!data.country_name){

    throw new Error(
      "Country unavailable"
    );

  }

  return data.country_name.trim();

}


/* =========================
   LOAD TASKS
========================= */

async function loadTasks(){

  const grid =
    document.getElementById("taskGrid");

  try{

    const country =
      await detectCountry();

    document.getElementById(
      "countryName"
    ).textContent =
      country;


    const {
      data:tasks,
      error
    } =
    await supabaseClient
      .from("tasks")
      .select(`
        id,
        title,
        description,
        category,
        country,
        payout,
        user_reward_percent,
        task_url,
        proof_required,
        max_completions,
        status,
        created_at
      `)
      .eq("status","active")
      .order(
        "created_at",
        {ascending:false}
      );


    if(error){

      throw error;

    }


    const available =
      (tasks || []).filter(task => {

        const target =
          String(
            task.country || "Worldwide"
          )
          .trim()
          .toLowerCase();

        const detected =
          String(country)
          .trim()
          .toLowerCase();

        return (
          target === "worldwide" ||
          target === detected
        );

      });


    grid.innerHTML = "";


    if(!available.length){

      grid.innerHTML = `
        <div class="message"
             style="grid-column:1/-1;">
          No tasks are available for your
          location right now.
        </div>
      `;

      return;

    }


    available.forEach(task => {

      const reward =
        Number(task.payout || 0) *
        Number(
          task.user_reward_percent || 0
        ) /
        100;


      const iconData =
        getTaskIcon(task.category);


      const categoryText =
        formatCategory(
          task.category
        );


      const card =
        document.createElement("article");

      card.className =
        "task-card";


      card.innerHTML = `

        <div class="task-top">

          <div class="task-left">

            <div class="
              task-icon
              icon-${iconData.type}
            ">
              ${iconData.icon}
            </div>

            <div class="
              category
              cat-${iconData.type}
            ">
              ${escapeHTML(categoryText)}
            </div>

          </div>


          <button
            class="more-btn"
            onclick="showTaskInfo()"
            aria-label="Task options"
          >

            <svg viewBox="0 0 24 24"
                 fill="currentColor">

              <circle cx="12" cy="5" r="1.6"/>
              <circle cx="12" cy="12" r="1.6"/>
              <circle cx="12" cy="19" r="1.6"/>

            </svg>

          </button>

        </div>


        <h2 class="task-title">
          ${escapeHTML(task.title)}
        </h2>


        <p class="task-description">
          ${escapeHTML(
            task.description ||
            "Complete this task and submit proof when required."
          )}
        </p>


        <div class="task-bottom">

          <div class="reward">

            <div class="reward-icon">

              <svg viewBox="0 0 24 24"
                   fill="none"
                   stroke="currentColor"
                   stroke-width="2.4">

                <path d="M12 3v18"/>
                <path d="M17 7.5c0-2-2-3-5-3s-5 1-5 3 2 3 5 3 5 1 5 3-2 3-5 3-5-1-5-3"/>

              </svg>

            </div>

            $${reward.toFixed(2)}

          </div>


          <button
            class="start-btn"
            onclick="startTask(
              ${Number(task.id)},
              ${JSON.stringify(task.task_url || "")},
              ${task.proof_required ? "true" : "false"}
            )"
          >
            Start Task
          </button>

        </div>

      `;


      grid.appendChild(card);

    });

  }catch(error){

    console.error(error);

    grid.innerHTML = `

      <div class="message"
           style="grid-column:1/-1;">

        We couldn't load tasks right now.
        Please refresh and try again.

      </div>

    `;

  }

}


/* =========================
   START TASK
========================= */

function startTask(
  taskId,
  taskUrl,
  proofRequired
){

  if(taskUrl){

    window.open(
      taskUrl,
      "_blank"
    );

  }

  /*
    We keep the task ID ready for
    the next proof-submission step.
  */

}


/* =========================
   CATEGORY FORMAT
========================= */

function formatCategory(category){

  const c =
    String(category || "")
    .trim()
    .toLowerCase();

  if(c.includes("survey"))
    return "SURVEY";

  if(
    c.includes("sign") ||
    c.includes("signup") ||
    c.includes("register")
  )
    return "SIGN UP";

  if(c.includes("offer"))
    return "OFFER";

  if(c.includes("daily"))
    return "DAILY";

  if(c.includes("referral"))
    return "REFERRAL";

  if(
    c.includes("app") ||
    c.includes("install")
  )
    return "APP";

  return "TASK";
}


/* =========================
   SAFE HTML
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
