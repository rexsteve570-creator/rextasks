<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tasks — TallyBuck</title>

<style>
:root{
  --bg:#f4f8f5;
  --card:#ffffff;
  --text:#102018;
  --muted:#6d7b73;
  --line:#e3ebe6;
  --green:#0d7a45;
  --green-dark:#07552f;
  --green-soft:#e8f6ee;
  --shadow:0 12px 35px rgba(8,55,31,.08);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
a{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}

/* =========================================================
   HEADER
========================================================= */

.header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(244,248,245,.94);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}

.header-inner{
  width:min(1100px,100%);
  margin:auto;
  padding:16px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  font-size:21px;
  letter-spacing:-.5px;
}

.brand-mark{
  width:34px;
  height:34px;
  border-radius:11px;
  background:linear-gradient(
    145deg,
    #0d8b50,
    #07552f
  );
  display:grid;
  place-items:center;
  color:white;
  box-shadow:0 7px 18px rgba(13,122,69,.22);
}

.brand-mark svg{
  width:18px;
  height:18px;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.icon-btn{
  width:40px;
  height:40px;
  border-radius:12px;
  background:white;
  border:1px solid var(--line);
  display:grid;
  place-items:center;
  color:var(--text);
}

.icon-btn svg{
  width:19px;
  height:19px;
}

/* =========================================================
   PAGE
========================================================= */

.container{
  width:min(1100px,100%);
  margin:auto;
  padding:25px 16px 110px;
}

.hero{
  margin-bottom:22px;
}

.hero h1{
  font-size:30px;
  line-height:1.12;
  letter-spacing:-1px;
  margin-bottom:8px;
}

.hero p{
  color:var(--muted);
  line-height:1.55;
  font-size:14px;
}

/* =========================================================
   COUNTRY / STATUS
========================================================= */

.availability{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:16px;
  padding:12px 14px;
  background:var(--green-soft);
  border:1px solid #d4ecdd;
  border-radius:14px;
  color:var(--green-dark);
  font-size:13px;
  font-weight:600;
}

.availability svg{
  width:17px;
  height:17px;
  flex:none;
}

/* =========================================================
   FILTERS
========================================================= */

.filters{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:4px 0 13px;
  margin-bottom:8px;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter{
  flex:none;
  padding:10px 15px;
  border-radius:999px;
  background:white;
  border:1px solid var(--line);
  color:#53625a;
  font-size:13px;
  font-weight:700;
  transition:.2s;
}

.filter.active{
  background:var(--green);
  border-color:var(--green);
  color:white;
  box-shadow:0 7px 16px rgba(13,122,69,.16);
}

/* =========================================================
   LIST
========================================================= */

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:7px 0 14px;
}

.section-head h2{
  font-size:17px;
  letter-spacing:-.3px;
}

.offer-count{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}

.offer-list{
  display:grid;
  gap:12px;
}

/* =========================================================
   OFFER CARD
========================================================= */

.offer-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:16px;
  box-shadow:var(--shadow);
}

.offer-top{
  display:flex;
  align-items:flex-start;
  gap:13px;
}

.offer-icon{
  width:46px;
  height:46px;
  border-radius:14px;
  flex:none;
  background:var(--green-soft);
  color:var(--green);
  display:grid;
  place-items:center;
}

.offer-icon svg{
  width:22px;
  height:22px;
}

.offer-main{
  min-width:0;
  flex:1;
}

.offer-title{
  font-size:15px;
  line-height:1.35;
  font-weight:800;
  margin-bottom:6px;
}

.offer-description{
  font-size:12px;
  line-height:1.45;
  color:var(--muted);
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.offer-meta{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:12px;
}

.tag{
  padding:6px 9px;
  border-radius:8px;
  background:#f1f5f2;
  color:#607067;
  font-size:11px;
  font-weight:700;
}

.reward{
  color:var(--green-dark);
  background:var(--green-soft);
}

.offer-bottom{
  margin-top:15px;
  padding-top:14px;
  border-top:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.reward-value{
  font-size:17px;
  font-weight:900;
  color:var(--green-dark);
}

.reward-label{
  font-size:10px;
  color:var(--muted);
  margin-top:2px;
}

.start-btn{
  min-width:110px;
  padding:11px 15px;
  border-radius:12px;
  background:var(--green);
  color:white;
  font-size:13px;
  font-weight:800;
  transition:.2s;
}

.start-btn:active{
  transform:scale(.97);
}

.start-btn:hover{
  background:var(--green-dark);
}

/* =========================================================
   STATES
========================================================= */

.state{
  background:white;
  border:1px solid var(--line);
  border-radius:20px;
  padding:35px 20px;
  text-align:center;
  box-shadow:var(--shadow);
}

.state-icon{
  width:52px;
  height:52px;
  margin:0 auto 13px;
  border-radius:16px;
  background:var(--green-soft);
  color:var(--green);
  display:grid;
  place-items:center;
}

.state-icon svg{
  width:23px;
  height:23px;
}

.state h3{
  font-size:16px;
  margin-bottom:7px;
}

.state p{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.retry-btn{
  margin-top:16px;
  padding:10px 15px;
  border-radius:11px;
  background:var(--green);
  color:white;
  font-size:13px;
  font-weight:800;
}

/* =========================================================
   LOADING
========================================================= */

.skeleton{
  height:155px;
  border-radius:20px;
  background:
    linear-gradient(
      90deg,
      #eef3ef 25%,
      #f7faf8 50%,
      #eef3ef 75%
    );
  background-size:200% 100%;
  animation:loading 1.3s infinite;
}

@keyframes loading{
  from{
    background-position:200% 0;
  }
  to{
    background-position:-200% 0;
  }
}

/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:60;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
}

.bottom-inner{
  width:min(600px,100%);
  margin:auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  padding:6px 3px;
  color:#78857e;
  font-size:10px;
  font-weight:700;
}

.nav-item svg{
  width:21px;
  height:21px;
}

.nav-item.active{
  color:var(--green);
}

/* =========================================================
   DARK MODE
========================================================= */

body.dark{
  --bg:#08110c;
  --card:#101b15;
  --text:#edf7f0;
  --muted:#91a198;
  --line:#203028;
  --green-soft:#102c1d;
  --green-dark:#7be2a9;
  --shadow:0 15px 35px rgba(0,0,0,.2);
}

body.dark .header{
  background:rgba(8,17,12,.94);
}

body.dark .icon-btn,
body.dark .filter,
body.dark .state,
body.dark .bottom-nav{
  background:#101b15;
}

body.dark .tag{
  background:#17251e;
  color:#9caaa2;
}

body.dark .skeleton{
  background:
    linear-gradient(
      90deg,
      #101b15 25%,
      #18261e 50%,
      #101b15 75%
    );
  background-size:200% 100%;
}

/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:700px){

  .container{
    padding-top:38px;
  }

  .hero h1{
    font-size:38px;
  }

  .offer-list{
    grid-template-columns:repeat(2,1fr);
  }

  .bottom-nav{
    display:none;
  }

  .container{
    padding-bottom:40px;
  }
}
</style>
</head>

<header class="header">

  <div class="header-inner">

    <a href="dashboard.html" class="brand">

      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"

             stroke-width="2"

          <path d="M6 8h12v12H6z"/>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://cetsxdkoauucxwsbdktl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_crwxMSen3GDl9BQZfy_QLg_o_uicRCD";

const OFFERS_FUNCTION =
  `${SUPABASE_URL}/functions/v1/get-offers`;

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   STATE
========================================================= */

let allOffers = [];

let activeCategory = "all";


/* =========================================================
   DOM
========================================================= */

const content =
  document.getElementById("content");

const offerCount =
  document.getElementById("offerCount");

const availabilityText =
  document.getElementById("availabilityText");

const themeBtn =
  document.getElementById("themeBtn");

const themeIcon =
  document.getElementById("themeIcon");


/* =========================================================
   THEME
========================================================= */

function updateThemeIcon(){

  const dark =
    document.body.classList.contains(
      "dark"
    );

  if(dark){

    themeIcon.innerHTML = `
      <path
        d="M21 12.8A8.5 8.5 0 1 1 11.2 3
        6.5 6.5 0 0 0 21 12.8Z"/>
    `;

  }else{

    themeIcon.innerHTML = `
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2"/>
      <path d="M12 20v2"/>
      <path d="m4.93 4.93 1.41 1.41"/>
      <path d="m17.66 17.66 1.41 1.41"/>
      <path d="M2 12h2"/>
      <path d="M20 12h2"/>
      <path d="m4.93 19.07 1.41-1.41"/>
      <path d="m17.66 6.34 1.41-1.41"/>
    `;

  }
}


function loadTheme(){

  const saved =
    localStorage.getItem(
      "tallybuck_theme"
    );

  if(saved === "dark"){
    document.body.classList.add(
      "dark"
    );
  }

  updateThemeIcon();
}


themeBtn.addEventListener(
  "click",
  () => {

    document.body.classList.toggle(
      "dark"
    );

    const dark =
      document.body.classList.contains(
        "dark"
      );

    localStorage.setItem(
      "tallybuck_theme",
      dark
        ? "dark"
        : "light"
    );

    updateThemeIcon();

  }
);


/* =========================================================
   COUNTRY DISPLAY
========================================================= */

async function detectCountry(){

  try{

    const response =
      await fetch(
        "https://ipapi.co/json/",
        {
          cache:"no-store"
        }
      );

    if(!response.ok){
      throw new Error();
    }

    const data =
      await response.json();

    if(data?.country_name){

      availabilityText.textContent =
        `Tasks available for ${data.country_name}`;

      return;

    }

  }catch(error){
    // Continue silently.
  }

  availabilityText.textContent =
    "Tasks available to you";

}


/* =========================================================
   ICON
========================================================= */

function categoryIcon(
  category
){

  if(category === "survey"){

    return `
      <svg viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">

        <path d="M4 4h16v16H4z"/>
        <path d="M8 8h8"/>
        <path d="M8 12h8"/>
        <path d="M8 16h5"/>

      </svg>
    `;

  }

  if(category === "app"){

    return `
      <svg viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">

        <rect
          x="6"
          y="2"
          width="12"
          height="20"
          rx="2"/>

        <path d="M10 18h4"/>

      </svg>
    `;

  }

  return `
    <svg viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="2"
         stroke-linecap="round"
         stroke-linejoin="round">

      <path d="M4 7h16v13H4z"/>
      <path d="M8 7V5a4 4 0 0 1 8 0v2"/>
      <path d="M9 13h6"/>

    </svg>
  `;

}


/* =========================================================
   CATEGORY LABEL
========================================================= */

function categoryLabel(
  category
){

  if(category === "survey"){
    return "Survey";
  }

  if(category === "app"){
    return "App Install";
  }

  return "Offer";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   OPEN OFFER
========================================================= */

function openOffer(
  offerUrl
){

  if(!offerUrl){
    return;
  }

  /*
    IMPORTANT:
    Provider offers are external tracked offers.

    Do NOT send these through:
      submit-task.html
      tasks table
      manual submission flow

    Open the exact URL returned by get-offers.
  */

  const safeUrl =
    String(
      offerUrl
    ).trim();

  if(
    !safeUrl.startsWith(
      "http://"
    ) &&
    !safeUrl.startsWith(
      "https://"
    )
  ){
    return;
  }

  window.location.href =
    safeUrl;

}


/* =========================================================
   RENDER OFFERS
========================================================= */

function renderOffers(){

  let filtered =
    allOffers;

  if(
    activeCategory !== "all"
  ){

    filtered =
      allOffers.filter(
        offer =>
          offer.category ===
          activeCategory
      );

  }

  offerCount.textContent =
    `${filtered.length} available`;


  if(!filtered.length){

    content.innerHTML = `
      <div class="state">

        <div class="state-icon">

          <svg viewBox="0 0 24 24"
               fill="none"
               stroke="currentColor"
               stroke-width="2"
               stroke-linecap="round"
               stroke-linejoin="round">

            <circle cx="11" cy="11" r="7"/>
            <path d="m20 20-4-4"/>

          </svg>

        </div>

        <h3>No tasks available</h3>

        <p>
          There are no tasks in this category right now.
          Check back later for new opportunities.
        </p>

      </div>
    `;

    return;
  }


  content.innerHTML = `
    <div class="offer-list">

      ${filtered.map(
        offer => {

          const reward =
            Number(
              offer.reward || 0
            ).toFixed(2);

          const category =
            String(
              offer.category ||
              "offer"
            );

          return `

            <article
              class="offer-card">

              <div class="offer-top">

                <div class="offer-icon">

                  ${categoryIcon(
                    category
                  )}

                </div>


                <div class="offer-main">

                  <h3
                    class="offer-title">

                    ${escapeHtml(
                      offer.title
                    )}

                  </h3>


                  ${
                    offer.description
                      ? `
                        <p
                          class="offer-description">

                          ${escapeHtml(
                            offer.description
                          )}

                        </p>
                      `
                      : ""
                  }


                  <div
                    class="offer-meta">

                    <span class="tag">

                      ${categoryLabel(
                        category
                      )}

                    </span>

                    <span
                      class="tag reward">

                      Reward available

                    </span>

                  </div>

                </div>

              </div>


              <div class="offer-bottom">

                <div>

                  <div
                    class="reward-value">

                    +$${reward}

                  </div>

                  <div
                    class="reward-label">

                    Your reward

                  </div>

                </div>


                <button
                  class="start-btn"
                  type="button"
                  data-offer-url="${escapeHtml(
                    offer.url
                  )}">

                  Start Task

                </button>

              </div>

            </article>

          `;

        }
      ).join("")}

    </div>
  `;


  /*
    Event delegation.

    This is intentionally used instead of inline
    onclick attributes so dynamically rendered offers
    always receive the click handler.
  */

  content
    .querySelectorAll(
      ".start-btn"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            const url =
              button.dataset.offerUrl;

            openOffer(
              url
            );

          }
        );

      }
    );

}


/* =========================================================
   LOADING
========================================================= */

function showLoading(){

  content.innerHTML = `
    <div class="offer-list">

      <div class="skeleton"></div>
      <div class="skeleton"></div>

    </div>
  `;

  offerCount.textContent =
    "Loading...";
}


/* =========================================================
   ERROR
========================================================= */

function showError(
  message
){

  offerCount.textContent =
    "Unavailable";

  content.innerHTML = `
    <div class="state">

      <div class="state-icon">

        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round">

          <circle cx="12" cy="12" r="9"/>
          <path d="M12 8v5"/>
          <path d="M12 16h.01"/>

        </svg>

      </div>

      <h3>
        We couldn't load tasks
      </h3>

      <p>
        ${escapeHtml(
          message ||
          "Please try again."
        )}
      </p>

      <button
        class="retry-btn"
        id="retryBtn"
        type="button">

        Try Again

      </button>

    </div>
  `;


  document
    .getElementById(
      "retryBtn"
    )
    ?.addEventListener(
      "click",
      loadOffers
    );

}


/* =========================================================
   LOAD OFFERS
========================================================= */

async function loadOffers(){

  showLoading();

  try{

    const {
      data:
        sessionData,
      error:
        sessionError
    } =
      await db.auth.getSession();


    if(sessionError){

      throw sessionError;

    }


    const session =
      sessionData?.session;


    if(!session){

      window.location.href =
        "login.html";

      return;

    }


    const response =
      await fetch(
        OFFERS_FUNCTION,
        {
          method:"GET",

          headers:{
            "Authorization":
              `Bearer ${session.access_token}`,

            "apikey":
              SUPABASE_KEY,

            "Content-Type":
              "application/json"
          },

          cache:"no-store"
        }
      );


    let result;

    try{

      result =
        await response.json();

    }catch(error){

      throw new Error(
        "The task service returned an invalid response."
      );

    }


    if(
      !response.ok ||
      !result?.success
    ){

      console.error(
        "get-offers response:",
        result
      );

      throw new Error(
        result?.error ||
        "Unable to load available tasks."
      );

    }


    allOffers =
      Array.isArray(
        result.offers
      )
        ? result.offers
        : [];


    /*
      Only accept the clean fields expected
      from the new get-offers function.
    */

    allOffers =
      allOffers
        .filter(
          offer =>
            offer &&
            offer.id &&
            offer.title &&
            offer.url &&
            Number(
              offer.reward
            ) > 0
        )
        .map(
          offer => ({
            id:
              String(
                offer.id
              ),

            title:
              String(
                offer.title
              ),

            description:
              String(
                offer.description ||
                ""
              ),

            category:
              ["survey","offer","app"]
                .includes(
                  offer.category
                )
                ? offer.category
                : "offer",

            reward:
              Number(
                offer.reward
              ),

            url:
              String(
                offer.url
              )
          })
        );


    renderOffers();


  }catch(error){

    console.error(
      "Offer loading error:",
      error
    );

    showError(
      error?.message ||
      "Unable to load available tasks."
    );

  }

}


/* =========================================================
   FILTERS
========================================================= */

document
  .querySelectorAll(
    ".filter"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".filter"
            )
            .forEach(
              item =>
                item.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          activeCategory =
            button.dataset.category ||
            "all";


          renderOffers();

        }
      );

    }
  );


/* =========================================================
   START
========================================================= */

loadTheme();

detectCountry();

loadOffers();

</script>
