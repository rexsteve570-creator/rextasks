<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RexTasks — Submit Task</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#04100c;
  color:#fff;
  min-height:100vh;
}

.container{
  max-width:600px;
  margin:auto;
  padding:22px 16px 40px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.logo{
  color:#35e58b;
  font-size:22px;
  font-weight:900;
}

.back{
  color:#91b3a4;
  text-decoration:none;
  font-size:14px;
}

.card{
  background:#071a13;
  border:1px solid #15523d;
  border-radius:20px;
  padding:22px;
}

h1{
  font-size:25px;
  margin-bottom:8px;
}

.subtitle{
  color:#91b3a4;
  font-size:14px;
  line-height:1.5;
  margin-bottom:22px;
}

.task-name{
  background:#0a2118;
  border:1px solid #124d38;
  border-radius:13px;
  padding:15px;
  margin-bottom:20px;
}

.task-label{
  color:#76998a;
  font-size:11px;
  margin-bottom:6px;
}

.task-title{
  font-size:17px;
  font-weight:800;
}

label{
  display:block;
  color:#d9eee4;
  font-size:14px;
  font-weight:700;
  margin-bottom:8px;
}

textarea{
  width:100%;
  min-height:150px;
  resize:vertical;
  border:1px solid #245d47;
  border-radius:13px;
  background:#04110c;
  color:#fff;
  padding:14px;
  font-family:inherit;
  font-size:14px;
  outline:none;
}

textarea:focus{
  border-color:#35e58b;
}

.help{
  color:#76998a;
  font-size:12px;
  line-height:1.5;
  margin-top:8px;
}

.submit{
  width:100%;
  margin-top:20px;
  border:0;
  border-radius:12px;
  padding:14px;
  background:linear-gradient(135deg,#35e58b,#18c878);
  color:#031009;
  font-weight:900;
  font-size:14px;
}

.submit:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  margin-top:15px;
  padding:13px;
  border-radius:11px;
  font-size:13px;
  line-height:1.5;
}

.success{
  display:block;
  background:#09291b;
  border:1px solid #1c7a4b;
  color:#8ff0b8;
}

.error{
  display:block;
  background:#321414;
  border:1px solid #703030;
  color:#ffaaaa;
}

.loading{
  text-align:center;
  color:#91b3a4;
  padding:30px 0;
}
</style>
</head>

<body>

<div class="container">

  <div class="top">
    <div class="logo">RexTasks</div>
    <a href="tasks.html" class="back">← Tasks</a>
  </div>

  <div class="card">

    <div id="loading" class="loading">
      Loading task...
    </div>

    <div id="content" style="display:none;">

      <h1>Submit Task</h1>

      <p class="subtitle">
        Complete the task first, then submit your proof for review.
      </p>

      <div class="task-name">
        <div class="task-label">
          TASK
        </div>

        <div id="taskTitle" class="task-title">
          Task
        </div>
      </div>

      <label for="proof">
        Your Proof
      </label>

      <textarea
        id="proof"
        placeholder="Enter your proof here. You can provide the required details, username, confirmation information, or other evidence requested by the task."
      ></textarea>

      <div class="help">
        Make sure your proof clearly shows that you completed the task. Your submission will be reviewed before the reward is credited.
      </div>

      <button
        id="submitBtn"
        class="submit"
        onclick="submitTask()">
        Submit for Review
      </button>

      <div id="message" class="message"></div>

    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://cetsxdkoauucxwsbdktl.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_crwxMSen3GDl9BQZfy_QLg_o_uicRCD";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let currentUser = null;
let currentTask = null;


/* =========================
   MESSAGE
========================= */

function showMessage(text,type){

  const box =
    document.getElementById("message");

  box.textContent = text;

  box.className =
    "message " + type;

}


/* =========================
   LOAD
========================= */

async function loadTask(){

  const {
    data:{
      user
    },
    error:authError
  } =
  await supabaseClient.auth.getUser();


  if(authError || !user){

    window.location.href =
      "login.html";

    return;

  }


  currentUser = user;


  const params =
    new URLSearchParams(
      window.location.search
    );


  const taskId =
    params.get("task");


  if(!taskId){

    showMessage(
      "No task was selected.",
      "error"
    );

    document.getElementById("loading").style.display="none";

    return;

  }


  const {
    data:task,
    error
  } =
  await supabaseClient
    .from("tasks")
    .select(
      "id,title,description,status,proof_required"
    )
    .eq("id",taskId)
    .eq("status","active")
    .maybeSingle();


  if(error){

    console.error(error);

    showMessage(
      "Unable to load this task.",
      "error"
    );

    document.getElementById("loading").style.display="none";

    return;

  }


  if(!task){

    showMessage(
      "This task is no longer available.",
      "error"
    );

    document.getElementById("loading").style.display="none";

    return;

  }


  currentTask = task;


  document.getElementById("taskTitle").textContent =
    task.title;


  document.getElementById("loading").style.display =
    "none";

  document.getElementById("content").style.display =
    "block";

}


/* =========================
   SUBMIT
========================= */

async function submitTask(){

  if(!currentUser || !currentTask){

    return;

  }


  const proof =
    document
      .getElementById("proof")
      .value
      .trim();


  if(!proof){

    showMessage(
      "Please enter your proof before submitting.",
      "error"
    );

    return;

  }


  if(proof.length < 5){

    showMessage(
      "Please provide more details in your proof.",
      "error"
    );

    return;

  }


  const button =
    document.getElementById("submitBtn");


  button.disabled = true;

  button.textContent =
    "Submitting...";


  /*
    IMPORTANT:

    We intentionally do NOT send payout
    or user_reward from the browser.

    Those values will be calculated securely
    when an admin approves the submission.
  */


  const {
    error
  } =
  await supabaseClient
    .from("task_submissions")
    .insert({

      task_id:
        currentTask.id,

      user_id:
        currentUser.id,

      proof:
        proof,

      status:
        "pending"

    });


  if(error){

    console.error(error);

    button.disabled = false;

    button.textContent =
      "Submit for Review";


    showMessage(
      "We couldn't submit your proof. Please try again.",
      "error"
    );

    return;

  }


  showMessage(
    "Your task has been submitted successfully and is now pending review.",
    "success"
  );


  button.textContent =
    "Submitted";


  button.disabled = true;


  setTimeout(function(){

    window.location.href =
      "dashboard.html";

  },1800);

}


/* START */

loadTask();

</script>

</body>
</html>
